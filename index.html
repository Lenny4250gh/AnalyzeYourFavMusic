        const generateQuizQuestions = (stats, t, lang) => {
            if (!stats) return [];
            const questions = [];
            const fmt = (n) => Math.round(n).toLocaleString(lang === 'it' ? 'it-IT' : 'en-US');

            const numericDistractors = (correct, factors) => {
                const set = new Set();
                let guard = 0;
                while (set.size < 3 && guard < 50) {
                    guard++;
                    const f = factors[Math.floor(Math.random() * factors.length)];
                    const val = Math.max(1, Math.round(correct * f));
                    if (val !== correct) set.add(val);
                }
                return Array.from(set);
            };

            // 1. Top artist
            if (stats.topArtisti.length >= 4) {
                const correct = stats.topArtisti[0][0];
                const pool = stats.topArtisti.slice(1).map(a => a[0]);
                const wrong = shuffleArray(pool).slice(0, 3);
                questions.push({ id: 'artist', question: t.qArtistTitle, options: shuffleArray([correct, ...wrong]), correct });
            }

            // 2. Top track
            if (stats.topBrani.length >= 4) {
                const correct = stats.topBrani[0][0]; // Rimosso split
                const pool = stats.topBrani.slice(1).map(b => b[0]).filter(x => x !== correct);
                const wrong = shuffleArray(pool).slice(0, 3);
                if (wrong.length === 3) questions.push({ id: 'track', question: t.qTrackTitle, options: shuffleArray([correct, ...wrong]), correct });
            }

            // 3. Top album
            if (stats.topAlbum.length >= 4) {
                const correct = stats.topAlbum[0][0]; // Rimosso split
                const pool = stats.topAlbum.slice(1).map(al => al[0]).filter(x => x !== correct);
                const wrong = shuffleArray(pool).slice(0, 3);
                if (wrong.length === 3) questions.push({ id: 'album', question: t.qAlbumTitle, options: shuffleArray([correct, ...wrong]), correct });
            }

            // 4. Most active weekday
            {
                const sorted = [...stats.weekdayFull].sort((a, b) => b.count - a.count);
                if (sorted[0].count > 0) {
                    const correct = sorted[0].nome;
                    const wrong = shuffleArray(sorted.slice(1).map(w => w.nome)).slice(0, 3);
                    questions.push({ id: 'weekday', question: t.qWeekdayTitle, options: shuffleArray([correct, ...wrong]), correct });
                }
            }

            // 5. Favorite time slot
            if (stats.date.fasciaTop && stats.date.fasciaTop !== t.na) {
                const correct = stats.date.fasciaTop;
                const wrong = t.slots.filter(s => s !== correct);
                questions.push({ id: 'timeslot', question: t.qTimeSlotTitle, options: shuffleArray([correct, ...wrong]), correct });
            }

            // 6. Total streams
            {
                const correct = stats.totali;
                const distractors = numericDistractors(correct, [0.5, 0.7, 1.4, 1.8, 2.2]);
                if (distractors.length === 3) {
                    questions.push({ id: 'streams', question: t.qStreamsTitle, options: shuffleArray([correct, ...distractors]).map(fmt), correct: fmt(correct) });
                }
            }

            // 7. Total hours
            {
                const correct = Math.round(stats.minutiTotali / 60);
                const distractors = numericDistractors(correct, [0.4, 0.6, 1.5, 2, 2.5]);
                if (distractors.length === 3) {
                    questions.push({ id: 'hours', question: t.qMinutesTitle, options: shuffleArray([correct, ...distractors]).map(fmt), correct: fmt(correct) });
                }
            }

            // 8. Unique artists
            {
                const correct = stats.artistiUnici;
                const distractors = numericDistractors(correct, [0.4, 0.6, 1.5, 2, 2.8]);
                if (distractors.length === 3) {
                    questions.push({ id: 'uniqueartists', question: t.qArtistsUniqueTitle, options: shuffleArray([correct, ...distractors]).map(fmt), correct: fmt(correct) });
                }
            }

            // 9. Compare two artists
            if (stats.topArtisti.length >= 5) {
                const idxA = Math.floor(Math.random() * Math.min(3, stats.topArtisti.length));
                let idxB = 3 + Math.floor(Math.random() * (stats.topArtisti.length - 3));
                if (idxB <= idxA) idxB = Math.min(stats.topArtisti.length - 1, idxA + 3);
                const a = stats.topArtisti[idxA];
                const b = stats.topArtisti[idxB];
                if (a && b && a[0] !== b[0] && a[1] !== b[1]) {
                    const correct = a[1] > b[1] ? a[0] : b[0];
                    questions.push({ id: 'compare', question: t.qCompareTitle, options: shuffleArray([a[0], b[0]]), correct });
                }
            }

            return shuffleArray(questions).slice(0, 8);
        };

        function App() {
            const [lang, setLang] = useState(detectLang());
            const t = DICT[lang];

            const [ascolti, setAscolti] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [error, setError] = useState('');
            const [filterMode, setFilterMode] = useState('all');
            const [selectedYear, setSelectedYear] = useState('all');
            const [dateFrom, setDateFrom] = useState('');
            const [dateTo, setDateTo] = useState('');
            const [showGuide, setShowGuide] = useState(false);
            const [showQuiz, setShowQuiz] = useState(false);
            const [quizSeed, setQuizSeed] = useState(0);
            const [quizPhase, setQuizPhase] = useState('intro'); // intro | playing | finished | no_data
            const [quizIndex, setQuizIndex] = useState(0);
            const [quizScore, setQuizScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [answered, setAnswered] = useState(false);
            const [quizHistory, setQuizHistory] = useState({});
            const [postLoadChoiceMade, setPostLoadChoiceMade] = useState(false);
            const [showWrapped, setShowWrapped] = useState(false);
            const [wrappedIndex, setWrappedIndex] = useState(0);
            const wrappedCardRef = useRef(null);

            useEffect(() => {
                document.documentElement.lang = lang;
            }, [lang]);

            const processFiles = async (files) => {
                setIsProcessing(true);
                setError('');
                let tuttiAscolti = [];

                try {
                    const filesToParse = [];

                    for (const file of files) {
                        if (file.name.endsWith('.zip')) {
                            const zip = await JSZip.loadAsync(file);
                            for (const relativePath in zip.files) {
                                const zipEntry = zip.files[relativePath];
                                if (!zipEntry.dir && (relativePath.endsWith('.json') || relativePath.endsWith('.csv'))) {
                                    const content = await zipEntry.async('string');
                                    filesToParse.push({ name: relativePath, text: content });
                                }
                            }
                        } else if (file.name.endsWith('.json') || file.name.endsWith('.csv')) {
                            const text = await file.text();
                            filesToParse.push({ name: file.name, text: text });
                        }
                    }

                    for (const itemFile of filesToParse) {
                        if (itemFile.name.endsWith('.csv')) {
                            const lines = itemFile.text.split('\n');
                            for (let j = 1; j < lines.length; j++) {
                                const line = lines[j].trim();
                                if (!line) continue;
                                const cols = parseCsvRow(line);
                                if (cols.length >= 6) {
                                    const dt = parseDate(cols[0]);
                                    if (dt && !isNaN(dt.getTime())) {
                                        tuttiAscolti.push({
                                            fonte: cols[1],
                                            artista: cols[2],
                                            titolo: cols[3],
                                            album: cols[4] || null,
                                            data: dt,
                                            ms_played: (parseFloat(cols[5]) || 0) * 60000
                                        });
                                    }
                                }
                            }
                            continue;
                        }

                        if (itemFile.name.endsWith('.json')) {
                            let data;
                            try {
                                data = JSON.parse(itemFile.text);
                            } catch (e) {
                                continue;
                            }

                            if (Array.isArray(data) && data.length > 0 && data[0].header === 'YouTube Music') {
                                data.forEach(item => {
                                    if (item.header !== 'YouTube Music') return;
                                    let nomeArtista = 'Artista Sconosciuto';
                                    const subtitles = item.subtitles || [];
                                    if (subtitles.length > 0) {
                                        nomeArtista = subtitles[0].name || nomeArtista;
                                        if (nomeArtista.endsWith(' - Topic')) nomeArtista = nomeArtista.replace(' - Topic', '');
                                    }
                                    nomeArtista = nomeArtista.trim();

                                    let titolo = (item.title || '').trim();
                                    const prefissi = ['Hai guardato ', 'Watched ', 'Hai ascoltato ', 'Listened to '];
                                    for (let prefisso of prefissi) {
                                        if (titolo.startsWith(prefisso)) {
                                            titolo = titolo.replace(prefisso, '').trim();
                                            break;
                                        }
                                    }

                                    if (titolo && titolo !== 'a video that has been removed' && !titolo.toLowerCase().includes('video non disponibile') && !isUnknown(nomeArtista, titolo)) {
                                        const dt = parseDate(item.time);
                                        if (dt) {
                                            const stimaDurataMediaMs = 180000; 
                                            tuttiAscolti.push({ fonte: 'YTMusic', artista: nomeArtista, titolo: titolo, album: null, data: dt, ms_played: stimaDurataMediaMs });
                                        }
                                    }
                                });
                            } else {
                                const items = data.items ? data.items : (Array.isArray(data) ? data : []);
                                items.forEach(item => {
                                    const artista = item.artistName || item.master_metadata_album_artist_name;
                                    const brano = item.trackName || item.master_metadata_track_name;
                                    const msPlayed = item.msPlayed || item.ms_played || 0;
                                    const album = item.master_metadata_album_album_name || null;

                                    if (artista && brano && msPlayed > 30000) {
                                        const artClean = artista.trim();
                                        const titClean = brano.trim();
                                        const albumClean = album ? album.trim() : null;

                                        if (!isUnknown(artClean, titClean)) {
                                            const dataStr = item.endTime || item.ts;
                                            const dt = parseDate(dataStr);
                                            if (dt) {
                                                tuttiAscolti.push({ fonte: 'Spotify', artista: artClean, titolo: titClean, album: albumClean, data: dt, ms_played: msPlayed });
                                            }
                                        }
                                    }
                                });
                            }
                        }
                    }

                    if (tuttiAscolti.length === 0) {
                        setError(t.errNoData);
                    } else {
                        setAscolti(tuttiAscolti);
                    }
                } catch (err) {
                    console.error(err);
                    setError(t.errReading);
                }
                setIsProcessing(false);
            };

            const handleDrop = useCallback((e) => {
                e.preventDefault();
                processFiles(Array.from(e.dataTransfer.files));
                if (document.activeElement) document.activeElement.blur();
                window.focus();
            }, [lang]);

            const handleFileInput = (e) => {
                processFiles(Array.from(e.target.files));
                e.target.blur();
                window.focus();
            };

            const resetFiltri = () => {
                setFilterMode('all');
                setSelectedYear('all');
                setDateFrom('');
                setDateTo('');
            };

            const esportaCSV = (filteredData) => {
                if (!filteredData || filteredData.length === 0) return;
                const header = 'Date,Source,Artist,Title,Album,MinutesPlayed\n';
                const rows = filteredData.map(a => {
                    const dataStr = a.data.toLocaleString(lang === 'it' ? 'it-IT' : 'en-US');
                    const escape = (s) => `"${(s || '').toString().replace(/"/g, '""')}"`;
                    return [escape(dataStr), escape(a.fonte), escape(a.artista), escape(a.titolo), escape(a.album || ''), (a.ms_played / 60000).toFixed(2)].join(',');
                }).join('\n');
                const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `analyze_your_fav_music_export_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const datiFiltrati = useMemo(() => {
                if (ascolti.length === 0) return [];
                if (filterMode === 'year' && selectedYear !== 'all') {
                    return ascolti.filter(a => a.data.getFullYear().toString() === selectedYear);
                }
                if (filterMode === 'range' && (dateFrom || dateTo)) {
                    const from = dateFrom ? new Date(dateFrom + 'T00:00:00') : null;
                    const to = dateTo ? new Date(dateTo + 'T23:59:59') : null;
                    return ascolti.filter(a => (!from || a.data >= from) && (!to || a.data <= to));
                }
                return ascolti;
            }, [ascolti, filterMode, selectedYear, dateFrom, dateTo]);

            const stats = useMemo(() => {
                if (ascolti.length === 0) return null;
                const filtered = datiFiltrati;
                if (filtered.length === 0) return null;

                const ytmCount = filtered.filter(a => a.fonte === 'YTMusic').length;
                const spCount = filtered.filter(a => a.fonte === 'Spotify').length;
                const minutiTotali = Math.floor(filtered.reduce((acc, curr) => acc + curr.ms_played, 0) / 60000);

                const artistiCount = {};
                const braniCount = {};
                const albumCount = {};
                const giorniCount = {};
                const mesiCount = {};
                const mesiArtistiCount = {};
                const weekdayCount = {};
                const fasceCount = {};

                let minDate = filtered[0].data;
                let maxDate = filtered[0].data;

                filtered.forEach(a => {
                    artistiCount[a.artista] = (artistiCount[a.artista] || 0) + 1;
                    const chiaveBrano = `${a.titolo} -|- ${a.artista}`;
                    braniCount[chiaveBrano] = (braniCount[chiaveBrano] || 0) + 1;
                    if (a.album) albumCount[`${a.album} -|- ${a.artista}`] = (albumCount[`${a.album} -|- ${a.artista}`] || 0) + 1;

                    if (a.data < minDate) minDate = a.data;
                    if (a.data > maxDate) maxDate = a.data;

                    const y = a.data.getFullYear(), m = String(a.data.getMonth() + 1).padStart(2, '0'), d = String(a.data.getDate()).padStart(2, '0');
                    const dateStr = `${y}-${m}-${d}`;
                    giorniCount[dateStr] = (giorniCount[dateStr] || 0) + 1;

                    const meseStr = `${a.data.getFullYear()}-${a.data.getMonth()}`;
                    mesiCount[meseStr] = (mesiCount[meseStr] || 0) + 1;
                    if (!mesiArtistiCount[meseStr]) mesiArtistiCount[meseStr] = {};
                    mesiArtistiCount[meseStr][a.artista] = (mesiArtistiCount[meseStr][a.artista] || 0) + 1;

                    weekdayCount[a.data.getDay()] = (weekdayCount[a.data.getDay()] || 0) + 1;

                    const fasciaIdx = getFasciaIndex(a.data.getHours());
                    fasceCount[fasciaIdx] = (fasceCount[fasciaIdx] || 0) + 1;
                });

                const sortObject = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1]);

                const topMeseRaw = sortObject(mesiCount)[0];
                let topMeseNome = t.na;
                if (topMeseRaw) {
                    const [anno, mese] = topMeseRaw[0].split('-');
                    topMeseNome = `${t.months[parseInt(mese)]} ${anno}`;
                }

                const weekdayFull = t.days.map((nome, idx) => ({ nome, count: weekdayCount[idx] || 0 }));
                const maxWeekday = Math.max(1, ...weekdayFull.map(w => w.count));

                const monthlyTopArtists = Object.entries(mesiArtistiCount)
                    .map(([key, counts]) => {
                        const [annoM, meseM] = key.split('-').map(Number);
                        const top = sortObject(counts)[0];
                        return {
                            key,
                            anno: annoM,
                            mese: meseM,
                            label: `${t.months[meseM].slice(0, 3)} ${annoM}`,
                            fullLabel: `${t.months[meseM]} ${annoM}`,
                            artist: top ? top[0] : null,
                            count: top ? top[1] : 0
                        };
                    })
                    .filter(m => m.artist)
                    .sort((a, b) => a.anno - b.anno || a.mese - b.mese);

                return {
                    totali: filtered.length,
                    ytmCount, spCount, minutiTotali,
                    artistiUnici: Object.keys(artistiCount).length,
                    braniUnici: Object.keys(braniCount).length,
                    albumUnici: Object.keys(albumCount).length,
                    topArtisti: sortObject(artistiCount).slice(0, 10),
                    topArtistiPerGeneri: sortObject(artistiCount).slice(0, 40),
                    topBrani: sortObject(braniCount).filter(b => b[1] > 1).slice(0, 10),
                    topAlbum: sortObject(albumCount).filter(b => b[1] > 1).slice(0, 10),
                    weekdayFull, maxWeekday, monthlyTopArtists,
                    date: {
                        inizio: minDate,
                        fine: maxDate,
                        giornoTop: sortObject(giorniCount)[0] ? { data: sortObject(giorniCount)[0][0], count: sortObject(giorniCount)[0][1] } : null,
                        meseTop: topMeseNome,
                        meseCount: topMeseRaw ? topMeseRaw[1] : 0,
                        giornoSettimanaTop: sortObject(weekdayCount)[0] ? t.days[sortObject(weekdayCount)[0][0]] : t.na,
                        fasciaTop: sortObject(fasceCount)[0] ? t.slots[sortObject(fasceCount)[0][0]] : t.na
                    }
                };
            }, [datiFiltrati, lang]);

            const topArtistName = stats?.topArtisti?.[0]?.[0] || null;
            const [topGenre, setTopGenre] = useState(null);
            useEffect(() => {
                let cancelled = false;
                if (!topArtistName) { setTopGenre(null); return; }
                setTopGenre(null);
                (async () => {
                    try {
                        let results = await searchITunesDirect(topArtistName, 'musicArtist');
                        let found = results.find(r => r.primaryGenreName)?.primaryGenreName;
                        if (!found) {
                            results = await searchITunesDirect(topArtistName, 'song');
                            found = results.find(r => normalizeForMatch(r.artistName) === normalizeForMatch(topArtistName) && r.primaryGenreName)?.primaryGenreName;
                        }
                        if (!cancelled) setTopGenre(found || null);
                    } catch (e) {
                        if (!cancelled) setTopGenre(null);
                    }
                })();
                return () => { cancelled = true; };
            }, [topArtistName]);

            // Calcola i generi ascoltati basandosi sui generi dei tuoi artisti principali (approccio best-effort via iTunes)
            const [genreStats, setGenreStats] = useState({ loading: false, count: 0, top5: [] });
            useEffect(() => {
                let cancelled = false;
                const artistsForGenres = stats?.topArtistiPerGeneri || [];
                if (artistsForGenres.length === 0) {
                    setGenreStats({ loading: false, count: 0, top5: [] });
                    return;
                }
                setGenreStats({ loading: true, count: 0, top5: [] });
                (async () => {
                    const genreCounts = {};
                    await Promise.all(artistsForGenres.map(async ([name, count]) => {
                        const genre = await fetchArtistGenre(name);
                        if (genre) genreCounts[genre] = (genreCounts[genre] || 0) + count;
                    }));
                    if (cancelled) return;
                    const sorted = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]);
                    setGenreStats({ loading: false, count: sorted.length, top5: sorted.slice(0, 5) });
                })();
                return () => { cancelled = true; };
            }, [stats]);

            useEffect(() => {
                const topArtistName = stats?.topArtisti?.[0]?.[0];
                if (!topArtistName) return;
                // Precarica e converte la foto dell'artista #1 non appena i dati sono pronti (Promise condivisa, no doppioni)
                getArtistPhotoDataUrl(topArtistName);
            }, [stats]);

            const anniDisponibili = useMemo(() => {
                const anni = new Set();
                ascolti.forEach(a => anni.add(a.data.getFullYear()));
                return Array.from(anni).sort((a, b) => b - a);
            }, [ascolti]);

            const quizQuestions = useMemo(() => generateQuizQuestions(stats, t, lang), [stats, quizSeed, lang]);

            // Domande del mini-quiz integrato come "storia" dentro il Wrapped (indipendenti dal quiz del modal)
            const storyQuizQuestions = useMemo(() => generateQuizQuestions(stats, t, lang).filter(q => q.id === 'track'), [stats, lang]);
            const [storyQuizAnswers, setStoryQuizAnswers] = useState({});
            const answerStoryQuiz = useCallback((qid, option) => {
                setStoryQuizAnswers(prev => (prev[qid] !== undefined ? prev : { ...prev, [qid]: option }));
            }, []);

            const openQuiz = () => {
                setShowQuiz(true);
                setQuizPhase('intro');
                setQuizIndex(0);
                setQuizScore(0);
                setSelectedOption(null);
                setAnswered(false);
            };

            const startQuiz = () => {
                if (quizQuestions && quizQuestions.length > 0) {
                    setQuizSeed(s => s + 1);
                    setQuizPhase('playing');
                    setQuizIndex(0);
                    setQuizScore(0);
                    setSelectedOption(null);
                    setAnswered(false);
                    setQuizHistory({});
                } else {
                    setQuizPhase('no_data');
                }
            };

            const answerQuiz = (option) => {
                if (answered) return;
                setSelectedOption(option);
                setAnswered(true);
                const current = quizQuestions[quizIndex];
                const isCorrect = !!(current && option === current.correct);
                if (isCorrect) {
                    setQuizScore(s => s + 1);
                }
                setQuizHistory(h => ({ ...h, [quizIndex]: { option, isCorrect } }));
            };

            const nextQuizQuestion = () => {
                if (quizIndex + 1 < quizQuestions.length) {
                    const nextIndex = quizIndex + 1;
                    setQuizIndex(nextIndex);
                    const prevAnswer = quizHistory[nextIndex];
                    if (prevAnswer) {
                        setSelectedOption(prevAnswer.option);
                        setAnswered(true);
                    } else {
                        setSelectedOption(null);
                        setAnswered(false);
                    }
                } else {
                    setQuizPhase('finished');
                }
            };

            const prevQuizQuestion = () => {
                if (quizIndex > 0) {
                    const prevIndex = quizIndex - 1;
                    setQuizIndex(prevIndex);
                    const prevAnswer = quizHistory[prevIndex];
                    if (prevAnswer) {
                        setSelectedOption(prevAnswer.option);
                        setAnswered(true);
                    } else {
                        setSelectedOption(null);
                        setAnswered(false);
                    }
                }
            };

            const closeQuiz = () => setShowQuiz(false);

            const nfWrapped = (n) => Math.round(n).toLocaleString(lang === 'it' ? 'it-IT' : 'en-US');

            // Indice della "sotto-storia" corrente all'interno della slide "artista del mese"
            const [monthlyStoryIdx, setMonthlyStoryIdx] = useState(0);

            const wrappedSlides = useMemo(() => {
                if (!stats) return [];
                const slides = [];
                const dateFmt = (d) => d.toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US', { day: 'numeric', month: 'short', year: 'numeric' });

                // 0. Copertina
                slides.push({
                    gradient: 'from-purple-600 via-fuchsia-600 to-pink-600',
                    content: (
                        <div className="flex flex-col items-center justify-center gap-6">
                            <div className="w-20 h-20 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center animate-float">
                                <IconMusic className="w-10 h-10 text-white" />
                            </div>
                            <h2 className="font-display text-4xl sm:text-5xl font-black text-white leading-tight">{t.wrappedCoverTitle}</h2>
                            <p className="text-white/80 text-sm sm:text-base">{t.wrappedCoverSubtitle(dateFmt(stats.date.inizio), dateFmt(stats.date.fine))}</p>
                            <p className="text-white/60 text-xs mt-10 animate-pulse">{t.wrappedTapHint}</p>
                        </div>
                    )
                });

                // 1. Minuti ascoltati
                const hoursW = Math.round(stats.minutiTotali / 60);
                const daysW = Math.floor(stats.minutiTotali / 1440);
                slides.push({
                    gradient: 'from-indigo-600 via-blue-600 to-cyan-500',
                    content: (
                        <div className="flex flex-col items-center gap-4">
                            <IconClock className="w-10 h-10 text-white/80" />
                            <p className="font-display text-7xl sm:text-8xl font-black text-white">{nfWrapped(stats.minutiTotali)}</p>
                            <p className="text-white text-lg font-bold">{t.wrappedMinutesTitle}</p>
                            <p className="text-white/70 text-sm max-w-xs">{t.wrappedMinutesSub(nfWrapped(hoursW), nfWrapped(daysW))}</p>
                        </div>
                    )
                });

                // 2. Numero generi ascoltati
                slides.push({
                    gradient: 'from-teal-500 via-cyan-500 to-blue-500',
                    content: (
                        <div className="flex flex-col items-center gap-4">
                            <IconTag className="w-8 h-8 text-white/70 mt-1" />
                            <p className="font-display text-7xl sm:text-8xl font-black text-white">
                                {genreStats.loading ? '…' : (genreStats.count > 0 ? nfWrapped(genreStats.count) : t.na)}
                            </p>
                            <p className="text-white text-lg font-bold">{t.wrappedGenresTitle}</p>
                            <p className="text-white/70 text-sm max-w-xs">{t.wrappedGenresSub}</p>
                        </div>
                    )
                });

                // 3. Top 5 generi ascoltati
                if (genreStats.top5.length > 0) {
                    slides.push({
                        gradient: 'from-emerald-500 via-teal-500 to-cyan-600',
                        content: (
                            <div className="flex flex-col items-center gap-5 w-full">
                                <p className="text-white text-xl font-bold -mt-1 mb-1">{t.wrappedTopGenresListTitle}</p>
                                <div className="w-full max-w-xs flex flex-col gap-3">
                                    {genreStats.top5.map(([name], idx) => (
                                        <div key={name} className="flex items-center gap-3 bg-white/10 rounded-xl px-4 py-2.5">
                                            <span className="font-display text-xl font-black text-white/70 w-5">{idx + 1}</span>
                                            <span className="flex-1 text-white font-semibold text-sm text-left truncate">{name}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )
                    });
                }

                // 4. Numero brani ascoltati
                slides.push({
                    gradient: 'from-red-500 via-rose-500 to-pink-600',
                    content: (
                        <div className="flex flex-col items-center gap-4">
                            <IconMusic className="w-8 h-8 text-white/70 mt-1" />
                            <p className="font-display text-7xl sm:text-8xl font-black text-white">{nfWrapped(stats.braniUnici)}</p>
                            <p className="text-white text-lg font-bold">{t.wrappedTracksCountTitle}</p>
                            <p className="text-white/70 text-sm max-w-xs">{t.wrappedTracksCountSub}</p>
                        </div>
                    )
                });


                // 5. Quiz: indovina il brano #1
                storyQuizQuestions.forEach((q, qi) => {
                    const answeredQ = storyQuizAnswers[q.id] !== undefined;
                    const selectedQ = storyQuizAnswers[q.id];
                    const isEntityQ = ['artist', 'track', 'album', 'compare'].includes(q.id);

                    slides.push({
                        gradient: 'from-violet-700 via-purple-700 to-fuchsia-700',
                        content: (
                            <div className="flex flex-col items-center justify-center gap-4 w-full h-full" onClick={(e) => e.stopPropagation()}>
                                <p className="text-white/70 text-xs uppercase tracking-widest font-bold">{t.quizQuestionOf(qi + 1, storyQuizQuestions.length)}</p>
                                <h3 className="font-display text-xl sm:text-2xl font-black text-white leading-tight px-2">{q.question}</h3>
                                <div className="w-full flex flex-col gap-2.5 px-1 max-h-[48vh] overflow-y-auto">
                                    {q.options.map((option, idx) => {
                                        let displayTitleQ = option;
                                        let queryArtistQ = null;
                                        let queryTitleQ = option;
                                        if (q.id === 'track' || q.id === 'album') {
                                            const parts = String(option).split(' -|- ');
                                            displayTitleQ = parts[0];
                                            queryTitleQ = parts[0];
                                            if (parts.length > 1) queryArtistQ = parts[1];
                                        } else if (q.id === 'artist' || q.id === 'compare') {
                                            queryArtistQ = option;
                                        }

                                        let clsQ = 'bg-white/10 border-transparent text-white';
                                        if (answeredQ) {
                                            if (option === q.correct) clsQ = 'bg-emerald-500/25 border-emerald-400 text-white';
                                            else if (option === selectedQ) clsQ = 'bg-red-500/25 border-red-400 opacity-70 text-white';
                                            else clsQ = 'bg-black/20 border-transparent text-white/40 opacity-50';
                                        }

                                        return (
                                            <button
                                                key={idx}
                                                onClick={(e) => { e.stopPropagation(); if (!answeredQ) answerStoryQuiz(q.id, option); }}
                                                disabled={answeredQ}
                                                className={`relative w-full flex items-center p-3 rounded-2xl border-2 transition-all duration-200 transform-gpu active:scale-[0.98] text-left overflow-hidden ${clsQ} ${isEntityQ ? 'h-16 sm:h-20' : ''}`}
                                            >
                                                {isEntityQ && (
                                                    <EntityImageBox
                                                        artist={queryArtistQ}
                                                        title={queryTitleQ}
                                                        type={q.id === 'artist' || q.id === 'compare' ? 'artist' : q.id}
                                                        altText={displayTitleQ}
                                                        boxClassName={`relative flex-shrink-0 mr-3 overflow-hidden bg-white/10 flex items-center justify-center w-11 h-11 sm:w-14 sm:h-14 ${q.id === 'artist' || q.id === 'compare' ? 'rounded-full' : 'rounded-lg'}`}
                                                        imgClassName="w-full h-full"
                                                    />
                                                )}
                                                <span className="font-bold leading-tight text-sm sm:text-base flex flex-col justify-center">
                                                    <span className="line-clamp-2">{displayTitleQ}</span>
                                                    {queryArtistQ && (q.id === 'track' || q.id === 'album') && (
                                                        <span className="text-xs text-gray-300 font-normal mt-0.5 truncate">{queryArtistQ}</span>
                                                    )}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                                {answeredQ && (
                                    <p className={`text-sm font-bold animate-fadein ${selectedQ === q.correct ? 'text-emerald-300' : 'text-red-300'}`}>
                                        {selectedQ === q.correct ? t.quizCorrect : `${t.quizWrong} — ${t.quizCorrectWas(String(q.correct).split(' -|- ')[0])}`}
                                    </p>
                                )}
                                <p className="text-white/40 text-[11px] mt-1">{answeredQ ? t.wrappedQuizTapContinue : t.wrappedQuizChoose}</p>
                            </div>
                        )
                    });
                });

                // 6. Top 5 brani più ascoltati
                if (stats.topBrani.length >= 3) {
                    slides.push({
                        gradient: 'from-cyan-600 via-sky-600 to-blue-600',
                        content: (
                            <div className="flex flex-col items-center gap-5 w-full">
                                <p className="text-white text-xl font-bold mb-2">{t.wrappedTopTracksListTitle}</p>
                                <div className="w-full max-w-xs flex flex-col gap-3">
                                    {stats.topBrani.slice(0, 5).map(([keyT, count], idx) => {
                                        const [title, artist] = keyT.split(' -|- ');
                                        return (
                                            <div key={keyT} className="flex items-center gap-3 bg-white/10 rounded-xl px-3 py-2.5">
                                                <span className="font-display text-xl font-black text-white/70 w-5 flex-shrink-0">{idx + 1}</span>
                                                <EntityImageBox artist={artist} title={title} type="track" altText={title} boxClassName="w-11 h-11 rounded-lg overflow-hidden bg-white/10 flex-shrink-0" imgClassName="w-full h-full" />
                                                <span className="flex-1 min-w-0 text-left">
                                                    <span className="block text-white font-semibold text-sm truncate">{title}</span>
                                                    <span className="block text-white/60 text-xs truncate">{artist}</span>
                                                </span>
                                                <span className="text-white/60 text-xs flex-shrink-0">{nfWrapped(count)}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )
                    });
                }

                // 7. Numero artisti ascoltati
                slides.push({
                    gradient: 'from-orange-500 via-amber-500 to-yellow-400',
                    content: (
                        <div className="flex flex-col items-center gap-4">
                            <IconMic className="w-8 h-8 text-white/70 mt-1" />
                            <p className="font-display text-7xl sm:text-8xl font-black text-white">{nfWrapped(stats.artistiUnici)}</p>
                            <p className="text-white text-lg font-bold">{t.wrappedArtistsCountTitle}</p>
                            <p className="text-white/70 text-sm max-w-xs">{t.wrappedArtistsCountSub}</p>
                        </div>
                    )
                });

                // 8. Top 5 artisti più ascoltati (ordine casuale)
                if (stats.topArtisti.length >= 3) {
                    const shuffledTop5Artists = shuffleArray(stats.topArtisti.slice(0, 5).map(([name]) => name));
                    slides.push({
                        gradient: 'from-purple-500 via-violet-500 to-indigo-500',
                        content: (
                            <div className="flex flex-col items-center gap-5 w-full">
                                <p className="text-white text-xl font-bold mb-2">{t.wrappedRandomArtistsListTitle}</p>
                                <div className="w-full max-w-xs flex flex-col gap-3">
                                    {shuffledTop5Artists.map((name) => (
                                        <div key={name} className="flex items-center gap-3 bg-white/10 rounded-xl px-3 py-2.5">
                                            <EntityImageBox artist={name} type="artist" altText={name} boxClassName="w-11 h-11 rounded-full overflow-hidden bg-white/10 flex-shrink-0" imgClassName="w-full h-full" />
                                            <span className="flex-1 text-white font-semibold text-sm text-left truncate">{name}</span>
                                        </div>
                                    ))}
                                </div>
                                <p className="text-white/50 text-xs">{t.wrappedRandomArtistsListSub}</p>
                            </div>
                        )
                    });
                }

                // 9. Top artista più ascoltato di ogni mese (se il periodo copre più mesi)
                if (stats.monthlyTopArtists && stats.monthlyTopArtists.length > 1) {
                    slides.push({
                        gradient: 'from-violet-600 via-indigo-600 to-blue-600',
                        isMonthly: true,
                        content: (
                            <MonthlyTopArtistsStory
                                months={stats.monthlyTopArtists}
                                title={t.wrappedMonthlyArtistsTitle}
                                subtitle={t.wrappedMonthlyArtistsSub}
                                idx={monthlyStoryIdx}
                                onIdxChange={setMonthlyStoryIdx}
                                onFinish={() => nextWrappedSlide()}
                            />
                        )
                    });
                }

                // 10. Top artista più ascoltato
                if (stats.topArtisti.length > 0) {
                    const [artistName, artistCount] = stats.topArtisti[0];
                    slides.push({
                        gradient: 'from-amber-500 via-orange-500 to-red-500',
                        content: (
                            <div className="flex flex-col items-center gap-4">
                                <IconTrophy className="w-8 h-8 text-white/90" />
                                <p className="text-white/80 text-sm uppercase tracking-wider font-semibold">{t.wrappedTopArtistLabel}</p>
                                <EntityImageBox artist={artistName} type="artist" altText={artistName} boxClassName="w-36 h-36 rounded-full overflow-hidden bg-white/10 border-4 border-white/30 shadow-xl flex items-center justify-center" imgClassName="w-full h-full rounded-full" />
                                <p className="font-display text-3xl sm:text-4xl font-black text-white text-center px-4 break-words">{artistName}</p>
                                <p className="text-white/80 text-sm">{t.wrappedTopArtistSub(nfWrapped(artistCount))}</p>
                            </div>
                        )
                    });
                }

                // 11. Top 5 artisti più ascoltati (in ordine)
                if (stats.topArtisti.length >= 3) {
                    slides.push({
                        gradient: 'from-fuchsia-600 via-purple-600 to-indigo-600',
                        content: (
                            <div className="flex flex-col items-center gap-5 w-full">
                                <p className="text-white text-xl font-bold mb-2">{t.wrappedTopArtistsListTitle}</p>
                                <div className="w-full max-w-xs flex flex-col gap-3">
                                    {stats.topArtisti.slice(0, 5).map(([name, count], idx) => (
                                        <div key={name} className="flex items-center gap-3 bg-white/10 rounded-xl px-3 py-2.5">
                                            <span className="font-display text-xl font-black text-white/70 w-5 flex-shrink-0">{idx + 1}</span>
                                            <EntityImageBox artist={name} type="artist" altText={name} boxClassName="w-11 h-11 rounded-full overflow-hidden bg-white/10 flex-shrink-0" imgClassName="w-full h-full" />
                                            <span className="flex-1 text-white font-semibold text-sm text-left truncate">{name}</span>
                                            <span className="text-white/60 text-xs flex-shrink-0">{nfWrapped(count)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )
                    });
                }

                // 12. Riassunto finale
                const topArtistNameW = stats.topArtisti[0] ? stats.topArtisti[0][0] : t.na;
                const topTrackKeyW = stats.topBrani[0] ? stats.topBrani[0][0] : null;
                const topTrackTitleW = topTrackKeyW ? topTrackKeyW.split(' -|- ')[0] : t.na;
                const recapGenreW = topGenre || (genreStats.top5[0] ? genreStats.top5[0][0] : null);
                slides.push({
                    gradient: 'from-neutral-100 to-neutral-100',
                    isRecap: true,
                    content: (
                        <div className="w-full h-full flex items-center justify-center">
                            <div ref={wrappedCardRef} className="relative flex flex-col w-full max-w-[320px] bg-[#f4f2ec] text-black rounded-2xl overflow-hidden">
                                <div
                                    className="absolute inset-0 opacity-[0.06] pointer-events-none"
                                    style={{ backgroundImage: 'repeating-linear-gradient(135deg, #000 0px, #000 2px, transparent 2px, transparent 16px)' }}
                                ></div>

                                <div className="relative flex flex-col px-5 pt-5">
                                    <div className="w-full aspect-[4/3] rounded-xl overflow-hidden bg-black/10 mb-5 flex-shrink-0 flex items-center justify-center">
                                        {topArtistNameW && topArtistNameW !== t.na ? (
                                            <RecapArtistPhoto artist={topArtistNameW} altText={topArtistNameW} className="w-full h-full grayscale" />
                                        ) : (
                                            <IconMusic className="w-10 h-10 text-black/30" />
                                        )}
                                    </div>

                                    <div className="flex gap-4 text-left mb-6">
                                        <div className="flex-1 min-w-0 overflow-hidden">
                                            <p className="text-[10px] font-bold uppercase tracking-wide text-black/50 mb-2 whitespace-nowrap">{t.wrappedRecapTopArtists}</p>
                                            <div className="flex flex-col gap-1.5">
                                                {stats.topArtisti.slice(0, 5).map(([name], idx) => (
                                                    <div key={name} className="flex items-baseline gap-1.5 overflow-hidden">
                                                        <span className="text-black/40 text-xs font-bold flex-shrink-0">{idx + 1}</span>
                                                        <span className="text-xs sm:text-sm font-bold whitespace-nowrap overflow-hidden text-ellipsis">{name}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="flex-1 min-w-0 overflow-hidden">
                                            <p className="text-[10px] font-bold uppercase tracking-wide text-black/50 mb-2 whitespace-nowrap">{t.wrappedRecapTopTracks}</p>
                                            <div className="flex flex-col gap-1.5">
                                                {stats.topBrani.slice(0, 5).map(([keyT]) => keyT.split(' -|- ')[0]).map((title, idx) => (
                                                    <div key={`${title}-${idx}`} className="flex items-baseline gap-1.5 overflow-hidden">
                                                        <span className="text-black/40 text-xs font-bold flex-shrink-0">{idx + 1}</span>
                                                        <span className="text-xs sm:text-sm font-bold whitespace-nowrap overflow-hidden text-ellipsis">{title}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-4 text-left pb-5">
                                        <div className="flex-1 min-w-0 overflow-hidden">
                                            <p className="text-[10px] font-bold uppercase tracking-wide text-black/50 mb-1 whitespace-nowrap">{t.wrappedRecapMinutesListen}</p>
                                            <p className="font-display text-2xl font-black whitespace-nowrap overflow-hidden text-ellipsis">{nfWrapped(stats.minutiTotali)}</p>
                                        </div>
                                        <div className="flex-1 min-w-0 overflow-hidden">
                                            <p className="text-[10px] font-bold uppercase tracking-wide text-black/50 mb-1 whitespace-nowrap">{t.wrappedRecapGenre}</p>
                                            <p className="font-display text-lg font-black whitespace-nowrap overflow-hidden text-ellipsis">{recapGenreW || (topArtistName ? '…' : t.na)}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="relative border-t border-black/10 px-5 py-3 flex items-center gap-2 flex-shrink-0">
                                    <div className="w-7 h-7 rounded-full bg-black flex items-center justify-center flex-shrink-0">
                                        <IconMusic className="w-4 h-4 text-white" />
                                    </div>
                                    <span className="font-display font-black text-[11px] tracking-wide whitespace-nowrap overflow-hidden text-ellipsis">{t.wrappedRecapLink}</span>
                                </div>
                            </div>
                        </div>
                    )
                });

                return slides;
            }, [stats, lang, topGenre, genreStats, storyQuizQuestions, storyQuizAnswers, monthlyStoryIdx]);

            const openWrapped = () => {
                setWrappedIndex(0);
                setMonthlyStoryIdx(0);
                setStoryQuizAnswers({});
                setShowWrapped(true);
            };
            const closeWrapped = () => setShowWrapped(false);
            const nextWrappedSlide = () => {
                const currentSlide = wrappedSlides[wrappedIndex];
                // Se siamo nella storia "top del mese", avanza prima tra i mesi (sotto-storie)
                if (currentSlide && currentSlide.isMonthly && stats?.monthlyTopArtists?.length > 0) {
                    const maxIdx = stats.monthlyTopArtists.length - 1;
                    if (monthlyStoryIdx < maxIdx) {
                        setMonthlyStoryIdx(i => i + 1);
                        return;
                    }
                }
                setWrappedIndex(i => {
                    const next = Math.min(i + 1, wrappedSlides.length - 1);
                    // Entrando nella storia mensile si riparte sempre dal primo mese
                    if (wrappedSlides[next] && wrappedSlides[next].isMonthly) {
                        setMonthlyStoryIdx(0);
                    }
                    return next;
                });
            };
            const prevWrappedSlide = () => {
                const currentSlide = wrappedSlides[wrappedIndex];
                // Se siamo nella storia "top del mese", torna prima indietro tra i mesi (sotto-storie)
                if (currentSlide && currentSlide.isMonthly && monthlyStoryIdx > 0) {
                    setMonthlyStoryIdx(i => i - 1);
                    return;
                }
                setWrappedIndex(i => {
                    const prevI = Math.max(i - 1, 0);
                    // Tornando dentro la storia mensile, si riparte dall'ultimo mese
                    if (wrappedSlides[prevI] && wrappedSlides[prevI].isMonthly && stats?.monthlyTopArtists?.length > 0) {
                        setMonthlyStoryIdx(stats.monthlyTopArtists.length - 1);
                    }
                    return prevI;
                });
            };
            const waitForImagesLoaded = (container, timeoutMs = 4000) => {
                const imgs = Array.from(container.querySelectorAll('img'));
                if (imgs.length === 0) return Promise.resolve();
                const perImage = imgs.map(img => {
                    if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                    return new Promise(resolve => {
                        img.addEventListener('load', resolve, { once: true });
                        img.addEventListener('error', resolve, { once: true });
                    });
                });
                const timeout = new Promise(resolve => setTimeout(resolve, timeoutMs));
                return Promise.race([Promise.all(perImage), timeout]);
            };

            const QuizImageWrapper = ({ artist, title, type, altText, isArtistRound }) => {
                const [src, setSrc] = useState(null);
                const [loading, setLoading] = useState(true);
                const [error, setError] = useState(false);

                useEffect(() => {
                    let isMounted = true;
                    setLoading(true);
                    setError(false);
                    
                    fetchArtwork(artist, title, type).then(url => {
                        if (isMounted) {
                            setSrc(url);
                            setLoading(false);
                        }
                    });
                    
                    return () => { isMounted = false; };
                }, [artist, title, type]);

                // Se l'immagine fallisce o non esiste, non renderizziamo NULLA (il riquadro scompare)
                if (error || (!src && !loading)) {
                    return null;
                }

                const shapeClass = isArtistRound ? 'w-16 h-16 sm:w-20 sm:h-20 rounded-full' : 'w-16 h-16 sm:w-20 sm:h-20 rounded-lg';

                return (
                    <div className={`relative flex-shrink-0 mr-4 overflow-hidden bg-gray-800/80 flex items-center justify-center ${shapeClass}`}>

                                <span className="text-gray-500 text-2xl font-bold opacity-30 animate-pulse">♪</span>
                                <div className="absolute inset-0 bg-white/5 animate-pulse"></div>
                            </React.Fragment>
                        ) : (
                            <img 
                                src={src} 
                                alt={altText} 
                                className="w-full h-full object-cover z-10" 
                                loading="lazy" 
                                onError={() => setError(true)} 
                            />
                        )}
                    </div>
                );
            };

            const LangSwitch = ({ className }) => (
                <div className={`flex bg-black/30 rounded-lg p-1 border border-white/10 ${className || ''}`}>

                    <button onClick={() => setLang('en')} className={`px-2.5 py-1 rounded-md text-xs font-bold tracking-wide transition-colors ${lang === 'en' ? 'bg-white/15 text-white' : 'text-gray-500 hover:text-gray-300'}`}>EN</button>
                </div>

                                        <div className="absolute inset-0 bg-purple-500/30 blur-2xl rounded-full"></div>

                                    </div>

                                    {t.landingTitle}
                                </h1>
                                <p className="text-gray-300 text-base sm:text-lg mb-8 leading-relaxed">

                                    {isProcessing ? (
                                        <div className="flex flex-col items-center">
                                            <IconRefresh className="w-10 h-10 text-purple-400 animate-spin-slow mb-4" />

                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center">
                                            <div className="flex items-center gap-2 mb-4 text-gray-400 group-hover:text-purple-400 transition-colors">

                                                <IconZip className="w-8 h-8 sm:w-10 sm:h-10" />
                                            </div>

                                        </div>

                                {error && (

                                        </h3>

                                        <p className="text-gray-400 text-sm">{t.choiceWrappedSub}</p>
                                    </button>

                                    <button
                                        onClick={() => setPostLoadChoiceMade(true)}
                                        className="group text-left bg-white/[0.06] hover:bg-white/[0.1] backdrop-blur-xl border border-white/10 hover:border-purple-400/40 rounded-3xl p-6 sm:p-8 transition-all active:scale-[0.98]"
                                    >
                                        <div className="w-12 h-12 rounded-2xl bg-purple-500/20 flex items-center justify-center mb-4 group-hover:bg-purple-500/30 transition-colors">
                                            <IconDisc className="w-6 h-6 text-purple-300" />
                                        </div>
                                        <p className="font-display font-bold text-lg sm:text-xl text-white mb-1">{t.choiceViewData}</p>
                                        <p className="text-gray-400 text-sm">{t.choiceViewDataSub}</p>
                                    </button>

                                    <button
                                        onClick={() => { setPostLoadChoiceMade(true); openQuiz(); }}
                                        className="group text-left bg-white/[0.06] hover:bg-white/[0.1] backdrop-blur-xl border border-white/10 hover:border-pink-400/40 rounded-3xl p-6 sm:p-8 transition-all active:scale-[0.98]"
                                    >
                                        <div className="w-12 h-12 rounded-2xl bg-pink-500/20 flex items-center justify-center mb-4 group-hover:bg-pink-500/30 transition-colors">

                                        </div>

            return (
                <React.Fragment>
                    <div className="min-h-screen px-4 sm:px-6 md:px-8 py-6 font-sans selection:bg-purple-500/30 pb-20 animate-fadein">

                                    <div className="flex-1 min-w-0">
                                        <h1 className="font-display text-[1.4rem] min-[375px]:text-[1.7rem] sm:text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-pink-400 to-orange-300 leading-tight tracking-tight sm:tracking-normal truncate sm:overflow-visible">

                                        <div className="grid grid-cols-1 sm:flex sm:flex-wrap items-center gap-3">

                                                <button onClick={() => setFilterMode('all')} className={`flex-1 px-3 py-2 sm:py-1.5 rounded-md text-sm font-semibold transition-colors ${filterMode === 'all' ? 'bg-purple-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>{t.fAll}</button>
