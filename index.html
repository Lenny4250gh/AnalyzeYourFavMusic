        // stesso colore in ogni mese in cui appare, non solo quando è primo.
        const raceColorForArtist = (months, artist) => {
            if (!months || months.length === 0 || !artist) return RACE_COLORS[0];
            const finalMonth = months[months.length - 1];
            const allNames = finalMonth.ranking.map(r => r.artist);
            const colorIdx = allNames.indexOf(artist) % RACE_COLORS.length;
            return RACE_COLORS[colorIdx >= 0 ? colorIdx : 0];
        };

        // Colore di sfondo per il mese all'indice "idx": quello del primo classificato di QUEL mese.
        // Essendo raceColorForArtist deterministico (stesso artista -> stesso colore), se il primo
        // resta lo stesso da un mese all'altro il colore restituito è identico e lo sfondo non cambia;
        // cambia (con una transizione morbida) solo quando cambia davvero il leader della classifica.
        const raceLeaderColor = (months, idx) => {
            if (!months || months.length === 0) return null;
            const current = months[Math.min(Math.max(idx, 0), months.length - 1)];
            const leader = current?.ranking?.[0]?.artist;
            return leader ? raceColorForArtist(months, leader) : null;
        };

        // Sfondo completo (radiale + lineare, sfumato verso il nero) costruito a partire dal colore
        // del leader del mese, per sostituire il gradiente statico della slide "top del mese".
        const raceLeaderBg = (color) => `radial-gradient(ellipse 90% 60% at 50% -5%, ${color}66, transparent 60%), linear-gradient(160deg, ${color}55, #0b0b0f 85%)`;

        // Piccole utility per interpolare due colori esadecimali componente per componente (r,g,b)
        const hexToRgb = (hex) => {
            const h = hex.replace('#', '');
            const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
            const n = parseInt(full, 16);
            return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        };
        const rgbToHex = ({ r, g, b }) => '#' + [r, g, b].map(v => {
            const c = Math.round(Math.max(0, Math.min(255, v)));
            return c.toString(16).padStart(2, '0');
        }).join('');
        const mixHexColors = (colorA, colorB, t) => {
            const a = hexToRgb(colorA), b = hexToRgb(colorB);
            return rgbToHex({ r: a.r + (b.r - a.r) * t, g: a.g + (b.g - a.g) * t, b: a.b + (b.b - a.b) * t });
        };

        // Le due tecniche più ovvie per sfumare tra un raceLeaderBg(colore1) e raceLeaderBg(colore2)
        // hanno entrambe un difetto: (1) una `transition: background` non funziona perché i browser
        // non interpolano gradienti diversi, scatta di colpo; (2) un cross-fade a due strati impilati
        // (vecchio sotto, nuovo sopra con opacità animata) sembra funzionare ma, siccome i gradienti
        // sono semi-trasparenti, durante la dissolvenza il colore percepito è "arricchito" dalla somma
        // dei due strati e appena quello vecchio viene tolto il colore risulta di scatto più scuro.
        // La soluzione robusta è interpolare direttamente il colore (r,g,b) frame per frame con
        // requestAnimationFrame e ricalcolare il gradiente ad ogni frame: un solo strato, sempre,
        // niente compositing tra sfondi, quindi nessuno scatto finale.
        const RaceLeaderBackdrop = ({ color, duration = 700 }) => {
            const [displayColor, setDisplayColor] = useState(color);
            const fromColorRef = useRef(color);
            const rafRef = useRef(null);

            useEffect(() => {
                if (!color) return;
                const from = fromColorRef.current || color;
                if (from === color) { setDisplayColor(color); return; }

                const startTime = performance.now();
                const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

                const step = (now) => {
                    const t = Math.min(1, (now - startTime) / duration);
                    setDisplayColor(mixHexColors(from, color, easeOutCubic(t)));
                    if (t < 1) {
                        rafRef.current = requestAnimationFrame(step);
                    } else {
                        fromColorRef.current = color;
                    }
                };
                rafRef.current = requestAnimationFrame(step);
                return () => cancelAnimationFrame(rafRef.current);
            }, [color, duration]);

            if (!displayColor) return null;
            return (
                <div
                    className="absolute inset-0 overflow-hidden -z-10 pointer-events-none"
                    style={{ background: raceLeaderBg(displayColor) }}
                />
            );
        };




        // Numero che si "conta" progressivamente dal valore precedente a quello nuovo, sincronizzato
        // con la stessa durata/curva della barra così crescono insieme mentre la sottostoria scorre
        const AnimatedCount = ({ value, duration = 1750, className, style }) => {
            const [display, setDisplay] = useState(value);
            const prevValueRef = useRef(value);

            useEffect(() => {
                const from = prevValueRef.current;
                const to = value;
                if (from === to) { setDisplay(to); return; }

                let rafId;
                const startTime = performance.now();
                const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

                const step = (now) => {
                    const t = Math.min(1, (now - startTime) / duration);
                    const eased = easeOutCubic(t);
                    setDisplay(Math.round(from + (to - from) * eased));
                    if (t < 1) {
                        rafId = requestAnimationFrame(step);
                    } else {
                        prevValueRef.current = to;
                    }
                };
                rafId = requestAnimationFrame(step);
                return () => cancelAnimationFrame(rafId);
            }, [value, duration]);

            return <span className={className} style={style}>{display.toLocaleString('it-IT')}</span>;
        };

        const MonthlyArtistRaceStory = ({ months, title, subtitle, idx, onIdxChange, onFinish, onSkipAll, skipLabel, onGoBack, canGoBack, backLabel, newLabel, active = true }) => {
            // Timer per avanzare automaticamente ogni 1.75 secondi tra i mesi.
            // Sull'ultimo mese il timer si ferma e NON passa da solo alla storia successiva del Wrapped:
            // resta in attesa di un tap/swipe manuale dell'utente.
            // "active" indica se questa storia è davvero quella a schermo in questo momento (nel
            // formato Scroll resta montata anche quando si scorre via): se non è attiva l'avanzamento
            // automatico si ferma, e riparte da solo appena si torna a vederla.
            useEffect(() => {
                if (!active) return;
                if (!months || months.length <= 1) return;
                if (idx >= months.length - 1) return;

                const interval = setInterval(() => {
                    onIdxChange(idx + 1);
                }, 1750);

                return () => clearInterval(interval);
            }, [months, idx, onIdxChange, active]);

            // Al montaggio della sottostoria (primo mese), le barre/i conteggi partono da 0 e si
            // "caricano" fino al valore reale, esattamente come accade nei sorpassi tra un mese e l'altro.
            // Il doppio requestAnimationFrame garantisce che il browser dipinga prima lo stato a 0,
            // così la transizione CSS/il conteggio animato scattano davvero invece di saltare al valore finale.
            const [hasEntered, setHasEntered] = useState(false);
            useEffect(() => {
                let raf2;
                const raf1 = requestAnimationFrame(() => {
                    raf2 = requestAnimationFrame(() => setHasEntered(true));
                });
                return () => {
                    cancelAnimationFrame(raf1);
                    if (raf2) cancelAnimationFrame(raf2);
                };
            }, []);

            if (!months || months.length === 0) return null;
            const current = months[idx] || months[0];

            // Il massimo di riproduzioni in un singolo mese (su tutti i mesi) serve a calibrare la larghezza
            // massima delle barre, dato che ora i valori sono per-mese e non più cumulativi (non crescono
            // in modo monotono da un mese all'altro)
            const finalMonth = months[months.length - 1];
            const maxFinalTotal = Math.max(1, ...months.flatMap(m => m.ranking.map(r => r.total)));
            // Un colore stabile per ogni artista (stesso artista = stesso colore in ogni mese)
            const colorForArtist = (artist) => raceColorForArtist(months, artist);

            // Posizione di ciascun artista nel mese precedente, per calcolare di quanto è "salito"
            // o "sceso" in classifica e mostrare il badge con la freccia accanto al numero
            const prevMonth = idx > 0 ? months[idx - 1] : null;
            const prevRankOf = (artist) => {
                if (!prevMonth) return null;
                const i = prevMonth.ranking.findIndex(r => r.artist === artist);
                return i === -1 ? null : i;
            };

            const ROW_HEIGHT = 92;
            const BAR_MAX_WIDTH = 128;
            // Scala dimensionale in base alla posizione: il primo è il più grande, poi via via un po' più piccoli
            const scaleForRank = (rank) => [1.2, 1.08, 1, 0.94, 0.88][rank] ?? 0.85;

            return (
                <div className="story-custom-root flex flex-col items-center justify-between h-full w-full py-4 px-2 select-none overflow-hidden">

                    {/* Header & Indicatori di Progresso tipo Story */}
                    <div className="w-full max-w-xs space-y-3 z-20">
                        {/* Barre di avanzamento in alto: si riempiono realmente in 1.75s, sincronizzate col timer */}
                        <div className="flex items-center gap-1.5 w-full">
                            {months.map((m, i) => (
                                <button
                                    key={m.key || i}
                                    onClick={(e) => { e.stopPropagation(); onIdxChange(i); }}
                                    className="h-1.5 flex-1 rounded-full bg-white/20 overflow-hidden cursor-pointer transition-all"
                                    aria-label={`Vai al mese ${m.fullLabel}`}
                                >
                                    {i < idx ? (
                                        <div className="h-full w-full bg-white rounded-full" />
                                    ) : i === idx ? (
                                        <div
                                            key={`active-${idx}`}
                                            className="h-full bg-white rounded-full origin-left animate-story-fill shadow-[0_0_8px_rgba(255,255,255,0.9)]"
                                        />
                                    ) : (
                                        <div className="h-full w-0 bg-white rounded-full" />
                                    )}
                                </button>
                            ))}
                        </div>

                        {/* Titolo Principale */}
                        <div className="text-center mt-3">
                            <p className="text-white/70 text-xs font-bold uppercase tracking-widest">{title}</p>
                        </div>

                        {/* Etichetta del mese in corso, spostata qui sopra la classifica (prima era sotto) */}
                        <div className="w-full flex justify-center">
                            <div
                                key={`label-${current.key || idx}`}
                                className="animate-badge-pop inline-flex items-center gap-2 px-6 py-2 rounded-full border-2 border-white/80 font-black text-base text-white uppercase tracking-wide text-center"
                            >
                                <IconCalendar className="w-4 h-4 opacity-80" />
                                {current.fullLabel}
                            </div>
                        </div>
                    </div>

                    {/* La corsa: una riga per artista, che sale/scende di posizione e si allunga mese dopo mese.
                        Le transizioni CSS su "top" e "width" creano l'effetto di sorpasso.
                        Il primo classificato è reso più grande, con una scala che decresce leggermente verso il basso. */}
                    <div
                        className="relative w-full max-w-xs my-auto"
                        style={{ height: current.ranking.length * ROW_HEIGHT }}
                    >
                        {current.ranking.map((r, rank) => {
                            const color = rank === 0 ? '#facc15' : colorForArtist(r.artist);
                            // Finché la sottostoria non è "entrata" (primissimo render del primo mese), la barra
                            // resta a 0 così può poi animarsi verso il valore reale, come fa nei mesi successivi.
                            const widthPx = hasEntered ? Math.max(10, Math.round((r.total / maxFinalTotal) * BAR_MAX_WIDTH)) : 0;
                            const displayTotal = hasEntered ? r.total : 0;
                            const scale = scaleForRank(rank);
                            const avatarSize = Math.round(54 * scale);
                            const barHeight = Math.round(17 * scale);
                            const isChampion = rank === 0;
                            const medalClass = rank === 0 ? 'rank-medal-1' : rank === 1 ? 'rank-medal-2' : rank === 2 ? 'rank-medal-3' : '';

                            // Confronto con la posizione del mese precedente: determina il badge con la
                            // freccia (salita/discesa/invariato) o l'etichetta "NEW" per un ingresso in classifica
                            const prevRank = prevRankOf(r.artist);
                            let rankBadge = null;
                            if (prevMonth) {
                                if (prevRank === null) {
                                    rankBadge = { cls: 'rank-badge-new', icon: null, label: newLabel || 'NEW' };
                                } else if (prevRank > rank) {
                                    rankBadge = { cls: 'rank-badge-up', icon: <IconRankUp className="w-2 h-2" />, label: String(prevRank - rank) };
                                } else if (prevRank < rank) {
                                    rankBadge = { cls: 'rank-badge-down', icon: <IconRankDown className="w-2 h-2" />, label: String(rank - prevRank) };
                                } else {
                                    rankBadge = { cls: 'rank-badge-same', icon: <IconRankSame className="w-2 h-2" />, label: null };
                                }
                            }
                            const hasShifted = prevMonth && prevRank !== null && prevRank !== rank;

                            return (
                                <div
                                    key={r.artist}
                                    className={`absolute left-0 w-full flex items-center gap-2 ${isChampion ? 'race-row-champion py-1' : ''} ${hasShifted ? 'animate-race-row-shift' : ''}`}
                                    style={{
                                        top: rank * ROW_HEIGHT,
                                        height: ROW_HEIGHT - 10,
                                        transition: 'top 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)',
                                    }}
                                >
                                    {/* Numero di posizione, con sfondo a medaglia per il podio (oro/argento/bronzo)
                                        e badge di scalata rispetto al mese precedente subito sotto */}
                                    <div className="flex flex-col items-center flex-shrink-0" style={{ width: 24 }}>
                                        <span
                                            className={`font-black flex items-center justify-center rounded-full ${medalClass || 'text-white/50'}`}
                                            style={{ width: 20, height: 20, fontSize: 12 * Math.max(scale, 0.85) }}
                                        >
                                            {rank + 1}
                                        </span>
                                        {rankBadge && (
                                            <span
                                                key={`badge-${current.key || idx}-${r.artist}`}
                                                className={`rank-badge mt-1 gap-0.5 px-1 font-black ${rankBadge.cls}`}
                                                style={{ fontSize: 8.5, height: 14, minWidth: rankBadge.label ? 17 : 14 }}
                                            >
                                                {rankBadge.icon}
                                                {rankBadge.label && <span>{rankBadge.label}</span>}
                                            </span>
                                        )}
                                    </div>

                                    {/* Foto tonda dell'artista, "testa" della barra. La coroncina del primo va FUORI dal
                                        cerchio con overflow-hidden, altrimenti verrebbe tagliata via. Attorno alla foto
                                        del leader luccicano alcune scintille e l'anello dorato pulsa piano. */}
                                    <div className="relative flex-shrink-0" style={{ width: avatarSize, height: avatarSize }}>
                                        {isChampion && (
                                            <>
                                                <IconCrown
                                                    className="animate-crown absolute z-20 text-yellow-400"
                                                    style={{ top: -18, left: '50%', width: 24, height: 24 }}
                                                />
                                                <IconSparkle className="race-sparkle" style={{ top: -4, right: -10, width: 12, height: 12, animationDelay: '0s' }} />
                                                <IconSparkle className="race-sparkle" style={{ bottom: 4, left: -12, width: 9, height: 9, animationDelay: '0.6s' }} />
                                                <IconSparkle className="race-sparkle" style={{ bottom: -8, right: 2, width: 10, height: 10, animationDelay: '1.1s' }} />
                                            </>
                                        )}
                                        <div
                                            className={`relative w-full h-full rounded-full overflow-hidden border-2 z-10 ${isChampion ? 'race-avatar-champion' : ''}`}
                                            style={{ borderColor: color }}
                                        >
                                            <EntityImageBox
                                                artist={r.artist}
                                                type="artist"
                                                altText={r.artist}
                                                boxClassName="w-full h-full bg-black/30 flex items-center justify-center"
                                                imgClassName="w-full h-full object-cover"
                                            />
                                        </div>
                                    </div>

                                    {/* Barra di progressione della corsa, col nome dell'artista scritto subito sotto.
                                        La colonna del nome prende lo spazio disponibile nella riga (non più legata
                                        alla larghezza della barra, che con pochi ascolti può essere molto stretta):
                                        così il nome resta sempre leggibile, al massimo va su due righe invece di
                                        essere tagliato con "...". La barra ora ha un lieve gradiente (più intenso
                                        e dorato per il leader) invece del colore piatto. */}
                                    <div className="flex flex-col items-start flex-1 min-w-0" style={{ marginTop: -9 }}>
                                        <div
                                            className="race-bar-transition rounded-full"
                                            style={{
                                                width: widthPx,
                                                height: barHeight,
                                                backgroundImage: isChampion
                                                    ? 'linear-gradient(90deg, #f59e0b, #fde047)'
                                                    : `linear-gradient(90deg, ${color}cc, ${color})`,
                                                boxShadow: isChampion ? '0 0 16px rgba(250,204,21,0.55)' : 'none',
                                            }}
                                        />
                                        <span
                                            className="text-white/90 font-bold mt-1 leading-tight text-left line-clamp-2 break-words"
                                            style={{ fontSize: 12 * scale }}
                                        >
                                            {r.artist}
                                        </span>
                                    </div>

                                    {/* Conteggio ascolti del mese corrente, subito dopo la fine della barra: si anima
                                        in sincrono con la barra mentre la sottostoria scorre. Larghezza riservata
                                        e cifre monospaziate così il totale della riga entra sempre nello schermo */}
                                    <AnimatedCount
                                        value={displayTotal}
                                        duration={1750}
                                        className={`font-bold flex-shrink-0 text-right ${isChampion ? 'text-yellow-300' : 'text-white/80'}`}
                                        style={{ fontSize: 15 * scale, minWidth: 44 * scale, fontVariantNumeric: 'tabular-nums', display: 'inline-block' }}
                                    />
                                </div>
                            );
                        })}
                    </div>

                    {/* Sottotitolo, sempre centrato in basso sopra ai controlli — stessa posizione
                        di INDIETRO/SALTA della macro-storia "Top 5 artisti" */}
                    {subtitle && (
                        <div className="w-full max-w-xs">
                            <p className="text-white/60 text-xs leading-relaxed max-w-xs mx-auto text-center">
                                {subtitle}
                            </p>
                        </div>
                    )}

                </div>
            );
        };

        // Card centrale (ritratto + nome) di un singolo artista della storia "Top 5 casuale".
        // Un'unica istanza per volta (rimontata via key ad ogni cambio artista): avere due nomi
        // sovrapposti in crossfade (uscente/entrante) si è rivelato illeggibile — a differenza di una
        // foto, due scritte testuali sovrapposte non si "fondono" mai in modo pulito, risultano solo
        // un guazzabuglio di lettere. Qui invece il ritratto e il nome del NUOVO artista entrano insieme
        // scivolando (direzione avanti/indietro), col ritratto che rimbalza leggermente in scala e il
        // nome che lo segue con un piccolo ritardo, per un ingresso vivace ma sempre a singola scritta.
        const RandomArtistCard = ({ artist, animClass }) => (
            <div className={`flex flex-col items-center space-y-4 ${animClass}`}>
                <div className="relative group w-36 h-36 sm:w-44 sm:h-44">
                    <div
                        className="absolute -inset-2 rounded-full animate-spin-slower opacity-90 animate-artist-ring-flash"
                        style={{ background: 'conic-gradient(from 0deg, #a855f7, #ec4899, #f59e0b, #6366f1, #a855f7)' }}
                    ></div>
                    <div className="absolute -inset-0.5 rounded-full bg-[#0b0b0f]"></div>

                    <EntityImageBox
                        artist={artist}
                        type="artist"
                        altText={artist}
                        boxClassName="relative w-full h-full rounded-full overflow-hidden shadow-2xl bg-black/30 flex items-center justify-center transition-transform duration-300 group-hover:scale-105 animate-artist-ring-pop"
                        imgClassName="w-full h-full object-cover rounded-full"
                    />
                </div>

                <div className="text-center pt-2 px-2 max-w-xs animate-artist-name-in">
                    <h3 className="font-black text-2xl sm:text-4xl text-white tracking-tight drop-shadow-md break-words leading-tight">
                        {artist}
                    </h3>
                </div>
            </div>
        );

        const RandomTopArtistsStory = ({ artists, title, subtitle, idx, onIdxChange, onFinish, onSkipAll, skipLabel, onGoBack, canGoBack, backLabel, active = true }) => {
            // Stessa logica della storia "artista del mese": avanzamento automatico ogni 1.75s,
            // ma qui ogni sotto-storia è uno dei Top 5 artisti mostrati in ordine casuale.
            // Sull'ultimo artista il timer si ferma e NON passa da solo alla storia successiva del Wrapped:
            // resta in attesa di un tap/swipe manuale dell'utente.
            // "active" indica se questa storia è davvero quella a schermo in questo momento (nel
            // formato Scroll resta montata anche quando si scorre via): se non è attiva l'avanzamento
            // automatico si ferma, e riparte da solo appena si torna a vederla.
            useEffect(() => {
                if (!active) return;
                if (!artists || artists.length <= 1) return;
                if (idx >= artists.length - 1) return;

                const interval = setInterval(() => {
                    onIdxChange(idx + 1);
                }, 1750);

                return () => clearInterval(interval);
            }, [artists, idx, onIdxChange, active]);

            // Direzione dell'ultima transizione tra sotto-storie (avanti/indietro), per animare la card
            // dell'artista con lo stesso stile "slide" direzionale usato per le macro-storie del Wrapped:
            // avanti quando idx cresce (auto-avanzamento o tap avanti), indietro quando si torna
            // all'artista precedente (tap indietro o click su un indicatore passato).
            const prevIdxRef = useRef(idx);
            const [direction, setDirection] = useState(1);
            useEffect(() => {
                if (idx !== prevIdxRef.current) {
                    setDirection(idx > prevIdxRef.current ? 1 : -1);
                    prevIdxRef.current = idx;
                }
            }, [idx]);

            if (!artists || artists.length === 0) return null;
            const current = artists[idx] || artists[0];

            return (
                <div className="story-custom-root flex flex-col items-center justify-between h-full w-full py-4 px-2 select-none">

                    {/* Header & Indicatori di Progresso tipo Story, uno per ogni artista della Top 5 */}
                    <div className="w-full max-w-xs space-y-3">
                        <div className="flex items-center gap-1.5 w-full">
                            {artists.map((a, i) => (
                                <button
                                    key={a.key || i}
                                    onClick={(e) => { e.stopPropagation(); onIdxChange(i); }}
                                    className="h-1.5 flex-1 rounded-full bg-white/20 overflow-hidden cursor-pointer transition-all"
                                    aria-label={`Vai all'artista ${a.artist}`}
                                >
                                    {i < idx ? (
                                        <div className="h-full w-full bg-white rounded-full" />
                                    ) : i === idx ? (
                                        <div
                                            key={`active-${idx}`}
                                            className="h-full bg-white rounded-full origin-left animate-story-fill shadow-[0_0_8px_rgba(255,255,255,0.9)]"
                                        />
                                    ) : (
                                        <div className="h-full w-0 bg-white rounded-full" />
                                    )}
                                </button>
                            ))}
                        </div>

                        <div className="text-center">
                            <p className="text-white/70 text-xs font-bold uppercase tracking-widest">{title}</p>
                        </div>
                    </div>

                    {/* Card Centrale dell'Artista: un'unica istanza per volta, rimontata via key ad ogni
                        cambio artista con lo slide direzionale (avanti/indietro) + un piccolo "rimbalzo"
                        sul ritratto e il nome che lo segue con un lieve ritardo */}
                    <div className="w-full my-auto flex justify-center">
                        <RandomArtistCard
                            key={current.key || idx}
                            artist={current.artist}
                            animClass={direction >= 0 ? 'animate-story-fwd' : 'animate-story-back'}
                        />
                    </div>

                    <div className="w-full max-w-xs flex flex-col items-center gap-3">
                        {subtitle && (
                            <p className="text-white/60 text-xs leading-relaxed max-w-xs mx-auto">
                                {subtitle}
                            </p>
                        )}
                    </div>

                </div>
            );
        };

        const generateQuizQuestions = (stats, t, lang) => {
            if (!stats) return [];
            const questions = [];
            const fmt = (n) => Math.round(n).toLocaleString(lang === 'it' ? 'it-IT' : 'en-US');

            const numericDistractors = (correct, factors) => {
                const set = new Set();
                let guard = 0;
                while (set.size < 3 && guard < 50) {
                    guard++;
                    const f = factors[Math.floor(Math.random() * factors.length)];
                    const val = Math.max(1, Math.round(correct * f));
                    if (val !== correct) set.add(val);
                }
                return Array.from(set);
            };

            // 1. Top artist
            if (stats.topArtisti.length >= 4) {
                const correct = stats.topArtisti[0][0];
                const pool = stats.topArtisti.slice(1).map(a => a[0]);
                const wrong = shuffleArray(pool).slice(0, 3);
                questions.push({ id: 'artist', question: t.qArtistTitle, options: shuffleArray([correct, ...wrong]), correct });
            }

            // 2. Top track (tutte le opzioni vengono dalla top 5 più ascoltata, così ci sono 5 scelte invece di 4)
            if (stats.topBrani.length >= 4) {
                const correct = stats.topBrani[0][0]; // Rimosso split
                let wrong = stats.topBrani.slice(1, 5).map(b => b[0]).filter(x => x !== correct);
                // Se la top 5 non basta per avere almeno 3 alternative, si completa con le tracce successive
                if (wrong.length < 3) {
                    const extraPool = stats.topBrani.slice(5).map(b => b[0]).filter(x => x !== correct && !wrong.includes(x));
                    wrong = [...wrong, ...shuffleArray(extraPool).slice(0, 3 - wrong.length)];
                }
                if (wrong.length >= 3) questions.push({ id: 'track', question: t.qTrackTitle, options: shuffleArray([correct, ...wrong]), correct });
            }

            // 3. Top album
            if (stats.topAlbum.length >= 4) {
                const correct = stats.topAlbum[0][0]; // Rimosso split
                const pool = stats.topAlbum.slice(1).map(al => al[0]).filter(x => x !== correct);
                const wrong = shuffleArray(pool).slice(0, 3);
                if (wrong.length === 3) questions.push({ id: 'album', question: t.qAlbumTitle, options: shuffleArray([correct, ...wrong]), correct });
            }

            // 4. Most active weekday
            {
                const sorted = [...stats.weekdayFull].sort((a, b) => b.count - a.count);
                if (sorted[0].count > 0) {
                    const correct = sorted[0].nome;
                    const wrong = shuffleArray(sorted.slice(1).map(w => w.nome)).slice(0, 3);
                    questions.push({ id: 'weekday', question: t.qWeekdayTitle, options: shuffleArray([correct, ...wrong]), correct });
                }
            }

            // 5. Favorite time slot
            if (stats.date.fasciaTop && stats.date.fasciaTop !== t.na) {
                const correct = stats.date.fasciaTop;
                const wrong = t.slots.filter(s => s !== correct);
                questions.push({ id: 'timeslot', question: t.qTimeSlotTitle, options: shuffleArray([correct, ...wrong]), correct });
            }

            // 6. Total streams
            {
                const correct = stats.totali;
                const distractors = numericDistractors(correct, [0.5, 0.7, 1.4, 1.8, 2.2]);
                if (distractors.length === 3) {
                    questions.push({ id: 'streams', question: t.qStreamsTitle, options: shuffleArray([correct, ...distractors]).map(fmt), correct: fmt(correct) });
                }
            }

            // 7. Total hours
            {
                const correct = Math.round(stats.minutiTotali / 60);
                const distractors = numericDistractors(correct, [0.4, 0.6, 1.5, 2, 2.5]);
                if (distractors.length === 3) {
                    questions.push({ id: 'hours', question: t.qMinutesTitle, options: shuffleArray([correct, ...distractors]).map(fmt), correct: fmt(correct) });
                }
            }

            // 8. Unique artists
            {
                const correct = stats.artistiUnici;
                const distractors = numericDistractors(correct, [0.4, 0.6, 1.5, 2, 2.8]);
                if (distractors.length === 3) {
                    questions.push({ id: 'uniqueartists', question: t.qArtistsUniqueTitle, options: shuffleArray([correct, ...distractors]).map(fmt), correct: fmt(correct) });
                }
            }

            // 9. Compare two artists
            if (stats.topArtisti.length >= 5) {
                const idxA = Math.floor(Math.random() * Math.min(3, stats.topArtisti.length));
                let idxB = 3 + Math.floor(Math.random() * (stats.topArtisti.length - 3));
                if (idxB <= idxA) idxB = Math.min(stats.topArtisti.length - 1, idxA + 3);
                const a = stats.topArtisti[idxA];
                const b = stats.topArtisti[idxB];
                if (a && b && a[0] !== b[0] && a[1] !== b[1]) {
                    const correct = a[1] > b[1] ? a[0] : b[0];
                    questions.push({ id: 'compare', question: t.qCompareTitle, options: shuffleArray([a[0], b[0]]), correct });
                }
            }

            return shuffleArray(questions).slice(0, 8);
        };

        // Posizioni pre-calcolate (non casuali ad ogni render, per evitare "salti" visivi) per le
        // particelle di luce che salgono nella variante "particles" dello sfondo del Wrapped.
        const WRAPPED_PARTICLE_PRESETS = [
            { left: '6%', delay: '0s', dur: '5.2s', drift: '18px' },
            { left: '16%', delay: '0.15s', dur: '6.1s', drift: '-14px' },
            { left: '27%', delay: '0.5s', dur: '5.6s', drift: '22px' },
            { left: '38%', delay: '0.08s', dur: '6.8s', drift: '-20px' },
            { left: '49%', delay: '0.7s', dur: '5.0s', drift: '16px' },
            { left: '60%', delay: '0.35s', dur: '6.4s', drift: '-18px' },
            { left: '71%', delay: '0.12s', dur: '5.8s', drift: '24px' },
            { left: '82%', delay: '0.6s', dur: '6.0s', drift: '-16px' },
            { left: '91%', delay: '0.25s', dur: '5.4s', drift: '20px' },
            { left: '12%', delay: '0.85s', dur: '6.6s', drift: '-22px' },
            { left: '55%', delay: '1.0s', dur: '5.3s', drift: '14px' },
            { left: '75%', delay: '0.75s', dur: '6.2s', drift: '-24px' },
        ];
        const WRAPPED_BG_VARIANTS = ['circles', 'particles', 'rings', 'waves', 'blob', 'orbs'];

        // Sfondo animato dietro ogni storia del Wrapped: ruota tra 6 varianti decorative diverse
        // (cerchi pieni che rimbalzano, coriandoli che salgono, anelli concentrici rotanti,
        // equalizzatore silenzioso, una macchia organica che si deforma, sfere di luce morbide)
        // così ogni storia sembra "vestita" in modo diverso, con forme nette e decise in stile
        // Spotify Wrapped invece di nebbie o texture puntinate. Puramente decorativo: nessuna
        // interazione, nessuna dipendenza da dati.
        const WrappedBgFX = React.memo(({ variant, dark }) => {
            let deco = null;
            if (variant === 'circles') {
                deco = (
                    <div className="wrapped-bgfx-circles absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
                        <div className="wrapped-circle wrapped-circle-1"></div>
                        <div className="wrapped-circle wrapped-circle-2"></div>
                        <div className="wrapped-circle wrapped-circle-3"></div>
                        <div className="wrapped-circle wrapped-circle-4"></div>
                        <div className="wrapped-circle wrapped-circle-5"></div>
                    </div>
                );
            } else if (variant === 'blob') {
                deco = (
                    <div className="wrapped-bgfx-blob absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
                        <div className="wrapped-blob"></div>
                        <div className="wrapped-blob wrapped-blob-2"></div>
                    </div>
                );
            } else if (variant === 'particles') {
                deco = (
                    <div className="wrapped-bgfx-particles absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
                        {WRAPPED_PARTICLE_PRESETS.map((p, i) => (
                            <span
                                key={i}
                                className="wrapped-particle"
                                style={{
                                    left: p.left,
                                    width: (i % 3 === 0) ? '7px' : '5px',
                                    height: (i % 3 === 0) ? '7px' : '5px',
                                    animationDelay: p.delay,
                                    animationDuration: p.dur,
                                    '--particle-x': p.drift,
                                }}
                            ></span>
                        ))}
                    </div>
                );
            } else if (variant === 'rings') {
                deco = (
                    <div className="wrapped-bgfx-rings absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
                        <div className="wrapped-ring-wrap wrapped-ring-wrap-1"><div className="wrapped-ring wrapped-ring-1"></div></div>
                        <div className="wrapped-ring-wrap wrapped-ring-wrap-2"><div className="wrapped-ring wrapped-ring-2"></div></div>
                        <div className="wrapped-ring-wrap wrapped-ring-wrap-3"><div className="wrapped-ring wrapped-ring-3"></div></div>
                    </div>
                );
            } else if (variant === 'waves') {
                deco = (
                    <div className="wrapped-bgfx-waves absolute inset-x-0 bottom-0 h-36 overflow-hidden pointer-events-none flex items-end justify-between gap-1 opacity-40" aria-hidden="true">
                        {Array.from({ length: 28 }).map((_, i) => (
                            <span key={i} className="wrapped-wave-bar" style={{ animationDelay: (i * 0.06) + 's', animationDuration: (1.1 + (i % 4) * 0.15) + 's' }}></span>
                        ))}
                    </div>
                );
            } else {
                deco = (
                    <div className="wrapped-bgfx-orbs absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
                        <div className="wrapped-orb wrapped-orb-1"></div>
                        <div className="wrapped-orb wrapped-orb-2"></div>
                        <div className="wrapped-orb wrapped-orb-3"></div>
                        <div className="wrapped-orb wrapped-orb-4"></div>
                    </div>
                );
            }
            return (
                <div className={`wrapped-bgfx-layer absolute inset-0 ${dark ? 'wrapped-bgfx-dark' : ''}`} aria-hidden="true">
                    {deco}
                </div>
            );
        });

        // ============================================================
        // WRAPPED — FORMATO "SCROLL" (feed verticale stile TikTok/Reels/Shorts)
        // ============================================================
        // Alternativa al formato "Storie": invece di toccare per passare alla storia
        // successiva, si scorre verticalmente come in un feed di video brevi — ogni storia
        // occupa l'intero schermo (o l'intera "card" telefono) e lo scroll si aggancia
        // (snap) a una storia alla volta, una sola per swipe, esattamente come TikTok/
        // Reels/Shorts. Riusa esattamente lo stesso array `slides` (stesso `content`/
        // `gradient`/`bgVariant` per storia) generato per il formato Storie, così le due
        // modalità restano sempre in sincrono: cambia solo la presentazione, non i dati.
        // ============================================================
        // MUSICA DI SOTTOFONO DEL WRAPPED
        // ============================================================
        // Ogni slide del Wrapped può portare un "audioCue" (impostato solo sulle slide di
        // rivelazione: copertina, top brano, top album, top artista). Scorrendo le slide
        // all'indietro dalla slide attiva troviamo l'ultimo audioCue incontrato: così la
        // musica resta la stessa per tutte le slide "intermedie" e cambia SOLO nei momenti
        // di rivelazione, esattamente come richiesto.
        const findActiveAudioCue = (slides, index) => {
            for (let i = index; i >= 0; i--) {
                if (slides[i] && slides[i].audioCue) return slides[i].audioCue;
            }
            return null;
        };

        // Hook condiviso da formato Storie e formato Scroll: crea un unico elemento <audio>,
        // lo fa dissolvere (fade out/in) ogni volta che l'audioCue attivo cambia, e gestisce
        // il caso in cui il browser blocchi l'autoplay con audio (in tal caso espone `blocked`
        // e `retryPlay`, da richiamare da un tap esplicito dell'utente).
        function useWrappedBackgroundMusic(slides, activeIndex, active) {
            const audioElRef = useRef(null);
            const currentCueIdRef = useRef(null);
            const fadeRafRef = useRef(null);
            const [muted, setMuted] = useState(false);
            const mutedRef = useRef(false);
            const [blocked, setBlocked] = useState(false);

            useEffect(() => {
                mutedRef.current = muted;
                if (audioElRef.current) audioElRef.current.muted = muted;
            }, [muted]);

            // Crea/distrugge l'elemento audio quando il Wrapped si apre/chiude
            useEffect(() => {
                if (!active) return;
                const audio = new Audio();
                audio.loop = true;
                audio.volume = 0;
                audio.preload = 'auto';
                audio.muted = mutedRef.current;
                audioElRef.current = audio;
                currentCueIdRef.current = null;
                setBlocked(false);
                return () => {
                    if (fadeRafRef.current) cancelAnimationFrame(fadeRafRef.current);
                    audio.pause();
                    audio.src = '';
                    audioElRef.current = null;
                };
            }, [active]);

            const fadeTo = (targetVolume, duration) => {
                const audio = audioElRef.current;
                if (!audio) return;
                if (fadeRafRef.current) cancelAnimationFrame(fadeRafRef.current);
                const startVolume = audio.volume;
                const startTime = performance.now();
                const step = (now) => {
                    // Il clamp su entrambi p e sul volume finale è necessario: per un normale
                    // errore di arrotondamento in virgola mobile, il volume calcolato può uscire
                    // leggermente dal range [0,1] (es. -0.0027). Impostare audio.volume fuori da
                    // [0,1] lancia un IndexSizeError NON catturato, che interrompe silenziosamente
                    // questo loop di dissolvenza a metà — con l'effetto che il volume resta bloccato
                    // vicino a zero e il brano successivo sembra "non partire mai".
                    const p = Math.max(0, Math.min(1, (now - startTime) / duration));
                    const vol = Math.max(0, Math.min(1, startVolume + (targetVolume - startVolume) * p));
                    if (audioElRef.current) {
                        try {
                            audioElRef.current.volume = vol;
                        } catch (e) {
                            // Non dovrebbe più accadere grazie al clamp sopra, ma in caso contrario
                            // meglio fermare qui la dissolvenza che lasciare un'eccezione non gestita
                            return;
                        }
                    }
                    if (p < 1) fadeRafRef.current = requestAnimationFrame(step);
                };
                fadeRafRef.current = requestAnimationFrame(step);
            };

            useEffect(() => {
                if (!active || !slides || slides.length === 0) return;
                const cue = findActiveAudioCue(slides, activeIndex);
                if (!cue || currentCueIdRef.current === cue.id) return;
                currentCueIdRef.current = cue.id;

                let cancelled = false;
                (async () => {
                    // Prova prima il brano "giusto" per questa slide; se l'anteprima non è
                    // disponibile (iTunes in rate limit / CORS / 403...), prova in ordine i brani
                    // di riserva (Top 10) allegati al cue finché uno restituisce un'anteprima
                    // riproducibile, così la musica di sottofondo non resta muta. Se anche questo
                    // fallisce del tutto, semplicemente non parte nulla (come prima).
                    let previewUrl = await fetchTrackPreviewUrl(cue.title, cue.artist);
                    if (!previewUrl && !cancelled) {
                        const candidates = cue.candidates || [];
                        for (let i = 0; i < candidates.length && !cancelled; i++) {
                            const candidate = candidates[i];
                            const candidateUrl = await fetchTrackPreviewUrl(candidate.title, candidate.artist);
                            if (candidateUrl) { previewUrl = candidateUrl; break; }
                        }
                    }
                    if (cancelled || !previewUrl || !audioElRef.current) return;
                    // Se nel frattempo l'attivo audioCue è già cambiato (slide successiva), non
                    // sovrascrivere: l'effect più recente si occuperà del brano corretto
                    if (currentCueIdRef.current !== cue.id) return;

                    const swap = async () => {
                        const audio = audioElRef.current;
                        if (!audio) return;
                        audio.src = previewUrl;
                        audio.currentTime = 0;
                        try {
                            await audio.play();
                            setBlocked(false);
                            fadeTo(0.55, 700);
                        } catch (e) {
                            // Autoplay con audio bloccato dal browser: serve un tap esplicito (retryPlay)
                            setBlocked(true);
                        }
                    };

                    if (audioElRef.current.volume > 0.02) {
                        fadeTo(0, 300);
                        setTimeout(() => { if (!cancelled) swap(); }, 320);
                    } else {
                        swap();
                    }
                })();

                return () => { cancelled = true; };
            }, [activeIndex, slides, active]);

            const toggleMute = () => setMuted(m => !m);
            const retryPlay = () => {
                const audio = audioElRef.current;
                if (!audio) return;
                audio.play().then(() => { setBlocked(false); fadeTo(0.55, 500); }).catch(() => {});
            };

            return { muted, toggleMute, blocked, retryPlay };
        }

        const WrappedScrollView = ({ slides, bgVariants, onClose, isSlideLocked, storyQuizAnswers, musicTapLabel }) => {
            const containerRef = useRef(null);
            const sectionRefs = useRef([]);
            const [activeIndex, setActiveIndex] = useState(0);
            // Ogni storia si "rivela" (monta il proprio contenuto, facendo partire la sua
            // cascata di animazioni) solo la prima volta che diventa quella a schermo intero,
            // invece di animare tutte insieme al semplice apertura del Wrapped.
            const [revealed, setRevealed] = useState(() => new Set([0]));
            // Tiene traccia dell'indice attivo anche in modo sincrono (non solo via stato React),
            // così i listener di wheel/touch/scroll — che devono decidere "al volo" se bloccare
            // lo scorrimento — leggono sempre il valore più aggiornato senza dover essere
            // ricreati ad ogni cambio di storia.
            const activeIndexRef = useRef(0);
            useEffect(() => { activeIndexRef.current = activeIndex; }, [activeIndex]);
            const isSlideLockedRef = useRef(isSlideLocked);
            useEffect(() => { isSlideLockedRef.current = isSlideLocked; }, [isSlideLocked]);

            // Musica di sottofondo: segue l'activeIndex già tracciato dallo scroll (IntersectionObserver sopra)
            const { muted: musicMuted, toggleMute: toggleMusicMute, blocked: musicBlocked, retryPlay: retryMusicPlay } = useWrappedBackgroundMusic(slides, activeIndex, true);

            useEffect(() => {
                const root = containerRef.current;
                const els = sectionRefs.current.filter(Boolean);
                if (!root || els.length === 0) return;
                // Root esplicita sul contenitore scrollabile (la "card"), non sul viewport:
                // altrimenti l'intersezione verrebbe calcolata sull'intera finestra invece
                // che sull'area effettivamente visibile del feed.
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const idx = Number(entry.target.dataset.idx);
                        if (!entry.isIntersecting) return;
                        setRevealed(prev => {
                            if (prev.has(idx)) return prev;
                            const next = new Set(prev);
                            next.add(idx);
                            return next;
                        });
                        if (entry.intersectionRatio > 0.6) {
                            setActiveIndex(idx);
                        }
                    });
                }, { root, threshold: [0.25, 0.6, 0.9] });
                els.forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, [slides.length]);

            // Scorre in automatico (con animazione) alla storia successiva del feed.
            const scrollToIndex = useCallback((idx) => {
                const el = sectionRefs.current[idx];
                if (el && typeof el.scrollIntoView === 'function') {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, []);

            // BLOCCO DELLO SCROLL VERSO IL BASSO: quando la storia attiva è "bloccata" (mini-quiz
            // ancora senza risposta, oppure macro-storia con sotto-storie — mese/artista — non
            // ancora viste tutte fino in fondo), impediamo di proseguire con la storia successiva.
            // Intercettiamo sia la rotellina (desktop) sia lo swipe (touch): preventDefault() sul
            // gesto stesso, così lo scroll non parte nemmeno, invece di lasciarlo partire e poi
            // "correggerlo" a scatti.
            useEffect(() => {
                const root = containerRef.current;
                if (!root) return;

                const isLockedNow = () => {
                    const fn = isSlideLockedRef.current;
                    return typeof fn === 'function' && fn(activeIndexRef.current);
                };

                const handleWheel = (e) => {
                    if (e.deltaY > 0 && isLockedNow()) {
                        e.preventDefault();
                    }
                };

                let touchStartY = 0;
                const handleTouchStart = (e) => {
                    touchStartY = e.touches[0] ? e.touches[0].clientY : 0;
                };
                const handleTouchMove = (e) => {
                    if (!e.touches[0]) return;
                    const deltaY = touchStartY - e.touches[0].clientY; // positivo = dito che scorre verso l'alto = storia successiva
                    if (deltaY > 0 && isLockedNow()) {
                        e.preventDefault();
                    }
                };

                // Rete di sicurezza: se nonostante tutto lo scroll è comunque avanzato oltre la
                // storia bloccata (es. inerzia del touch su iOS), lo riportiamo indietro alla
                // storia corrente invece di lasciar intravedere quella successiva.
                const handleScroll = () => {
                    if (!isLockedNow()) return;
                    const activeEl = sectionRefs.current[activeIndexRef.current];
                    if (!activeEl) return;
                    const targetTop = activeEl.offsetTop;
                    if (root.scrollTop > targetTop + 4) {
                        root.scrollTop = targetTop;
                    }
                };

                root.addEventListener('wheel', handleWheel, { passive: false });
                root.addEventListener('touchstart', handleTouchStart, { passive: true });
                root.addEventListener('touchmove', handleTouchMove, { passive: false });
                root.addEventListener('scroll', handleScroll, { passive: true });
                return () => {
                    root.removeEventListener('wheel', handleWheel);
                    root.removeEventListener('touchstart', handleTouchStart);
                    root.removeEventListener('touchmove', handleTouchMove);
                    root.removeEventListener('scroll', handleScroll);
                };
            }, []);

            // Una volta risposto al mini-quiz della storia attiva, dopo una breve pausa (per far
            // vedere se la risposta era giusta o sbagliata) scorriamo automaticamente alla storia
            // successiva, esattamente come nel formato "Storie" a tap.
            const autoAdvancedQuizIdsRef = useRef(new Set());
            useEffect(() => {
                const slide = slides[activeIndex];
                if (
                    slide && slide.qid &&
                    storyQuizAnswers && storyQuizAnswers[slide.qid] !== undefined &&
                    !autoAdvancedQuizIdsRef.current.has(slide.qid)
                ) {
                    autoAdvancedQuizIdsRef.current.add(slide.qid);
                    const timeoutId = setTimeout(() => {
                        scrollToIndex(activeIndex + 1);
                    }, 1000);
                    return () => clearTimeout(timeoutId);
                }
            }, [activeIndex, storyQuizAnswers, slides, scrollToIndex]);

            return (
                <div className="wrapped-scroll-root fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center p-3 sm:p-6 animate-fadebg">
                    <div className="relative w-full max-w-sm h-full sm:h-[85vh] sm:max-h-[820px] rounded-[1.75rem] sm:rounded-[2rem] overflow-hidden shadow-2xl">
                        <button
                            onClick={onClose}
                            className="absolute top-3 right-3 z-30 bg-black/30 hover:bg-black/50 p-2 rounded-full text-white/80 hover:text-white transition-colors"
                        >
                            <IconX className="w-5 h-5" />
                        </button>

                        <button
                            onClick={toggleMusicMute}
                            className="absolute top-3 left-3 z-30 bg-black/30 hover:bg-black/50 p-2 rounded-full text-white/80 hover:text-white transition-colors"
                        >
                            {musicMuted ? <IconVolumeX className="w-5 h-5" /> : <IconVolume2 className="w-5 h-5" />}
                        </button>

                        {musicBlocked && (
                            <button
                                onClick={retryMusicPlay}
                                className="absolute bottom-24 left-1/2 -translate-x-1/2 z-30 bg-black/60 hover:bg-black/80 text-white text-xs font-semibold px-4 py-2 rounded-full flex items-center gap-2 animate-pulse"
                            >
                                <IconVolume2 className="w-4 h-4" /> {musicTapLabel}
                            </button>
                        )}

                        {/* Feed verticale: una storia per schermata intera, aggancio (snap) di una
                            sola storia alla volta ad ogni swipe/scroll, proprio come un feed di
                            video brevi. */}
                        <div
                            ref={containerRef}
                            className="wrapped-scroll-container absolute inset-0 overflow-y-auto snap-y snap-mandatory"
                        >
                            {slides.map((slide, i) => {
                                const bgVariant = slide.bgVariant || bgVariants[i % bgVariants.length];
                                const itemVariant = ['a', 'b', 'c', 'd', 'e'][i % 5];
                                const isRevealed = revealed.has(i);
                                return (
                                    <section
                                        key={i}
                                        data-idx={i}
                                        ref={(el) => { sectionRefs.current[i] = el; }}
                                        className={`snap-start snap-always relative w-full h-full flex items-center justify-center text-center overflow-hidden ${slide.bgOverrideColor ? '' : `bg-gradient-to-br ${slide.gradient}`}`}
                                    >
                                        {slide.bgOverrideColor && <RaceLeaderBackdrop color={slide.bgOverrideColor} />}
                                        <div
                                            className={`wrapped-slide-content story-ambient wrapped-variant-${itemVariant} relative z-10 w-full h-full flex flex-col items-center justify-center text-center p-8 sm:p-10 overflow-hidden`}
                                        >
                                            <WrappedBgFX variant={bgVariant} />
                                            {isRevealed && (
                                                (slide.isMonthly || slide.isRandomTop)
                                                    ? React.cloneElement(slide.content, { active: i === activeIndex })
                                                    : slide.content
                                            )}
                                        </div>

                                        {/* Nel formato Scroll l'avanzamento tra le MACRO-storie resta affidato solo
                                            allo scroll/swipe. Ma per le storie con SOTTO-storie (mese per mese,
                                            top 5 artisti casuali) riattiviamo qui anche il tap sinistra/destra tipico
                                            del formato Storie, solo per muoversi tra le sotto-storie: tocco a destra
                                            = sotto-storia successiva, tocco a sinistra = precedente. Se si è già
                                            all'ultima sotto-storia il tap a destra non fa nulla: il passaggio alla
                                            storia successiva resta comunque affidato allo scroll. */}
                                        {(slide.isMonthly || slide.isRandomTop) && isRevealed && (
                                            <>
                                                <div
                                                    className="absolute inset-y-0 left-0 w-1/3 z-20 cursor-pointer"
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        if (slide.subStoryIdx > 0 && typeof slide.onSubStoryChange === 'function') {
                                                            slide.onSubStoryChange(slide.subStoryIdx - 1);
                                                        }
                                                    }}
                                                ></div>
                                                <div
                                                    className="absolute inset-y-0 right-0 w-2/3 z-20 cursor-pointer"
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        if (slide.subStoryIdx < slide.subStoryMax && typeof slide.onSubStoryChange === 'function') {
                                                            slide.onSubStoryChange(slide.subStoryIdx + 1);
                                                        }
                                                    }}
                                                ></div>
                                            </>
                                        )}
                                    </section>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [lang, setLang] = useState(detectLang());
            const t = DICT[lang];

            const [ascolti, setAscolti] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [error, setError] = useState('');
            const [filterMode, setFilterMode] = useState('all');
            const [selectedYear, setSelectedYear] = useState('all');
            const [dateFrom, setDateFrom] = useState('');
            const [dateTo, setDateTo] = useState('');
            const [showGuide, setShowGuide] = useState(false);
            const [showQuiz, setShowQuiz] = useState(false);
            const [quizSeed, setQuizSeed] = useState(0);
            const [quizPhase, setQuizPhase] = useState('intro'); // intro | playing | finished | no_data
            const [quizIndex, setQuizIndex] = useState(0);
            const [quizScore, setQuizScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [answered, setAnswered] = useState(false);
            const [quizHistory, setQuizHistory] = useState({});
            const [postLoadChoiceMade, setPostLoadChoiceMade] = useState(false);
            const [showWrapped, setShowWrapped] = useState(false);
            // Formato scelto per il Wrapped: 'scroll' (racconto continuo, stile Spotify Wrapped 2025)
            // oppure 'stories' (una storia a schermo intero alla volta, stile Spotify Wrapped 2024).
            const [wrappedStyle, setWrappedStyle] = useState('stories');
            // Vera quando è visibile lo schermo di scelta dello stile, mostrato prima di iniziare
            // a preparare il Wrapped vero e proprio.
            const [showWrappedStylePicker, setShowWrappedStylePicker] = useState(false);
            const [wrappedPreparing, setWrappedPreparing] = useState(false);
            // Descrizione mostrata durante la preparazione del Wrapped, aggiornata via via in base
            // a cosa si sta effettivamente caricando (statistiche, copertine, foto artista...).
            const [wrappedLoadingLabel, setWrappedLoadingLabel] = useState('');
            // Brani di sottofondo per copertina/top brano/top album/top artista, GIÀ verificati (hanno
            // davvero un'anteprima audio disponibile su iTunes, non solo "il brano giusto sulla carta")
            // e già precaricati in previewCache durante la preparazione del Wrapped, così quando la
            // storia diventa attiva la canzone parte all'istante invece di aspettare la rete.
            const [resolvedAudioCues, setResolvedAudioCues] = useState({ intro: null, track: null, album: null, artist: null });
            // Vero durante l'attesa (1s) tra la risposta al quiz-storia e l'avanzamento automatico
            // alla storia successiva: blocca il tap "avanti" manuale in quella finestra, per evitare
            // di saltare due storie insieme (un avanzamento manuale + quello automatico in arrivo).
            const [quizAutoAdvancing, setQuizAutoAdvancing] = useState(false);
            const [wrappedIndex, setWrappedIndex] = useState(0);
            const [wrappedDirection, setWrappedDirection] = useState(1); // 1 = avanti, -1 = indietro (per l'animazione direzionale delle storie)
            // Istantanea della storia che si sta lasciando (contenuto + sfondo animato), tenuta
            // montata per una manciata di ms e dissolta in uscita: senza questo, cambiando storia
            // il layer decorativo (es. i pallini che salgono) sparirebbe di scatto invece che sfumare.
            const [outgoingWrappedSlide, setOutgoingWrappedSlide] = useState(null);
            const outgoingWrappedTimeoutRef = useRef(null);
            const wrappedCardRef = useRef(null);

            useEffect(() => {
                document.documentElement.lang = lang;
            }, [lang]);

            const processFiles = async (files) => {
                setIsProcessing(true);
                setError('');
                let tuttiAscolti = [];

                try {
                    const filesToParse = [];

                    for (const file of files) {
                        if (file.name.endsWith('.zip')) {
                            const zip = await JSZip.loadAsync(file);
                            for (const relativePath in zip.files) {
                                const zipEntry = zip.files[relativePath];
                                if (!zipEntry.dir && (relativePath.endsWith('.json') || relativePath.endsWith('.csv'))) {
                                    const content = await zipEntry.async('string');
                                    filesToParse.push({ name: relativePath, text: content });
                                }
                            }
                        } else if (file.name.endsWith('.json') || file.name.endsWith('.csv')) {
                            const text = await file.text();
                            filesToParse.push({ name: file.name, text: text });
                        }
                    }

                    for (const itemFile of filesToParse) {
                        if (itemFile.name.endsWith('.csv')) {
                            const lines = itemFile.text.split('\n');
                            for (let j = 1; j < lines.length; j++) {
                                const line = lines[j].trim();
                                if (!line) continue;
                                const cols = parseCsvRow(line);
                                if (cols.length >= 6) {
                                    const dt = parseDate(cols[0]);
                                    if (dt && !isNaN(dt.getTime())) {
                                        tuttiAscolti.push({
                                            fonte: cols[1],
                                            artista: cols[2],
                                            titolo: cols[3],
                                            album: cols[4] || null,
                                            data: dt,
                                            ms_played: (parseFloat(cols[5]) || 0) * 60000
                                        });
                                    }
                                }
                            }
                            continue;
                        }

                        if (itemFile.name.endsWith('.json')) {
                            let data;
                            try {
                                data = JSON.parse(itemFile.text);
                            } catch (e) {
                                continue;
                            }

                            if (Array.isArray(data) && data.length > 0 && data[0].header === 'YouTube Music') {
                                data.forEach(item => {
                                    if (item.header !== 'YouTube Music') return;
                                    let nomeArtista = 'Artista Sconosciuto';
                                    const subtitles = item.subtitles || [];
                                    if (subtitles.length > 0) {
                                        nomeArtista = subtitles[0].name || nomeArtista;
                                        if (nomeArtista.endsWith(' - Topic')) nomeArtista = nomeArtista.replace(' - Topic', '');
                                    }
                                    nomeArtista = nomeArtista.trim();

                                    let titolo = (item.title || '').trim();
                                    const prefissi = ['Hai guardato ', 'Watched ', 'Hai ascoltato ', 'Listened to '];
                                    for (let prefisso of prefissi) {
                                        if (titolo.startsWith(prefisso)) {
                                            titolo = titolo.replace(prefisso, '').trim();
                                            break;
                                        }
                                    }

                                    if (titolo && titolo !== 'a video that has been removed' && !titolo.toLowerCase().includes('video non disponibile') && !isUnknown(nomeArtista, titolo)) {
                                        const dt = parseDate(item.time);
                                        if (dt) {
                                            const stimaDurataMediaMs = 180000; 
                                            tuttiAscolti.push({ fonte: 'YTMusic', artista: nomeArtista, titolo: titolo, album: null, data: dt, ms_played: stimaDurataMediaMs });
                                        }
                                    }
                                });
                            } else {
                                const items = data.items ? data.items : (Array.isArray(data) ? data : []);
                                items.forEach(item => {
                                    const artista = item.artistName || item.master_metadata_album_artist_name;
                                    const brano = item.trackName || item.master_metadata_track_name;
                                    const msPlayed = item.msPlayed || item.ms_played || 0;
                                    const album = item.master_metadata_album_album_name || null;

                                    if (artista && brano && msPlayed > 30000) {
                                        const artClean = artista.trim();
                                        const titClean = brano.trim();
                                        const albumClean = album ? album.trim() : null;

                                        if (!isUnknown(artClean, titClean)) {
                                            const dataStr = item.endTime || item.ts;
                                            const dt = parseDate(dataStr);
                                            if (dt) {
                                                tuttiAscolti.push({ fonte: 'Spotify', artista: artClean, titolo: titClean, album: albumClean, data: dt, ms_played: msPlayed });
                                            }
                                        }
                                    }
                                });
                            }
                        }
                    }

                    if (tuttiAscolti.length === 0) {
                        setError(t.errNoData);
                    } else {
                        setAscolti(tuttiAscolti);
                    }
                } catch (err) {
                    console.error(err);
                    setError(t.errReading);
                }
                setIsProcessing(false);
            };

            const loadDemoData = useCallback(() => {
                setError('');
                const demoArtists = [
                    { artista: 'The Weeknd', tracks: [
                        { titolo: 'Blinding Lights', album: 'After Hours' },
                        { titolo: 'Save Your Tears', album: 'After Hours' },
                        { titolo: 'Die For You', album: 'Starboy' },
                    ]},
                    { artista: 'Dua Lipa', tracks: [
                        { titolo: 'Levitating', album: 'Future Nostalgia' },
                        { titolo: "Don't Start Now", album: 'Future Nostalgia' },
                        { titolo: 'Houdini', album: 'Radical Optimism' },
                    ]},
                    { artista: 'Coldplay', tracks: [
                        { titolo: 'Yellow', album: 'Parachutes' },
                        { titolo: 'Viva la Vida', album: 'Viva la Vida' },
                        { titolo: 'My Universe', album: 'Music of the Spheres' },
                    ]},
                    { artista: 'Billie Eilish', tracks: [
                        { titolo: 'Bad Guy', album: 'When We All Fall Asleep' },
                        { titolo: 'Birds of a Feather', album: 'Hit Me Hard and Soft' },
                        { titolo: 'Ocean Eyes', album: "Don't Smile at Me" },
                    ]},
                    { artista: 'Ariana Grande', tracks: [
                        { titolo: '7 rings', album: 'Thank U, Next' },
                        { titolo: 'Positions', album: 'Positions' },
                        { titolo: 'We Can\'t Be Friends', album: 'Eternal Sunshine' },
                    ]},
                    { artista: 'Drake', tracks: [
                        { titolo: 'God\'s Plan', album: 'Scorpion' },
                        { titolo: 'One Dance', album: 'Views' },
                    ]},
                    { artista: 'Taylor Swift', tracks: [
                        { titolo: 'Cruel Summer', album: 'Lover' },
                        { titolo: 'Anti-Hero', album: 'Midnights' },
                        { titolo: 'Style', album: '1989' },
                    ]},
                    { artista: 'Kendrick Lamar', tracks: [
                        { titolo: 'HUMBLE.', album: 'DAMN.' },
                        { titolo: 'Not Like Us', album: 'Single' },
                    ]},
                    { artista: 'Bad Bunny', tracks: [
                        { titolo: 'Tití Me Preguntó', album: 'Un Verano Sin Ti' },
                        { titolo: 'Monaco', album: 'Nadie Sabe Lo Que Va a Pasar Mañana' },
                    ]},
                    { artista: 'Imagine Dragons', tracks: [
                        { titolo: 'Believer', album: 'Evolve' },
                        { titolo: 'Radioactive', album: 'Night Visions' },
                    ]},
                    { artista: 'Sabrina Carpenter', tracks: [
                        { titolo: 'Espresso', album: 'Short n\' Sweet' },
                        { titolo: 'Please Please Please', album: 'Short n\' Sweet' },
                    ]},
                    { artista: 'Kanye West', tracks: [
                        { titolo: 'Stronger', album: 'Graduation' },
                        { titolo: 'Runaway', album: 'My Beautiful Dark Twisted Fantasy' },
                    ]},
                ];

                // Alcuni artisti sono ascoltati molto più spesso di altri (distribuzione realistica)
                const weights = demoArtists.map((_, i) => Math.pow(0.8, i));
