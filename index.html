                                </div>
                            </div>
                        </div>
                    )
                });

                return slides;
            }, [stats, lang, topGenre, genreStats, albumStats, storyQuizQuestions, storyQuizAnswers, monthlyStoryIdx, randomArtistStoryIdx, shuffledTop5Artists, filterMode, selectedYear, dateFrom, dateTo, introAudioTrack]);

            // Musica di sottofondo del Wrapped in formato Storie (il formato Scroll gestisce la
            // propria istanza internamente, dato che tiene il proprio activeIndex)
            const wrappedMusic = useWrappedBackgroundMusic(wrappedSlides, wrappedIndex, showWrapped && wrappedStyle === 'stories');

            // Raccoglie tutte le combinazioni artista/titolo/tipo la cui immagine servirà da qualche
            // parte nel Wrapped (top brano/album/artista, le rispettive Top 5, la corsa mensile, i
            // Top 5 casuali e le opzioni del mini-quiz), così da poterle precaricare TUTTE in un colpo
            // solo prima di aprire le storie, invece di farle comparire una alla volta man mano che
            // l'utente scorre (che è quello che succedeva prima, con EntityImage/EntityImageBox che
            // partivano a caricare solo al montaggio della singola slide).
            const getWrappedImageJobs = () => {
                if (!stats) return [];
                const jobs = [];
                const seen = new Set();
                const addJob = (artist, title, type) => {
                    if (!artist) return;
                    const key = `${type}-${artist}-${title || ''}`;
                    if (seen.has(key)) return;
                    seen.add(key);
                    jobs.push({ artist, title, type });
                };

                (stats.topBrani || []).slice(0, 5).forEach(([keyT]) => {
                    const [title, artist] = keyT.split(' -|- ');
                    addJob(artist, title, 'track');
                });

                (albumStatsRef.current.topAlbum || []).slice(0, 5).forEach(([keyA]) => {
                    const [title, artist] = keyA.split(' -|- ');
                    addJob(artist, title, 'album');
                });

                (stats.topArtisti || []).slice(0, 5).forEach(([name]) => {
                    addJob(name, undefined, 'artist');
                });

                (stats.monthlyArtistRace || []).forEach(month => {
                    (month.ranking || []).forEach(r => addJob(r.artist, undefined, 'artist'));
                });

                (storyQuizQuestions || []).forEach(q => {
                    if (!['artist', 'track', 'album', 'compare'].includes(q.id)) return;
                    (q.options || []).forEach(option => {
                        let optArtist = null;
                        let optTitle = null;
                        if (q.id === 'track' || q.id === 'album') {
                            const parts = String(option).split(' -|- ');
                            optTitle = parts[0];
                            if (parts.length > 1) optArtist = parts[1];
                        } else {
                            optArtist = option;
                        }
                        addJob(optArtist, optTitle, q.id === 'artist' || q.id === 'compare' ? 'artist' : q.id);
                    });
                });

                return jobs;
            };

            // Prima di preparare davvero il Wrapped, mostriamo uno schermo per scegliere il formato
            // (Scroll o Storie): la preparazione (generi, album, immagini) è identica per entrambi,
            // solo la presentazione finale cambia.
            const openWrappedStylePicker = () => {
                setShowWrappedStylePicker(true);
            };
            const chooseWrappedStyle = (style) => {
                setWrappedStyle(style);
                setShowWrappedStylePicker(false);
                // openWrapped() azzera wrappedIndex/monthlyStoryIdx/randomArtistStoryIdx/storyQuizAnswers,
                // che sono tutte dipendenze del useMemo pesante che ricostruisce l'intero array di storie
                // del Wrapped (con tutte le sue immagini/JSX). Chiamandolo nello stesso click il browser
                // deve chiudere la modale E ricalcolare tutte le storie nello stesso frame, con un
                // "congelamento" percepibile. Rimandandolo al frame successivo (doppio requestAnimationFrame,
                // per essere certi che almeno un frame venga dipinto nel mezzo), il click chiude subito la
                // scelta del formato e solo dopo parte il ricalcolo pesante.
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        openWrapped();
                    });
                });
            };
            const openWrapped = () => {
                setWrappedIndex(0);
                setMonthlyStoryIdx(0);
                setRandomArtistStoryIdx(0);
                setStoryQuizAnswers({});
                autoAdvancedQuizIdsRef.current.clear();
                // Non apriamo subito le storie: prima mostriamo una schermata di caricamento e
                // aspettiamo che generi, album e tutte le immagini necessarie siano pronti (vedi
                // useEffect qui sotto), così durante il Wrapped non compare più nulla "a scatti".
                setWrappedPreparing(true);
            };
            const closeWrapped = () => {
                setShowWrapped(false);
                setWrappedPreparing(false);
                setShowWrappedStylePicker(false);
                if (outgoingWrappedTimeoutRef.current) clearTimeout(outgoingWrappedTimeoutRef.current);
                setOutgoingWrappedSlide(null);
            };

            // Fase di preparazione del Wrapped: aspetta che il calcolo di generi/album sia finito,
            // poi precarica in blocco TUTTE le immagini che serviranno durante le storie (brani,
            // album, artisti, opzioni del mini-quiz, foto dell'artista #1), e solo quando è tutto
            // pronto apre davvero il Wrapped. Nessun tetto massimo di attesa: meglio uno spinner
            // un po' più lungo che storie con copertine ancora da caricare a metà.
            useEffect(() => {
                if (!wrappedPreparing) return;
                if (!stats) { setWrappedPreparing(false); return; }

                let cancelled = false;
                const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

                (async () => {
                    // Fase 1: generi e album. Nessun tetto massimo di attesa: il Wrapped si apre
                    // solo quando i dati sono davvero pronti, non quando scade un timer.
                    setWrappedLoadingLabel(t.wrappedPreparingStats);
                    while (
                        !cancelled &&
                        (genreStatsRef.current.loading || albumStatsRef.current.loading)
                    ) {
                        await wait(150);
                    }
                    if (cancelled) return;

                    // Fase 2: tutte le copertine/foto usate nelle storie (brani, album, artisti,
                    // opzioni del mini-quiz). Le carichiamo a piccoli gruppi paralleli invece che
                    // tutte insieme, così la descrizione può riflettere cosa si sta scaricando in
                    // quel momento — ma solo per categoria (es. "copertine dei brani"), MAI con il
                    // nome esatto: sono proprio le classifiche a sorpresa che l'utente scoprirà
                    // dentro le storie, quindi qui non vanno anticipate. Aspettiamo che finiscano
                    // TUTTE prima di continuare.
                    const jobs = getWrappedImageJobs();
                    const total = jobs.length;
                    let done = 0;
                    let nextIdx = 0;
                    const IMAGE_LOAD_CONCURRENCY = 4;
                    const worker = async () => {
                        while (nextIdx < jobs.length) {
                            if (cancelled) return;
                            const job = jobs[nextIdx++];
                            const category = t.wrappedPreparingImageCategories[job.type] || t.wrappedPreparingImageCategories.track;
                            setWrappedLoadingLabel(t.wrappedPreparingImages(category, done, total));
                            await fetchArtwork(job.artist, job.title, job.type);
                            done += 1;
                        }
                    };
                    await Promise.all(
                        Array.from({ length: Math.min(IMAGE_LOAD_CONCURRENCY, jobs.length) }, worker)
                    );
                    if (cancelled) return;

                    // Fase 3: foto dell'artista principale, usata nella storia di riepilogo finale
                    // (anche qui senza nominarlo, per non anticipare la rivelazione).
                    if (stats.topArtisti && stats.topArtisti[0]) {
                        setWrappedLoadingLabel(t.wrappedPreparingArtistPhoto);
                        await getArtistPhotoDataUrl(stats.topArtisti[0][0]);
                    }
                    if (cancelled) return;

                    // Fase 4: precarica le anteprime audio (30s) dei 4 momenti "clou" del Wrapped
                    // (copertina, top brano, top album, top artista) INSIEME al resto, invece di
                    // scaricarle al volo quando l'utente arriva su quella storia (da qui il ritardo
                    // prima che parta la canzone). Per ciascun momento si parte dal brano "giusto"
                    // (il più ascoltato in quel contesto) ma, se iTunes non ha un'anteprima per
                    // QUEL brano preciso, si prova un altro brano a caso tra i primi 10 più
                    // ascoltati in assoluto, uno dopo l'altro, finché uno risulta riproducibile:
                    // così la slide ha comunque una canzone di sottofondo invece di restare muta.
                    // Il risultato finisce sia in resolvedAudioCues (per le slide) sia già dentro
                    // previewCache (fetchTrackPreviewUrl lo salva lì), quindi quando la storia
                    // diventa attiva la musica parte all'istante, senza attese di rete.
                    setWrappedLoadingLabel(t.wrappedPreparingAudio);
                    const top10TracksForAudio = (stats.topBrani || []).slice(0, 10).map(([key]) => {
                        const [title, artist] = key.split(' -|- ');
                        return { title, artist };
                    });
                    const resolvePlayableTrack = async (preferred) => {
                        const tried = new Set();
                        const tryCandidate = async (cand) => {
                            if (!cand || !cand.title || cancelled) return null;
                            const k = trackAudioKey(cand.title, cand.artist);
                            if (tried.has(k)) return null;
                            tried.add(k);
                            const url = await fetchTrackPreviewUrl(cand.title, cand.artist);
                            return url ? cand : null;
                        };
                        const preferredHit = await tryCandidate(preferred);
                        if (preferredHit || cancelled) return preferredHit;
                        for (const cand of shuffleArray(top10TracksForAudio.slice())) {
                            const hit = await tryCandidate(cand);
                            if (hit) return hit;
                            if (cancelled) return null;
                        }
                        return null;
                    };

                    let introPreferred = null;
                    if (stats.topBrani && stats.topBrani.length > 0) {
                        const pool5 = stats.topBrani.slice(0, 5);
                        const [introKey] = pool5[Math.floor(Math.random() * pool5.length)];
                        const [introTitle, introArtist] = introKey.split(' -|- ');
                        introPreferred = { title: introTitle, artist: introArtist };
                    }
                    let trackPreferred = null;
                    if (stats.topBrani && stats.topBrani.length > 0) {
                        const [trackKey] = stats.topBrani[0];
                        const [trackTitle, trackArtist] = trackKey.split(' -|- ');
                        trackPreferred = { title: trackTitle, artist: trackArtist };
                    }
                    let albumPreferred = null;
                    if (albumStats.topAlbum && albumStats.topAlbum.length > 0) {
                        const [albumKey] = albumStats.topAlbum[0];
                        const [albumTitle, albumArtist] = albumKey.split(' -|- ');
                        albumPreferred = getTopTrackForAlbum(albumTitle, albumArtist);
                    }
                    let artistPreferred = null;
                    if (stats.topArtisti && stats.topArtisti.length > 0) {
                        artistPreferred = getTopTrackForArtist(stats.topArtisti[0][0]);
                    }

                    const [introResolved, trackResolved, albumResolved, artistResolved] = await Promise.all([
                        resolvePlayableTrack(introPreferred),
                        resolvePlayableTrack(trackPreferred),
                        resolvePlayableTrack(albumPreferred),
                        resolvePlayableTrack(artistPreferred),
                    ]);
                    if (cancelled) return;
                    setResolvedAudioCues({ intro: introResolved, track: trackResolved, album: albumResolved, artist: artistResolved });

                    setShowWrapped(true);
                    setWrappedPreparing(false);
                })();

                return () => { cancelled = true; };
            }, [wrappedPreparing, stats]);
            // Salva un'istantanea del contenuto della storia corrente appena prima di cambiare
            // wrappedIndex, così può restare in scena un attimo in più mentre sfuma via, invece di
            // sparire di scatto. Il layer decorativo (pallini/cerchi/anelli...) NON viene incluso
            // qui apposta: ricrearlo da zero per l'istantanea causava discontinuità visive (es. i
            // pallini che saltavano in una posizione fissa prima di sparire), quindi durante questi
            // ~420ms di dissolvenza si vede solo il contenuto reale della storia, senza sfondo animato.
            const captureOutgoingWrappedSlide = () => {
                const slide = wrappedSlides[wrappedIndex];
                if (!slide) return;
                if (outgoingWrappedTimeoutRef.current) clearTimeout(outgoingWrappedTimeoutRef.current);
                setOutgoingWrappedSlide({
                    key: `out-${wrappedIndex}-${Date.now()}`,
                    content: slide.content,
                    gradient: slide.gradient,
                    bgOverrideColor: slide.bgOverrideColor,
                });
                outgoingWrappedTimeoutRef.current = setTimeout(() => {
                    setOutgoingWrappedSlide(null);
                }, 420);
            };

            // Dice se la storia "i" del Wrapped è ancora "bloccata" per l'avanzamento: mini-quiz
            // senza risposta, oppure macro-storia con sotto-storie (mese/artista) non ancora viste
            // tutte fino in fondo. Usata sia dal tap nel formato Storie sia dallo scroll nel
            // formato Scroll, così le due modalità restano coerenti tra loro.
            const isWrappedSlideLocked = useCallback((i) => {
                const slide = wrappedSlides[i];
                if (!slide) return false;
                if (slide.qid && storyQuizAnswers[slide.qid] === undefined) return true;
                if (slide.isMonthly && stats?.monthlyArtistRace?.length > 0) {
                    const maxIdx = stats.monthlyArtistRace.length - 1;
                    if (monthlyStoryIdx < maxIdx) return true;
                }
                if (slide.isRandomTop && shuffledTop5Artists.length > 0) {
                    const maxIdx = shuffledTop5Artists.length - 1;
                    if (randomArtistStoryIdx < maxIdx) return true;
                }
                return false;
            }, [wrappedSlides, storyQuizAnswers, stats, monthlyStoryIdx, randomArtistStoryIdx, shuffledTop5Artists]);

            const nextWrappedSlide = () => {
                const currentSlide = wrappedSlides[wrappedIndex];
                // Blocca l'avanzamento se la storia corrente è una domanda del quiz senza risposta
                if (currentSlide && currentSlide.qid && storyQuizAnswers[currentSlide.qid] === undefined) {
                    return;
                }
                // Se siamo nella storia "top del mese", avanza prima tra i mesi (sotto-storie)
                if (currentSlide && currentSlide.isMonthly && stats?.monthlyArtistRace?.length > 0) {
                    const maxIdx = stats.monthlyArtistRace.length - 1;
                    if (monthlyStoryIdx < maxIdx) {
                        setMonthlyStoryIdx(i => i + 1);
                        return;
                    }
                }
                // Se siamo nella storia "Top 5 artisti in ordine casuale", avanza prima tra gli artisti (sotto-storie),
                // esattamente come per la storia "top del mese"
                if (currentSlide && currentSlide.isRandomTop && shuffledTop5Artists.length > 0) {
                    const maxIdx = shuffledTop5Artists.length - 1;
                    if (randomArtistStoryIdx < maxIdx) {
                        setRandomArtistStoryIdx(i => i + 1);
                        return;
                    }
                }
                setWrappedDirection(1);
                captureOutgoingWrappedSlide();
                setWrappedIndex(i => {
                    const next = Math.min(i + 1, wrappedSlides.length - 1);
                    // Entrando nella storia mensile si riparte sempre dal primo mese
                    if (wrappedSlides[next] && wrappedSlides[next].isMonthly) {
                        setMonthlyStoryIdx(0);
                    }
                    // Entrando nella storia dei Top 5 casuali si riparte sempre dal primo artista
                    if (wrappedSlides[next] && wrappedSlides[next].isRandomTop) {
                        setRandomArtistStoryIdx(0);
                    }
                    return next;
                });
            };
            const prevWrappedSlide = () => {
                const currentSlide = wrappedSlides[wrappedIndex];
                // Se siamo nella storia "top del mese", torna prima indietro tra i mesi (sotto-storie)
                if (currentSlide && currentSlide.isMonthly && monthlyStoryIdx > 0) {
                    setMonthlyStoryIdx(i => i - 1);
                    return;
                }
                // Se siamo nella storia "Top 5 artisti in ordine casuale", torna prima indietro tra gli artisti
                if (currentSlide && currentSlide.isRandomTop && randomArtistStoryIdx > 0) {
                    setRandomArtistStoryIdx(i => i - 1);
                    return;
                }
                setWrappedDirection(-1);
                captureOutgoingWrappedSlide();
                setWrappedIndex(i => {
                    const prevI = Math.max(i - 1, 0);
                    // Tornando dentro la storia mensile, si riparte dall'ultimo mese
                    if (wrappedSlides[prevI] && wrappedSlides[prevI].isMonthly && stats?.monthlyArtistRace?.length > 0) {
                        setMonthlyStoryIdx(stats.monthlyArtistRace.length - 1);
                    }
                    // Tornando dentro la storia dei Top 5 casuali, si riparte dall'ultimo artista
                    if (wrappedSlides[prevI] && wrappedSlides[prevI].isRandomTop && shuffledTop5Artists.length > 0) {
                        setRandomArtistStoryIdx(shuffledTop5Artists.length - 1);
                    }
                    return prevI;
                });
            };

            // Nella storia del Wrapped: quando si risponde alla mini-domanda del quiz,
            // dopo aver mostrato se è giusta o sbagliata si passa in automatico alla storia successiva
            useEffect(() => {
                if (!showWrapped) return;
                const slide = wrappedSlides[wrappedIndex];
                if (
                    slide && slide.qid &&
                    storyQuizAnswers[slide.qid] !== undefined &&
                    !autoAdvancedQuizIdsRef.current.has(slide.qid)
                ) {
                    // Segniamo subito la domanda come "gestita": se l'utente tocca avanti a mano
                    // prima che scatti il timer, il setTimeout viene annullato dal cleanup qui sotto,
                    // ma la domanda deve comunque risultare già consumata per non far ripartire
                    // l'avanzamento automatico se in seguito si torna indietro su questa storia.
                    autoAdvancedQuizIdsRef.current.add(slide.qid);
                    setQuizAutoAdvancing(true);
                    const timeoutId = setTimeout(() => {
                        setQuizAutoAdvancing(false);
                        nextWrappedSlide();
                    }, 1000);
                    return () => {
                        clearTimeout(timeoutId);
                        setQuizAutoAdvancing(false);
                    };
                }
            }, [showWrapped, wrappedIndex, storyQuizAnswers, wrappedSlides]);
            const waitForImagesLoaded = (container, timeoutMs = 4000) => {
                const imgs = Array.from(container.querySelectorAll('img'));
                if (imgs.length === 0) return Promise.resolve();
                const perImage = imgs.map(img => {
                    if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                    return new Promise(resolve => {
                        img.addEventListener('load', resolve, { once: true });
                        img.addEventListener('error', resolve, { once: true });
                    });
                });
                const timeout = new Promise(resolve => setTimeout(resolve, timeoutMs));
                return Promise.race([Promise.all(perImage), timeout]);
            };

            const QuizImageWrapper = ({ artist, title, type, altText, isArtistRound }) => {
                const [src, setSrc] = useState(null);
                const [loading, setLoading] = useState(true);
                const [error, setError] = useState(false);

                useEffect(() => {
                    let isMounted = true;
                    setLoading(true);
                    setError(false);
                    
                    fetchArtwork(artist, title, type).then(url => {
                        if (isMounted) {
                            setSrc(url);
                            setLoading(false);
                        }
                    });
                    
                    return () => { isMounted = false; };
                }, [artist, title, type]);

                // Se l'immagine fallisce o non esiste, non renderizziamo NULLA (il riquadro scompare)
                if (error || (!src && !loading)) {
                    return null;
                }

                const shapeClass = isArtistRound ? 'w-16 h-16 sm:w-20 sm:h-20 rounded-full' : 'w-16 h-16 sm:w-20 sm:h-20 rounded-lg';

                return (
                    <div className={`relative flex-shrink-0 mr-4 overflow-hidden bg-gray-800/80 flex items-center justify-center ${shapeClass}`}>
                        {loading ? (
                            <React.Fragment>
                                <span className="text-gray-500 text-2xl font-bold opacity-30 animate-pulse">♪</span>
                                <div className="absolute inset-0 bg-white/5 animate-pulse"></div>
                            </React.Fragment>
                        ) : (
                            <img 
                                src={src} 
                                alt={altText} 
                                className="w-full h-full object-cover z-10" 
                                loading="lazy" 
                                onError={() => setError(true)} 
                            />
                        )}
                    </div>
                );
            };

            const LangSwitch = ({ className }) => (
                <div className={`flex bg-black/30 rounded-lg p-1 border border-white/10 ${className || ''}`}>
                    <button onClick={() => setLang('it')} className={`px-2.5 py-1 rounded-md text-xs font-bold tracking-wide transition-colors ${lang === 'it' ? 'bg-white/15 text-white' : 'text-gray-500 hover:text-gray-300'}`}>IT</button>
                    <button onClick={() => setLang('en')} className={`px-2.5 py-1 rounded-md text-xs font-bold tracking-wide transition-colors ${lang === 'en' ? 'bg-white/15 text-white' : 'text-gray-500 hover:text-gray-300'}`}>EN</button>
                </div>
            );

            // Controlli per selezionare il periodo (tutto / anno / intervallo di date), riutilizzati
            // sia nella pagina "Dati caricati!" sia nella dashboard, cosi la scelta del periodo va fatta
            // (o cambiata) in un unico posto invece di essere duplicata anche nell'intro del quiz.
            const PeriodFilterControls = ({ className }) => (
                <div className={className}>
                    <p className="text-purple-300 text-xs sm:text-sm mb-3 text-center">
                        {filterMode === 'all' && t.showingAll}

                        {filterMode === 'range' && (dateFrom || dateTo) && t.showingRange(

                            dateTo ? new Date(dateTo + 'T23:59:59').toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US') : t.rangeToday
                        )}
                        {filterMode === 'range' && !dateFrom && !dateTo && t.pickRange}
                    </p>
                    <div className="flex flex-col items-center gap-3">
                        <div className="flex bg-black/25 rounded-lg p-1 w-full">
                            <button onClick={() => setFilterMode('all')} className={`flex-1 px-3 py-2 sm:py-1.5 rounded-md text-sm font-semibold transition-colors ${filterMode === 'all' ? 'bg-purple-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>{t.fAll}</button>
                            <button onClick={() => setFilterMode('year')} className={`flex-1 px-3 py-2 sm:py-1.5 rounded-md text-sm font-semibold transition-colors ${filterMode === 'year' ? 'bg-purple-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>{t.fYear}</button>
                            <button onClick={() => setFilterMode('range')} className={`flex-1 px-3 py-2 sm:py-1.5 rounded-md text-sm font-semibold transition-colors ${filterMode === 'range' ? 'bg-purple-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>{t.fRange}</button>
                        </div>

                        {filterMode === 'year' && (
                            <select className="w-full bg-black/25 text-white font-semibold outline-none cursor-pointer px-4 py-2.5 rounded-lg text-base sm:text-sm border border-white/10 animate-fadein" value={selectedYear} onChange={(e) => setSelectedYear(e.target.value)}>
                                <option value="all" className="bg-gray-900">{t.selectYear}</option>
                                {anniDisponibili.map(anno => <option key={anno} value={anno} className="bg-gray-900">{anno}</option>)}
                            </select>
                        )}

                        {filterMode === 'range' && (
                            <div className="flex flex-col sm:flex-row items-center gap-2 w-full text-sm animate-fadein">
                                <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} className="w-full bg-black/25 text-white px-3 py-2.5 rounded-lg outline-none border border-white/10 text-base sm:text-sm" />
                                <span className="hidden sm:inline text-gray-400">→</span>
                                <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)} className="w-full bg-black/25 text-white px-3 py-2.5 rounded-lg outline-none border border-white/10 text-base sm:text-sm" />
                            </div>
                        )}

                        {filterMode === 'range' && dateFrom && dateTo && dateFrom > dateTo && (
                            <p className="text-red-400 text-xs">{t.rangeError}</p>
                        )}
                    </div>
                </div>
            );

            if (ascolti.length === 0) {
                return (

                    <React.Fragment>
                        <div className="min-h-screen text-white flex flex-col items-center justify-center p-6 relative" onDragOver={(e) => e.preventDefault()} onDrop={handleDrop}>
                            <div className="absolute top-6 right-6 flex items-center gap-3">
                                <button onClick={() => setShowGuide(true)} className="flex items-center gap-1.5 px-3 py-1.5 bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/40 rounded-lg text-xs font-semibold text-purple-200 transition-all">
                                    <IconHelp className="w-4 h-4" /> <span className="hidden sm:inline">{t.guideBtn}</span>
                                </button>
                                <LangSwitch />
                            </div>

                            <div className="max-w-2xl w-full bg-white/[0.06] backdrop-blur-xl border border-white/10 rounded-[2rem] p-8 sm:p-10 text-center shadow-2xl shadow-purple-950/40 mt-14 sm:mt-0">
                                <div className="flex justify-center mb-6">
                                    <div className="relative animate-float">
                                        <div className="absolute inset-0 bg-purple-500/30 blur-2xl rounded-full"></div>
                                        <Logo className="w-16 h-16 sm:w-20 sm:h-20 relative" />
                                    </div>
                                </div>
                                <p className="uppercase tracking-[0.3em] text-[0.65rem] sm:text-xs font-bold text-purple-300/80 mb-3">{t.brand}</p>
                                
                                <h1 className="font-display text-3xl min-[375px]:text-4xl md:text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-purple-300 via-pink-400 to-orange-300 tracking-tight">
                                    {t.landingTitle}
                                </h1>
                                <p className="text-gray-300 text-base sm:text-lg mb-8 leading-relaxed">
                                    {t.landingSubtitle}
                                </p>

                                <div className="border-2 border-dashed border-white/20 rounded-2xl p-8 sm:p-10 bg-white/[0.03] hover:bg-white/[0.07] hover:border-purple-400/40 transition-all cursor-pointer relative group">
                                    <input type="file" multiple accept=".json,.csv,.zip" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onChange={handleFileInput} />
                                    {isProcessing ? (
                                        <div className="flex flex-col items-center animate-pop-in">
                                            <div className="relative flex items-center justify-center mb-5">
                                                <div className="loader-ring"></div>
                                                <div className="absolute inset-0 flex items-center justify-center">
                                                    <div className="music-loader">
                                                        <span></span><span></span><span></span><span></span><span></span>
                                                    </div>
                                                </div>
                                            </div>
                                            <p className="font-semibold">
                                                {t.processing}<span className="loader-dot">.</span><span className="loader-dot">.</span><span className="loader-dot">.</span>
                                            </p>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center">
                                            <div className="flex items-center gap-2 mb-4 text-gray-400 group-hover:text-purple-400 transition-colors">
                                                <IconUpload className="w-8 h-8 sm:w-10 sm:h-10" />
                                                <IconZip className="w-8 h-8 sm:w-10 sm:h-10" />
                                            </div>
                                            <p className="font-semibold text-base sm:text-lg mb-2">{t.dropTitle}</p>
                                            <p className="text-xs sm:text-sm text-gray-400">{t.dropSubtitle}</p>
                                        </div>
                                    )}
                                </div>

                                {error && (
                                    <div className="mt-6 flex items-center justify-center gap-2 text-red-400 bg-red-400/10 p-3 rounded-lg text-sm">
                                        <IconAlert className="w-5 h-5 flex-shrink-0" />
                                        <p>{error}</p>
                                    </div>
                                )}

                                {!isProcessing && (
                                    <button
                                        onClick={loadDemoData}
                                        className="mt-6 inline-flex items-center gap-2 px-5 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 hover:border-purple-400/40 rounded-full text-sm font-semibold text-gray-300 hover:text-white transition-all"
                                    >
                                        {t.tryDefaultDataString}
                                    </button>
                                )}
                            </div>

                            <p className="mt-8 text-center text-xs text-gray-500">WrapYourFavMusic.github.io <span className="opacity-75">v1.3.3</span></p>

                            {showGuide && (
                                <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fadein" onClick={() => setShowGuide(false)}>
                                    <div className="bg-gray-900 border border-white/10 rounded-3xl p-6 sm:p-8 max-w-lg w-full relative max-h-[85vh] overflow-y-auto animate-fadein" onClick={(e) => e.stopPropagation()}>
                                        <button onClick={() => setShowGuide(false)} className="absolute top-4 sm:top-6 right-4 sm:right-6 text-gray-400 hover:text-white z-10"><IconClose className="w-6 h-6" /></button>
                                        <h3 className="font-display text-2xl sm:text-3xl font-bold text-white flex items-start gap-3 mb-6 pr-8">
                                            <IconHelp className="text-purple-400 flex-shrink-0 w-8 h-8 sm:w-9 sm:h-9 mt-0.5" /> {t.guideTitle}
                                        </h3>
                                        <div className="space-y-4 text-sm text-gray-300 leading-relaxed">
                                            <div className="flex gap-3 p-4 bg-white/5 rounded-xl border border-white/5">
                                                <span className="flex-shrink-0 w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold flex items-center justify-center mt-0.5">1</span>
                                                <div className="space-y-3 flex-1">
                                                    <p className="leading-relaxed font-bold text-white">{t.guideSpotifyStep}</p>
                                                    <a href="https://www.spotify.com/account/privacy/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg transition-colors">
                                                        <IconSpotify className="w-4 h-4" /> {t.openSpotifyPrivacy}
                                                    </a>
                                                </div>
                                            </div>
                                            <div className="flex gap-3 p-4 bg-white/5 rounded-xl border border-white/5">
                                                <span className="flex-shrink-0 w-6 h-6 rounded-full bg-red-500/20 text-red-300 text-xs font-bold flex items-center justify-center mt-0.5">2</span>
                                                <div className="flex-1">
                                                    <p className="leading-relaxed font-bold text-white">{t.guideYTMStep}</p>
                                                    <ul className="space-y-1.5 pl-0.5 mt-3">
                                                        {t.guideYTMSubSteps.map((step, idx) => (
                                                            <li key={idx} className="flex items-start gap-2.5">
                                                                <span className="flex-shrink-0 w-1.5 h-1.5 rounded-full bg-red-400 mt-2"></span>
                                                                <span className="leading-relaxed text-gray-300">{step}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                    <a href="https://takeout.google.com/settings/takeout/custom/youtube" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-xs bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2 rounded-lg transition-colors mt-6">
                                                        <IconYTMusic className="w-4 h-4" /> {t.openGoogleTakeout}
                                                    </a>
                                                </div>
                                            </div>
                                            <div className="flex gap-3 p-4 bg-purple-500/10 rounded-xl border border-purple-500/20">
                                                <span className="flex-shrink-0 w-6 h-6 rounded-full bg-purple-500/20 text-purple-300 text-xs font-bold flex items-center justify-center mt-0.5">3</span>
                                                <p className="text-purple-200 font-bold leading-relaxed flex-1">{t.guideZipNote}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </React.Fragment>
                );
            }

            if (ascolti.length > 0 && !postLoadChoiceMade) {
                return (
                    <React.Fragment>
                        <div className="min-h-screen text-white flex flex-col items-center justify-start sm:justify-center p-6 pt-20 sm:pt-6 relative">
                            <div className="absolute top-6 right-6 flex items-center gap-3">
                                <LangSwitch />
                            </div>

                            <div className="max-w-4xl w-full text-center animate-fadein">
                                <div className="flex justify-center mb-6">
                                    <div className="relative animate-float">
                                        <div className="absolute inset-0 bg-purple-500/30 blur-2xl rounded-full"></div>
                                        <Logo className="w-16 h-16 sm:w-20 sm:h-20 relative" />
                                    </div>
                                </div>
                                <h1 className="font-display text-3xl min-[375px]:text-4xl md:text-5xl font-extrabold mb-3 bg-clip-text text-transparent bg-gradient-to-r from-purple-300 via-pink-400 to-orange-300 tracking-tight">
                                    {t.choiceTitle}
                                </h1>
                                <p className="text-gray-300 text-base sm:text-lg mb-10">
                                    {t.choiceSubtitle}
                                </p>

                                <div className="max-w-md mx-auto mb-10 bg-white/[0.04] p-4 rounded-2xl border border-white/10 text-left">
                                    <PeriodFilterControls />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                                    <button
                                        onClick={() => { setPostLoadChoiceMade(true); openWrappedStylePicker(); }}
                                        className="group text-left bg-white/[0.03] hover:bg-white/[0.1] backdrop-blur-xl border border-white/10 hover:border-fuchsia-400/40 rounded-3xl p-6 sm:p-8 transition-all active:scale-[0.98]"
                                    >
                                        <div className="w-12 h-12 rounded-2xl bg-fuchsia-500/20 flex items-center justify-center mb-4 group-hover:bg-fuchsia-500/30 transition-colors">
                                            <IconMusic className="w-6 h-6 text-fuchsia-300" />
                                        </div>
                                        <p className="font-display font-bold text-lg sm:text-xl text-white mb-1">{t.choiceWrapped}</p>
                                        <p className="text-gray-400 text-sm">{t.choiceWrappedSub}</p>
                                    </button>

                                    <button
                                        onClick={() => { setPostLoadChoiceMade(true); openQuiz(); }}
                                        className="group text-left bg-white/[0.03] hover:bg-white/[0.1] backdrop-blur-xl border border-white/10 hover:border-pink-400/40 rounded-3xl p-6 sm:p-8 transition-all active:scale-[0.98]"
                                    >
                                        <div className="w-12 h-12 rounded-2xl bg-pink-500/20 flex items-center justify-center mb-4 group-hover:bg-pink-500/30 transition-colors">
                                            <IconTrophy className="w-6 h-6 text-pink-300" />
                                        </div>
                                        <p className="font-display font-bold text-lg sm:text-xl text-white mb-1">{t.choiceStartQuiz}</p>
                                        <p className="text-gray-400 text-sm">{t.choiceStartQuizSub}</p>
                                    </button>

                                    <button
                                        onClick={() => setPostLoadChoiceMade(true)}
                                        className="group text-left bg-white/[0.03] hover:bg-white/[0.1] backdrop-blur-xl border border-white/10 hover:border-purple-400/40 rounded-3xl p-6 sm:p-8 transition-all active:scale-[0.98]"

                        preparare generi/album/immagini, che sono comunque identici per entrambi. */}
                    {showWrappedStylePicker && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center p-6 animate-fadebg" style={{ transform: 'translateZ(0)', isolation: 'isolate' }}>
                            <button
                                onClick={() => setShowWrappedStylePicker(false)}
                                className="absolute top-6 right-6 z-30 bg-white/10 hover:bg-white/20 p-2 rounded-full text-white/80 hover:text-white transition-colors transform-gpu"
                            >
                                <IconX className="w-5 h-5" />
                            </button>
                            <div className="w-full max-w-md animate-pop-in" style={{ transform: 'translateZ(0)' }}>
                                <h3 className="font-display text-2xl sm:text-3xl font-black text-white text-center mb-2">{t.wrappedStylePickerTitle}</h3>
                                <p className="text-gray-400 text-sm text-center mb-8 max-w-sm mx-auto">{t.wrappedStylePickerSubtitle}</p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <button
                                        onClick={() => chooseWrappedStyle('scroll')}
                                        className="text-left bg-white/[0.04] hover:bg-white/[0.1] border-2 border-white/10 hover:border-purple-500 rounded-2xl p-5 transition-[background-color,border-color,transform] duration-300 hover:-translate-y-1 transform-gpu group"
                                    >
                                        <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-fuchsia-600 to-purple-700 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                            <IconChevronDown className="w-6 h-6 text-white" />
                                        </div>
                                        <p className="font-display font-bold text-lg text-white mb-1">{t.wrappedStyleScrollTitle}</p>
                                        <p className="text-gray-400 text-sm leading-snug">{t.wrappedStyleScrollDesc}</p>
                                    </button>
                                    <button
                                        onClick={() => chooseWrappedStyle('stories')}
                                        className="text-left bg-white/[0.04] hover:bg-white/[0.1] border-2 border-white/10 hover:border-purple-500 rounded-2xl p-5 transition-[background-color,border-color,transform] duration-300 hover:-translate-y-1 transform-gpu group"
                                    >
                                        <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-600 to-blue-700 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                            <IconSparkle className="w-6 h-6 text-white" />
                                        </div>
                                        <p className="font-display font-bold text-lg text-white mb-1">{t.wrappedStyleStoriesTitle}</p>
                                        <p className="text-gray-400 text-sm leading-snug">{t.wrappedStyleStoriesDesc}</p>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Schermata di caricamento del Wrapped: mostrata PRIMA di aprire le storie, mentre
                        generi, album e tutte le immagini necessarie vengono preparati in blocco */}
                    {wrappedPreparing && !showWrapped && (
                        <div className="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center p-6 animate-fadebg">
                            <button
                                onClick={() => setWrappedPreparing(false)}
                                className="absolute top-6 right-6 z-30 bg-white/10 hover:bg-white/20 p-2 rounded-full text-white/80 hover:text-white transition-colors"
                            >
                                <IconX className="w-5 h-5" />
                            </button>
                            <div className="flex flex-col items-center animate-pop-in">
                                <div className="relative flex items-center justify-center mb-6">
                                    <div className="loader-ring"></div>
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <div className="music-loader">
                                            <span></span><span></span><span></span><span></span><span></span>
                                        </div>
                                    </div>
                                </div>
                                <p className="font-display font-bold text-lg sm:text-xl text-white mb-2 text-center">
                                    {t.wrappedPreparingTitle}<span className="loader-dot">.</span><span className="loader-dot">.</span><span className="loader-dot">.</span>
                                </p>
                                <p className="text-gray-400 text-sm text-center max-w-xs">{wrappedLoadingLabel || t.wrappedPreparingSubtitle}</p>
                            </div>
                        </div>
                    )}

                    {/* Modal del Wrapped in formato Scroll: un unico racconto continuo, si scorre
                        con il dito invece di toccare per avanzare, stile Spotify Wrapped 2025 */}
                    {showWrapped && wrappedStyle === 'scroll' && wrappedSlides.length > 0 && (
                        <WrappedScrollView
                            slides={wrappedSlides}
                            bgVariants={WRAPPED_BG_VARIANTS}
                            onClose={closeWrapped}
                            isSlideLocked={isWrappedSlideLocked}
                            storyQuizAnswers={storyQuizAnswers}
                            musicTapLabel={t.wrappedMusicTapToEnable}
                        />
                    )}

                    {/* Modal del Wrapped a storie, stile Spotify */}
                    {showWrapped && wrappedStyle === 'stories' && wrappedSlides.length > 0 && (() => {
                        const currentWrappedSlide = wrappedSlides[wrappedIndex];
                        // Vero finché la storia corrente è una domanda del quiz senza risposta: blocca il tap per avanzare
                        const wrappedQuizLocked = !!(currentWrappedSlide && currentWrappedSlide.qid && storyQuizAnswers[currentWrappedSlide.qid] === undefined);
                        // Vero anche durante l'attesa che precede l'avanzamento automatico dopo aver
                        // risposto al quiz: in questa finestra il tap "avanti" manuale resta disattivato,
                        // per non sommarsi all'avanzamento automatico in arrivo e saltare una storia.
                        const wrappedForwardLocked = wrappedQuizLocked || quizAutoAdvancing;
                        // Ruota la variante di sfondo animato (orbs/particelle/anelli/onde) e il modo in cui
                        // gli elementi della storia appaiono, così ogni storia del Wrapped ha un look diverso,
                        // proprio come le transizioni sempre diverse del Wrapped di Spotify.
                        const wrappedBgVariant = wrappedSlides[wrappedIndex]?.bgVariant || WRAPPED_BG_VARIANTS[wrappedIndex % WRAPPED_BG_VARIANTS.length];
                        const wrappedItemVariant = ['a', 'b', 'c', 'd', 'e'][wrappedIndex % 5];
                        return (
                        <div className="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center p-3 sm:p-6 animate-fadebg">
                            <div
                                className="relative w-full max-w-sm h-full sm:h-[85vh] sm:max-h-[820px] rounded-[1.75rem] sm:rounded-[2rem] overflow-hidden shadow-2xl select-none cursor-pointer transform-gpu"
                                onClick={wrappedForwardLocked ? undefined : nextWrappedSlide}
                            >
                                {/* Barra di avanzamento in stile Storie */}
                                <div className="absolute top-3 left-3 right-3 z-30 flex gap-1.5">
                                    {wrappedSlides.map((_, i) => (
                                        <div key={i} className="flex-1 h-1 rounded-full bg-white/25 overflow-hidden">
                                            <div className={`story-progress-fill h-full bg-white ${i <= wrappedIndex ? 'w-full' : 'w-0'} ${i === wrappedIndex ? 'story-progress-active' : ''}`}></div>
                                        </div>
                                    ))}
                                </div>

                                {/* Chiudi */}
                                <button
                                    onClick={(e) => { e.stopPropagation(); closeWrapped(); }}
                                    className="absolute top-7 right-3 z-30 bg-black/30 hover:bg-black/50 p-2 rounded-full text-white/80 hover:text-white transition-colors"
                                >
                                    <IconX className="w-5 h-5" />
                                </button>

                                {/* Muto/attiva musica */}
                                <button
                                    onClick={(e) => { e.stopPropagation(); wrappedMusic.toggleMute(); }}
                                    className="absolute top-7 left-3 z-30 bg-black/30 hover:bg-black/50 p-2 rounded-full text-white/80 hover:text-white transition-colors"
                                >
                                    {wrappedMusic.muted ? <IconVolumeX className="w-5 h-5" /> : <IconVolume2 className="w-5 h-5" />}
                                </button>

                                {wrappedMusic.blocked && (
                                    <button
                                        onClick={(e) => { e.stopPropagation(); wrappedMusic.retryPlay(); }}
                                        className="absolute bottom-24 left-1/2 -translate-x-1/2 z-30 bg-black/60 hover:bg-black/80 text-white text-xs font-semibold px-4 py-2 rounded-full flex items-center gap-2 animate-pulse"
                                    >
                                        <IconVolume2 className="w-4 h-4" /> {t.wrappedMusicTapToEnable}
                                    </button>
                                )}

                                {/* Zona di tap sinistra per tornare indietro. Sul quiz senza risposta viene
                                    ristretta a una fascia in alto (sotto la barra di avanzamento), per non
                                    coprire le opzioni di risposta più in basso, ma resta comunque possibile
                                    tornare indietro. */}
                                {!wrappedQuizLocked ? (
                                    <div
                                        className="absolute inset-y-0 left-0 w-1/3 z-20"
                                        onClick={(e) => { e.stopPropagation(); prevWrappedSlide(); }}
                                    ></div>
                                ) : (
                                    <div
                                        className="absolute top-0 left-0 w-1/3 h-20 z-20"
                                        onClick={(e) => { e.stopPropagation(); prevWrappedSlide(); }}
                                    ></div>
                                )}

                                {/* Istantanea della storia appena lasciata: resta un attimo in scena sotto
                                    quella nuova e sfuma via, così anche il suo sfondo animato (es. le
                                    particelle) dissolve invece di sparire di colpo. */}
                                {outgoingWrappedSlide && (
                                    <div
                                        key={outgoingWrappedSlide.key}
                                        aria-hidden="true"
                                        className={`wrapped-slide-outgoing absolute inset-0 flex flex-col items-center justify-center text-center p-8 sm:p-10 overflow-hidden pointer-events-none animate-story-fadeout ${outgoingWrappedSlide.bgOverrideColor ? '' : `bg-gradient-to-br ${outgoingWrappedSlide.gradient}`}`}
                                        style={outgoingWrappedSlide.bgOverrideColor ? { background: raceLeaderBg(outgoingWrappedSlide.bgOverrideColor) } : undefined}
                                    >
                                        {(outgoingWrappedSlide.isMonthly || outgoingWrappedSlide.isRandomTop)
                                            ? React.cloneElement(outgoingWrappedSlide.content, { active: false })
                                            : outgoingWrappedSlide.content}
                                    </div>
                                )}

                                {/* Contenuto della slide corrente. Nota: RaceLeaderBackdrop deve restare un
                                    FRATELLO (non un figlio) del livello di contenuto con "z-10" esplicito —
                                    esattamente come nel formato Scroll, dove il cambio di colore funziona.
                                    Annidarlo dentro lo stesso div che porta anche le classi di animazione di
                                    ingresso (transform/filter) lo intrappola in una nuova stacking context
                                    "z-auto" e il cambio di colore smette di essere visibile. */}
                                <div
                                    key={wrappedIndex}
                                    className={`absolute inset-0 overflow-hidden ${wrappedSlides[wrappedIndex].bgOverrideColor ? '' : `bg-gradient-to-br ${wrappedSlides[wrappedIndex].gradient}`} ${wrappedDirection >= 0 ? 'animate-story-fwd' : 'animate-story-back'}`}
                                >
                                    {wrappedSlides[wrappedIndex].bgOverrideColor && <RaceLeaderBackdrop color={wrappedSlides[wrappedIndex].bgOverrideColor} />}
                                    <div className={`wrapped-slide-content story-ambient wrapped-variant-${wrappedItemVariant} relative z-10 w-full h-full flex flex-col items-center justify-center text-center p-8 sm:p-10 overflow-hidden`}>
                                        <WrappedBgFX variant={wrappedBgVariant} />
                                        {wrappedSlides[wrappedIndex].content}
                                    </div>
                                </div>
                            </div>
                        </div>
                        );
                    })()}

                    {/* Modal del Quiz OTTIMIZZATO PER FPS */}
                    {showQuiz && (
                        // Sfondo scuro solido e immediato (nessun fade sull'opacità, niente blur costoso) così i dati sottostanti non sono mai visibili
                        <div className="fixed inset-0 bg-[#0b0b0f] flex items-center justify-center p-4 z-[9999]" onClick={closeQuiz}>
                            {/* 2. Rimosse le ombre pesanti, usato background semplice e transform-gpu per accelerazione hardware */}
                            <div className="bg-gray-900 border border-white/10 rounded-[2rem] p-6 sm:p-10 max-w-3xl w-full relative max-h-[90vh] overflow-y-auto animate-fadein transform-gpu" onClick={(e) => e.stopPropagation()}>
                                <button onClick={closeQuiz} className="absolute top-4 sm:top-6 right-4 sm:right-6 text-gray-400 hover:text-white z-10 bg-black/40 p-2 rounded-full transition-colors">
                                    <IconClose className="w-6 h-6" />
                                </button>

                                {quizPhase === 'intro' && (
                                    <div className="text-center pt-4">
                                        <div className="flex justify-center mb-8">
                                            <div className="w-24 h-24 rounded-full bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center shadow-lg">
                                                <IconTrophy className="w-12 h-12 text-white" />
                                            </div>
                                        </div>
                                        <h3 className="font-display text-3xl sm:text-5xl font-black text-white mb-4">{t.quizTitle}</h3>
                                        <p className="text-gray-400 text-base sm:text-lg leading-relaxed mb-2 max-w-lg mx-auto">{t.quizIntro}</p>
                                        <p className="text-purple-300 text-xs sm:text-sm mb-8">
                                            {filterMode === 'all' && t.showingAll}
                                            {filterMode === 'year' && (selectedYear === 'all' ? t.pickYear : t.showingYear(selectedYear))}
                                            {filterMode === 'range' && (dateFrom || dateTo) && t.showingRange(
                                                dateFrom ? new Date(dateFrom + 'T00:00:00').toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US') : t.rangeStart,
                                                dateTo ? new Date(dateTo + 'T23:59:59').toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US') : t.rangeToday
                                            )}
                                            {filterMode === 'range' && !dateFrom && !dateTo && t.pickRange}
                                        </p>

                                        <button onClick={startQuiz} className="w-full sm:w-auto px-10 py-4 bg-white text-black active:scale-95 rounded-full font-bold text-lg transition-transform transform-gpu">
                                            {t.quizStart}
                                        </button>
                                    </div>
                                )}

                                {quizPhase === 'loading' && (
                                    <div className="flex flex-col items-center justify-center py-16 animate-fadein">
                                        <div className="relative flex items-center justify-center mb-6">
                                            <div className="loader-ring"></div>
                                            <div className="absolute inset-0 flex items-center justify-center">
                                                <div className="music-loader">
                                                    <span></span><span></span><span></span><span></span><span></span>
                                                </div>
                                            </div>
                                        </div>
                                        <p className="font-display font-bold text-lg sm:text-xl text-white mb-2 text-center">
                                            {t.quizPreparingTitle}<span className="loader-dot">.</span><span className="loader-dot">.</span><span className="loader-dot">.</span>
                                        </p>
                                        <p className="text-gray-400 text-sm text-center max-w-xs">{quizLoadingLabel || t.quizPreparingSubtitle}</p>
                                    </div>
                                )}

                                {quizPhase === 'no_data' && (
                                    <div className="text-center pt-2">
                                        <div className="flex justify-center mb-5">
                                            <div className="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                                                <IconAlert className="w-8 h-8" />
                                            </div>
                                        </div>
                                        <h3 className="font-display text-xl sm:text-2xl font-bold text-white mb-2">Dati Insufficienti</h3>
                                        <p className="text-gray-400 text-sm mb-6">{t.quizNotEnoughData}</p>
                                        <button onClick={closeQuiz} className="w-full py-3 bg-white/10 hover:bg-white/20 rounded-xl font-semibold text-white transition-colors">
                                            {t.quizClose}
                                        </button>
                                    </div>
                                )}

                                {quizPhase === 'playing' && quizQuestions[quizIndex] && (
                                    <div className="pt-2 flex flex-col h-full">
                                        <div className="flex items-center justify-between mb-6 gap-3">
                                            <span className="text-sm font-bold text-purple-400 uppercase tracking-widest">{t.quizQuestionOf(quizIndex + 1, quizQuestions.length)}</span>
                                            <span className="text-sm font-bold text-white bg-white/10 px-4 py-1.5 rounded-full">{t.quizScoreLabel}: {quizScore}</span>
                                        </div>
                                        
                                        <div className="w-full h-2 bg-white/10 rounded-full mb-8 overflow-hidden transform-gpu">
                                            <div className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-300" style={{ width: `${((quizIndex + (answered ? 1 : 0)) / quizQuestions.length) * 100}%` }}></div>
                                        </div>

                                        <h3 className="font-display text-2xl sm:text-3xl font-black text-white mb-8 leading-tight">{quizQuestions[quizIndex].question}</h3>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                            {quizQuestions[quizIndex].options.map((option, idx) => {
                                                const current = quizQuestions[quizIndex];
                                                const isEntity = ['artist', 'track', 'album', 'compare'].includes(current.id);
                                                
                                                // Estrazione Titolo e Artista
                                                let displayTitle = option;
                                                let queryArtist = null;
                                                let queryTitle = option;

                                                if (current.id === 'track' || current.id === 'album') {
                                                    const parts = String(option).split(' -|- ');
                                                    displayTitle = parts[0];
                                                    queryTitle = parts[0];
                                                    if (parts.length > 1) queryArtist = parts[1];
                                                } else if (current.id === 'artist' || current.id === 'compare') {
                                                    queryArtist = option;
                                                }
                                                
                                                let cls = 'bg-white/5 border-transparent hover:bg-white/10 text-white';
                                                if (answered) {
                                                    if (option === current.correct) {
                                                        cls = 'bg-emerald-600/20 border-emerald-500 text-white';
                                                    } else if (option === selectedOption) {
                                                        cls = 'bg-red-600/20 border-red-500 opacity-70 text-white';
                                                    } else {
                                                        cls = 'bg-black/20 border-transparent text-gray-500 opacity-50';
                                                    }
                                                }

                                                return (
                                                    <button 
                                                        key={idx} 
                                                        onClick={() => answerQuiz(option)} 
                                                        disabled={answered} 
                                                        // 3. Sostituito hover:scale con active:scale per evitare lag al passaggio del mouse, reso hardware accelerated
                                                        className={`relative w-full flex items-center p-4 rounded-2xl border-2 transition-all duration-200 transform-gpu active:scale-[0.98] text-left overflow-hidden ${cls} ${isEntity ? 'h-24 sm:h-28' : 'h-16 sm:h-20'}`}
                                                    >
                                                        {isEntity && (
                                                            <QuizImageWrapper 
                                                                artist={queryArtist} 
                                                                title={queryTitle} 
                                                                type={current.id === 'artist' || current.id === 'compare' ? 'artist' : current.id} 
                                                                altText={displayTitle}
                                                                isArtistRound={current.id === 'artist' || current.id === 'compare'}
                                                            />
                                                        )}
                                                        <span className={`font-bold leading-tight z-20 flex flex-col justify-center ${isEntity ? 'text-lg sm:text-xl' : 'text-base sm:text-lg'}`}>
                                                            <span className="line-clamp-2">{displayTitle}</span>
                                                            {queryArtist && (current.id === 'track' || current.id === 'album') && (
                                                                <span className="text-xs sm:text-sm text-gray-400 font-normal mt-0.5 truncate">{queryArtist}</span>
                                                            )}
                                                        </span>
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        <div className="mt-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                                            <div className="flex-1">
                                                {answered && (
                                                    <div className="animate-fadein">
                                                        {selectedOption === quizQuestions[quizIndex].correct ? (
                                                            <p className="text-emerald-400 font-bold text-lg flex items-center gap-2"><IconCheck className="w-6 h-6" /> {t.quizCorrect}</p>
                                                        ) : (
                                                            <p className="text-red-400 font-bold text-base sm:text-lg flex items-center gap-2"><IconX className="w-6 h-6 flex-shrink-0" /> {t.quizWrong} — {t.quizCorrectWas(String(quizQuestions[quizIndex].correct).split(' -|- ')[0])}</p>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                            
                                            <div className="flex items-center gap-3 w-full sm:w-auto">
                                                <button 
                                                    onClick={prevQuizQuestion} 
                                                    disabled={quizIndex === 0} 
                                                    className={`px-6 py-4 rounded-full font-bold transition-transform transform-gpu duration-200 ${quizIndex === 0 ? 'bg-white/10 text-white/30 cursor-not-allowed' : 'bg-white/10 hover:bg-white/20 text-white active:scale-95'}`}
                                                >
                                                    {t.quizPrev}
                                                </button>
                                                <button 
                                                    onClick={nextQuizQuestion} 
                                                    disabled={!answered} 
                                                    className={`flex-1 sm:flex-none px-8 py-4 rounded-full font-bold text-black transition-transform transform-gpu duration-200 ${answered ? 'bg-white active:scale-95' : 'bg-white/10 text-white/30 cursor-not-allowed'}`}
                                                >
                                                    {quizIndex + 1 < quizQuestions.length ? t.quizNext : t.quizSeeResult}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {quizPhase === 'finished' && (
                                    <div className="text-center pt-4">
                                        <div className="flex justify-center mb-8">
                                            <div className="w-24 h-24 rounded-full bg-gradient-to-br from-emerald-500 to-teal-500 flex items-center justify-center shadow-lg">
                                                <IconTrophy className="w-12 h-12 text-white" />
                                            </div>
                                        </div>
                                        <h3 className="font-display text-3xl sm:text-4xl font-black text-white mb-2">{t.quizFinishTitle}</h3>
                                        <p className="font-display text-6xl sm:text-7xl font-black text-emerald-400 my-6">
                                            {quizScore} <span className="text-3xl text-gray-600">/ {quizQuestions.length}</span>
                                        </p>
                                        <p className="text-gray-400 text-lg mb-4">{t.quizFinishSubtitle(quizScore, quizQuestions.length)}</p>
                                        <p className="text-xl font-bold text-purple-400 mb-10">
                                            {quizQuestions.length > 0 && (quizScore / quizQuestions.length) >= 0.8 ? t.quizFinishGreat : (quizQuestions.length > 0 && (quizScore / quizQuestions.length) >= 0.5 ? t.quizFinishGood : t.quizFinishMeh)}
                                        </p>
                                        <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                            <button onClick={startQuiz} className="px-8 py-4 bg-white text-black active:scale-95 rounded-full font-bold text-lg transition-transform transform-gpu">{t.quizPlayAgain}</button>
                                            <button onClick={closeQuiz} className="px-8 py-4 bg-white/10 hover:bg-white/20 rounded-full font-bold text-white transition-colors">{t.quizClose}</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
