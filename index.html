        const detectLang = () => {
            try {
                const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
                return nav.startsWith('it') ? 'it' : 'en';
            } catch (e) { return 'en'; }
        };

        const parseDate = (dataStr) => {
            if (!dataStr) return null;
            let dt = new Date(dataStr.replace('Z', '+00:00'));
            if (!isNaN(dt.getTime())) return dt;
            
            const matchIt = dataStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[,\s]+(\d{1,2}):(\d{2}):(\d{2})/);
            if (matchIt) {
                return new Date(matchIt[3], matchIt[2] - 1, matchIt[1], matchIt[4], matchIt[5], matchIt[6]);
            }

            const match = dataStr.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
            if (match) {
                return new Date(match[1], match[2] - 1, match[3], match[4], match[5]);
            }
            return null;
        };

        const getFasciaIndex = (ora) => {
            if (ora >= 6 && ora < 12) return 1;
            if (ora >= 12 && ora < 18) return 2;
            if (ora >= 18 && ora < 24) return 3;
            return 0;
        };

        const isUnknown = (artista, titolo) => {
            const art = (artista || '').toLowerCase();
            const tit = (titolo || '').toLowerCase();
            const paroleChiave = ['unknown', 'sconosciuto', 'sconosciuta'];
            return paroleChiave.some(k => art.includes(k) || tit.includes(k));
        };

        const parseCsvRow = (str) => {
            let arr = [];
            let quote = false;
            let row = '';
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                if (cc === '"' && quote && nc === '"') { row += '"'; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { arr.push(row); row = ''; continue; }
                row += cc;
            }
            arr.push(row);
            return arr;
        };

        const imageCache = new Map();
        const MAX_CONCURRENT_IMAGE_REQUESTS = 4;
        let activeImageRequests = 0;
        const imageRequestQueue = [];

        const runQueued = (fn) => new Promise((resolve) => {
            const runTask = async () => {
                activeImageRequests++;
                try {
                    resolve(await fn());
                } catch (e) {
                    resolve(null);
                } finally {
                    activeImageRequests--;
                    const next = imageRequestQueue.shift();
                    if (next) next();
                }
            };
            if (activeImageRequests < MAX_CONCURRENT_IMAGE_REQUESTS) runTask();
            else imageRequestQueue.push(runTask);
        });

        const wait = (ms) => new Promise(r => setTimeout(r, ms));

        const normalizeForMatch = (s) => (s || '')
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, ' ')
            .trim();

        const artistMatches = (queryArtist, resultArtist) => {
            const q = normalizeForMatch(queryArtist);
            const r = normalizeForMatch(resultArtist);
            if (!q || !r) return false;
            if (q === r) return true;
            const qWords = q.split(' ').filter(w => w.length > 1);
            if (qWords.length === 0) return false;
            return qWords.every(w => r.includes(w)) || r.includes(q) || q.includes(r);
        };

        const stripTitleQualifiers = (s) => (s || '')
            .replace(/[\(\[][^)\]]*(feat|with|explicit|clean|deluxe|remaster|radio edit|bonus track|anniversary|mono|stereo|live|official|video|music video|lyric|visualizer|audio|hd|4k)[^)\]]*[\)\]]/gi, '')
            .replace(/-\s*(single|ep|radio edit|bonus track|official video|music video|lyric video|official audio|visualizer)\s*$/gi, '')
            .replace(/\b(official video|music video|lyric video|official music video|official audio|visualizer|video ufficiale|clip officiel)\b/gi, '')
            .replace(/\s+/g, ' ')
            .trim();

        const fetchArtwork = async (artist, title, type) => {
            const cacheKey = `${type}-${artist}-${title || ''}`;
            if (imageCache.has(cacheKey)) return imageCache.get(cacheKey);

            if (type === 'artist') {
                const photo = await fetchArtistPhoto(artist);
                imageCache.set(cacheKey, photo);
                return photo;
            }

            const entity = type === 'album' ? 'album' : 'musicTrack';
            const cleanTitle = stripTitleQualifiers(title);

            const looksLikeCompilation = (collectionName) => !!collectionName &&
                /various artists|greatest hits|best of|now (that|playing)|mixtape|compilation|goes pop|megamix|top \d|hits collection|essentials?\b|anthology|playlist/i.test(collectionName);

            const findMatch = (results) => {
                const candidates = results.filter(r => {
                    if (r.kind === 'music-video') return false;
                    const resultTitle = type === 'album' ? r.collectionName : r.trackName;
                    return artistMatches(artist, r.artistName) && titleMatches(title, resultTitle);
                });
                if (candidates.length === 0) return null;
                if (candidates.length === 1) return candidates[0];

                const score = (r) => {
                    let s = 0;
                    if (r.kind === 'song') s += 4;
                    if (normalizeForMatch(r.artistName) === normalizeForMatch(artist)) s += 2;
                    const resultTitle = type === 'album' ? r.collectionName : r.trackName;
                    const qTitle = normalizeForMatch(stripTitleQualifiers(title));
                    const rTitle = normalizeForMatch(stripTitleQualifiers(resultTitle));
                    if (qTitle === rTitle) s += 2;
                    if (looksLikeCompilation(r.collectionName)) s -= 5;
                    return s;
                };

                return candidates.slice().sort((a, b) => score(b) - score(a))[0];
            };

            try {
                let results = await searchITunesResults(`${artist} ${cleanTitle}`, entity);
                let match = findMatch(results);

                if (!match) {
                    results = await searchITunesResults(`${artist} ${title}`, entity);
                    match = findMatch(results);
                }

                if (!match) {
                    results = await searchITunesResults(cleanTitle, entity);
                    match = findMatch(results);
                }

                if (match && match.artworkUrl100) {
                    const imgUrl = match.artworkUrl100.replace('100x100bb', '300x300bb');
                    imageCache.set(cacheKey, imgUrl);
                    return imgUrl;
                }
            } catch (e) {
                console.warn("Errore fetch artwork iTunes", e);
            }

            imageCache.set(cacheKey, null);
            return null;
        };

        const titleMatches = (queryTitle, resultTitle) => {
            const q = normalizeForMatch(stripTitleQualifiers(queryTitle));
            const r = normalizeForMatch(stripTitleQualifiers(resultTitle));
            if (!q || !r) return false;
            if (q === r) return true;
            if (q.includes(r) || r.includes(q)) return true;
            const qWords = q.split(' ').filter(w => w.length > 2);
            if (qWords.length === 0) return q === r;
            const rWords = new Set(r.split(' ').filter(w => w.length > 2));
            const shared = qWords.filter(w => rWords.has(w)).length;
            return shared / qWords.length >= 0.4;
        };

        const looksLikeRealPhoto = (url) => !!url && !/\.svg(\?.*)?$/i.test(url);

        const looksLikeMusicianDescription = (desc) => {
            if (!desc) return false;
            return /sing|rapp|music|band\b|compos|vocal|songwrit|producer|dj\b|hip.?hop|rock|pop\b|duo|collective|orchestra|record label/i.test(desc);
        };

        const looksLikeNonMusicianDescription = (desc) => {
            if (!desc) return false;
            return /actor\b|actress|footballer|soccer player|basketball player|politician|athlete|wrestler|author\b|novelist|film director|scientist|mathematician|chef\b|painter\b|comedian|entrepreneur|businessman|cricketer|boxer\b/i.test(desc);
        };

        const tryWikipediaPhoto = async (query) => {
            const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=1`;
            const searchRes = await fetch(searchUrl);
            if (!searchRes.ok) return null;
            const searchData = await searchRes.json();
            const pageTitle = searchData?.query?.search?.[0]?.title;
            if (!pageTitle) return null;

            const summaryUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pageTitle.replace(/ /g, '_'))}`;
            const summaryRes = await fetch(summaryUrl);
            if (!summaryRes.ok) return null;
            const summaryData = await summaryRes.json();

            if (summaryData?.type === 'disambiguation') return null;
            if (looksLikeNonMusicianDescription(summaryData?.description)) return null;

            const photoUrl = summaryData?.originalimage?.source || summaryData?.thumbnail?.source || null;
            return looksLikeRealPhoto(photoUrl) ? photoUrl : null;
        };

        const tryWikidataPhoto = async (query) => {
            const searchUrl = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=en&format=json&origin=*&limit=8&type=item`;
            const searchRes = await fetch(searchUrl);
            if (!searchRes.ok) return null;
            const searchData = await searchRes.json();
            const candidates = searchData?.search || [];
            if (candidates.length === 0) return null;

            let musicCandidate = candidates.find(c => looksLikeMusicianDescription(c.description));
            if (!musicCandidate) {
                musicCandidate = candidates.find(c => !looksLikeNonMusicianDescription(c.description));
            }
            if (!musicCandidate) return null;

            const claimUrl = `https://www.wikidata.org/w/api.php?action=wbgetclaims&entity=${musicCandidate.id}&property=P18&format=json&origin=*`;
            const claimRes = await fetch(claimUrl);
            if (!claimRes.ok) return null;
            const claimData = await claimRes.json();
            const fileName = claimData?.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
            if (!fileName) return null;

            const photoUrl = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(fileName.replace(/ /g, '_'))}?width=300`;
            return looksLikeRealPhoto(fileName) ? photoUrl : null;
        };

        const fetchArtistPhoto = (artist) => runQueued(async () => {
            const attempts = [
                () => tryWikidataPhoto(`${artist} musician`),
                () => tryWikidataPhoto(artist),
                () => tryWikipediaPhoto(`${artist} musician`),
                () => tryWikipediaPhoto(artist),
                () => tryWikidataPhoto(`${artist} singer`),
                () => tryWikidataPhoto(`${artist} rapper`),
                () => tryWikipediaPhoto(`${artist} rapper`),
                () => tryWikipediaPhoto(`${artist} band`),
            ];

            for (const attempt of attempts) {
                try {
                    const photo = await attempt();
                    if (photo) return photo;
                } catch (e) {
                    await wait(400);
                    try {
                        const retryPhoto = await attempt();
                        if (retryPhoto) return retryPhoto;
                    } catch (e2) {
                        console.warn("Errore fetch foto artista", e2);
                    }
                }
            }
            return null;
        });

        const searchITunesResults = async (term, entity) => {
            const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=${entity}&limit=15`;
            const data = await runQueued(async () => {
                const res = await fetch(url);
                return res.json();
            });
            return data?.results || [];
        };

        const EntityImage = ({ artist, title, type, altText, className }) => {
            const [src, setSrc] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);

            useEffect(() => {
                let isMounted = true;
                setLoading(true);
                setError(false);
                
                fetchArtwork(artist, title, type).then(url => {
                    if (isMounted) {
                        setSrc(url);
                        setLoading(false);
                    }
                });
                
                return () => { isMounted = false; };
            }, [artist, title, type]);

            if (loading) {
                return <div className={`animate-pulse bg-white/10 ${className}`}></div>;
            }

            if (!src || error) {
                return null;
            }

            return (
                <img 
                    src={src} 
                    alt={altText} 
                    className={`object-cover shadow-md ${className}`} 
                    loading="lazy" 
                    onError={() => setError(true)} 
                />
            );
        };

        function App() {
            const [lang, setLang] = useState(detectLang());
            const t = DICT[lang];

            const [ascolti, setAscolti] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [error, setError] = useState('');
            const [filterMode, setFilterMode] = useState('all');
            const [selectedYear, setSelectedYear] = useState('all');
            const [dateFrom, setDateFrom] = useState('');
            const [dateTo, setDateTo] = useState('');
            const [showGuide, setShowGuide] = useState(false);

            useEffect(() => {
                document.documentElement.lang = lang;
            }, [lang]);

            // Funzione per elaborare sia file singoli che estrarre file da archivi .ZIP
            const processFiles = async (files) => {
                setIsProcessing(true);
                setError('');
                let tuttiAscolti = [];

                try {
                    const filesToParse = [];

                    for (const file of files) {
                        if (file.name.endsWith('.zip')) {
                            // Lettura automatica ZIP via JSZip
                            const zip = await JSZip.loadAsync(file);
                            for (const relativePath in zip.files) {
                                const zipEntry = zip.files[relativePath];
                                if (!zipEntry.dir && (relativePath.endsWith('.json') || relativePath.endsWith('.csv'))) {
                                    const content = await zipEntry.async('string');
                                    filesToParse.push({ name: relativePath, text: content });
                                }
                            }
                        } else if (file.name.endsWith('.json') || file.name.endsWith('.csv')) {
                            const text = await file.text();
                            filesToParse.push({ name: file.name, text: text });
                        }
                    }

                    for (const itemFile of filesToParse) {
                        if (itemFile.name.endsWith('.csv')) {
                            const lines = itemFile.text.split('\n');
                            for (let j = 1; j < lines.length; j++) {
                                const line = lines[j].trim();
                                if (!line) continue;
                                const cols = parseCsvRow(line);
                                if (cols.length >= 6) {
                                    const dt = parseDate(cols[0]);
                                    if (dt && !isNaN(dt.getTime())) {
                                        tuttiAscolti.push({
                                            fonte: cols[1],
                                            artista: cols[2],
                                            titolo: cols[3],
                                            album: cols[4] || null,
                                            data: dt,
                                            ms_played: (parseFloat(cols[5]) || 0) * 60000
                                        });
                                    }
                                }
                            }
                            continue;
                        }

                        if (itemFile.name.endsWith('.json')) {
                            let data;
                            try {
                                data = JSON.parse(itemFile.text);
                            } catch (e) {
                                continue;
                            }

                            if (Array.isArray(data) && data.length > 0 && data[0].header === 'YouTube Music') {
                                data.forEach(item => {
                                    if (item.header !== 'YouTube Music') return;
                                    let nomeArtista = 'Artista Sconosciuto';
                                    const subtitles = item.subtitles || [];
                                    if (subtitles.length > 0) {
                                        nomeArtista = subtitles[0].name || nomeArtista;
                                        if (nomeArtista.endsWith(' - Topic')) nomeArtista = nomeArtista.replace(' - Topic', '');
                                    }
                                    nomeArtista = nomeArtista.trim();

                                    let titolo = (item.title || '').trim();
                                    const prefissi = ['Hai guardato ', 'Watched ', 'Hai ascoltato ', 'Listened to '];
                                    for (let prefisso of prefissi) {
                                        if (titolo.startsWith(prefisso)) {
                                            titolo = titolo.replace(prefisso, '').trim();
                                            break;
                                        }
                                    }

                                    if (titolo && titolo !== 'a video that has been removed' && !titolo.toLowerCase().includes('video non disponibile') && !isUnknown(nomeArtista, titolo)) {
                                        const dt = parseDate(item.time);
                                        if (dt) {
                                            const stimaDurataMediaMs = 180000; 
                                            tuttiAscolti.push({ fonte: 'YTMusic', artista: nomeArtista, titolo: titolo, album: null, data: dt, ms_played: stimaDurataMediaMs });
                                        }
                                    }
                                });
                            } else {
                                const items = data.items ? data.items : (Array.isArray(data) ? data : []);
                                items.forEach(item => {
                                    const artista = item.artistName || item.master_metadata_album_artist_name;
                                    const brano = item.trackName || item.master_metadata_track_name;
                                    const msPlayed = item.msPlayed || item.ms_played || 0;
                                    const album = item.master_metadata_album_album_name || null;

                                    if (artista && brano && msPlayed > 30000) {
                                        const artClean = artista.trim();
                                        const titClean = brano.trim();
                                        const albumClean = album ? album.trim() : null;

                                        if (!isUnknown(artClean, titClean)) {
                                            const dataStr = item.endTime || item.ts;
                                            const dt = parseDate(dataStr);
                                            if (dt) {
                                                tuttiAscolti.push({ fonte: 'Spotify', artista: artClean, titolo: titClean, album: albumClean, data: dt, ms_played: msPlayed });
                                            }
                                        }
                                    }
                                });
                            }
                        }
                    }

                    if (tuttiAscolti.length === 0) {
                        setError(t.errNoData);
                    } else {
                        setAscolti(tuttiAscolti);
                    }
                } catch (err) {
                    console.error(err);
                    setError(t.errReading);
                }
                setIsProcessing(false);
            };

            const handleDrop = useCallback((e) => {
                e.preventDefault();
                processFiles(Array.from(e.dataTransfer.files));
            }, [lang]);

            const handleFileInput = (e) => {
                processFiles(Array.from(e.target.files));
            };

            const resetFiltri = () => {
                setFilterMode('all');
                setSelectedYear('all');
                setDateFrom('');
                setDateTo('');
            };

            const esportaCSV = (filteredData) => {
                if (!filteredData || filteredData.length === 0) return;
                const header = 'Date,Source,Artist,Title,Album,MinutesPlayed\n';
                const rows = filteredData.map(a => {
                    const dataStr = a.data.toLocaleString(lang === 'it' ? 'it-IT' : 'en-US');
                    const escape = (s) => `"${(s || '').toString().replace(/"/g, '""')}"`;
                    return [escape(dataStr), escape(a.fonte), escape(a.artista), escape(a.titolo), escape(a.album || ''), (a.ms_played / 60000).toFixed(2)].join(',');
                }).join('\n');
                const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `analyze_your_fav_music_export_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const datiFiltrati = useMemo(() => {
                if (ascolti.length === 0) return [];
                if (filterMode === 'year' && selectedYear !== 'all') {
                    return ascolti.filter(a => a.data.getFullYear().toString() === selectedYear);
                }
                if (filterMode === 'range' && (dateFrom || dateTo)) {
                    const from = dateFrom ? new Date(dateFrom + 'T00:00:00') : null;
                    const to = dateTo ? new Date(dateTo + 'T23:59:59') : null;
                    return ascolti.filter(a => (!from || a.data >= from) && (!to || a.data <= to));
                }
                return ascolti;
            }, [ascolti, filterMode, selectedYear, dateFrom, dateTo]);

            const stats = useMemo(() => {
                if (ascolti.length === 0) return null;
                const filtered = datiFiltrati;
                if (filtered.length === 0) return null;

                const ytmCount = filtered.filter(a => a.fonte === 'YTMusic').length;
                const spCount = filtered.filter(a => a.fonte === 'Spotify').length;
                const minutiTotali = Math.floor(filtered.reduce((acc, curr) => acc + curr.ms_played, 0) / 60000);

                const artistiCount = {};
                const braniCount = {};
                const albumCount = {};
                const giorniCount = {};
                const mesiCount = {};
                const weekdayCount = {};
                const fasceCount = {};

                let minDate = filtered[0].data;
                let maxDate = filtered[0].data;

                filtered.forEach(a => {
                    artistiCount[a.artista] = (artistiCount[a.artista] || 0) + 1;
                    const chiaveBrano = `${a.titolo} -|- ${a.artista}`;
                    braniCount[chiaveBrano] = (braniCount[chiaveBrano] || 0) + 1;
                    if (a.album) albumCount[`${a.album} -|- ${a.artista}`] = (albumCount[`${a.album} -|- ${a.artista}`] || 0) + 1;

                    if (a.data < minDate) minDate = a.data;
                    if (a.data > maxDate) maxDate = a.data;

                    const y = a.data.getFullYear(), m = String(a.data.getMonth() + 1).padStart(2, '0'), d = String(a.data.getDate()).padStart(2, '0');
                    const dateStr = `${y}-${m}-${d}`;
                    giorniCount[dateStr] = (giorniCount[dateStr] || 0) + 1;

                    const meseStr = `${a.data.getFullYear()}-${a.data.getMonth()}`;
                    mesiCount[meseStr] = (mesiCount[meseStr] || 0) + 1;

                    weekdayCount[a.data.getDay()] = (weekdayCount[a.data.getDay()] || 0) + 1;

                    const fasciaIdx = getFasciaIndex(a.data.getHours());
                    fasceCount[fasciaIdx] = (fasceCount[fasciaIdx] || 0) + 1;
                });

                const sortObject = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1]);

                const topMeseRaw = sortObject(mesiCount)[0];
                let topMeseNome = t.na;
                if (topMeseRaw) {
                    const [anno, mese] = topMeseRaw[0].split('-');
                    topMeseNome = `${t.months[parseInt(mese)]} ${anno}`;
                }

                const weekdayFull = t.days.map((nome, idx) => ({ nome, count: weekdayCount[idx] || 0 }));
                const maxWeekday = Math.max(1, ...weekdayFull.map(w => w.count));

                return {
                    totali: filtered.length,
                    ytmCount, spCount, minutiTotali,
                    artistiUnici: Object.keys(artistiCount).length,
                    braniUnici: Object.keys(braniCount).length,
                    topArtisti: sortObject(artistiCount).slice(0, 10),
                    topBrani: sortObject(braniCount).filter(b => b[1] > 1).slice(0, 10),
                    topAlbum: sortObject(albumCount).filter(b => b[1] > 1).slice(0, 10),
                    weekdayFull, maxWeekday,
                    date: {
                        inizio: minDate,
                        fine: maxDate,
                        giornoTop: sortObject(giorniCount)[0] ? { data: sortObject(giorniCount)[0][0], count: sortObject(giorniCount)[0][1] } : null,
                        meseTop: topMeseNome,
                        meseCount: topMeseRaw ? topMeseRaw[1] : 0,
                        giornoSettimanaTop: sortObject(weekdayCount)[0] ? t.days[sortObject(weekdayCount)[0][0]] : t.na,
                        fasciaTop: sortObject(fasceCount)[0] ? t.slots[sortObject(fasceCount)[0][0]] : t.na
                    }
                };
            }, [datiFiltrati, lang]);

            const anniDisponibili = useMemo(() => {
                const anni = new Set();
                ascolti.forEach(a => anni.add(a.data.getFullYear()));
                return Array.from(anni).sort((a, b) => b - a);
            }, [ascolti]);

            const LangSwitch = ({ className }) => (
                <div className={`flex bg-black/30 rounded-lg p-1 border border-white/10 ${className || ''}`}>
                    <button onClick={() => setLang('it')} className={`px-2.5 py-1 rounded-md text-xs font-bold tracking-wide transition-colors ${lang === 'it' ? 'bg-white/15 text-white' : 'text-gray-500 hover:text-gray-300'}`}>IT</button>
                    <button onClick={() => setLang('en')} className={`px-2.5 py-1 rounded-md text-xs font-bold tracking-wide transition-colors ${lang === 'en' ? 'bg-white/15 text-white' : 'text-gray-500 hover:text-gray-300'}`}>EN</button>
                </div>
            );

            if (ascolti.length === 0) {
                return (
                    <div className="min-h-screen text-white flex flex-col items-center justify-center p-6 relative" onDragOver={(e) => e.preventDefault()} onDrop={handleDrop}>
                        <div className="absolute top-6 right-6 flex items-center gap-3">
                            <button onClick={() => setShowGuide(true)} className="flex items-center gap-1.5 px-3 py-1.5 bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/40 rounded-lg text-xs font-semibold text-purple-200 transition-all">
                                <IconHelp className="w-4 h-4" /> <span className="hidden sm:inline">{t.guideBtn}</span>
                            </button>
                            <LangSwitch />
                        </div>

                        <div className="max-w-2xl w-full bg-white/[0.06] backdrop-blur-xl border border-white/10 rounded-[2rem] p-8 sm:p-10 text-center shadow-2xl shadow-purple-950/40 mt-14 sm:mt-0">
                            <div className="flex justify-center mb-6">
                                <div className="relative animate-float">
                                    <div className="absolute inset-0 bg-purple-500/30 blur-2xl rounded-full"></div>
                                    <Logo className="w-16 h-16 sm:w-20 sm:h-20 relative" />
                                </div>
                            </div>
                            <p className="uppercase tracking-[0.3em] text-[0.65rem] sm:text-xs font-bold text-purple-300/80 mb-3">{t.brand}</p>
                            
                            {/* Titolo schermata iniziale ridimensionato per mobile */}
                            <h1 className="font-display text-3xl min-[375px]:text-4xl md:text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-purple-300 via-pink-400 to-orange-300 tracking-tight">
                                {t.landingTitle}
                            </h1>
                            <p className="text-gray-300 text-base sm:text-lg mb-8 leading-relaxed">
                                {t.landingSubtitle}
                            </p>

                            <div className="border-2 border-dashed border-white/20 rounded-2xl p-8 sm:p-10 bg-white/[0.03] hover:bg-white/[0.07] hover:border-purple-400/40 transition-all cursor-pointer relative group">
                                <input type="file" multiple accept=".json,.csv,.zip" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onChange={handleFileInput} />
                                {isProcessing ? (
                                    <div className="flex flex-col items-center">
                                        <IconRefresh className="w-10 h-10 text-purple-400 animate-spin-slow mb-4" />
                                        <p className="font-semibold">{t.processing}</p>
                                    </div>
                                ) : (
                                    <div className="flex flex-col items-center">
                                        <div className="flex items-center gap-2 mb-4 text-gray-400 group-hover:text-purple-400 transition-colors">
                                            <IconUpload className="w-8 h-8 sm:w-10 sm:h-10" />
                                            <IconZip className="w-8 h-8 sm:w-10 sm:h-10" />
                                        </div>
                                        <p className="font-semibold text-base sm:text-lg mb-2">{t.dropTitle}</p>
                                        <p className="text-xs sm:text-sm text-gray-400">{t.dropSubtitle}</p>
                                    </div>
                                )}
                            </div>

                            {error && (
                                <div className="mt-6 flex items-center justify-center gap-2 text-red-400 bg-red-400/10 p-3 rounded-lg text-sm">
                                    <IconAlert className="w-5 h-5 flex-shrink-0" />
                                    <p>{error}</p>
                                </div>
                            )}
                        </div>

                        {/* Modal Guida Automatica */}
                        {showGuide && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                                <div className="bg-gray-900 border border-white/10 rounded-3xl p-6 sm:p-8 max-w-lg w-full relative space-y-6">
                                    <button onClick={() => setShowGuide(false)} className="absolute top-4 sm:top-6 right-4 sm:right-6 text-gray-400 hover:text-white"><IconClose className="w-6 h-6" /></button>
                                    <h3 className="font-display text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                                        <IconHelp className="text-purple-400 flex-shrink-0" /> {t.guideTitle}
                                    </h3>
                                    <div className="space-y-4 text-sm text-gray-300">
                                        <div className="p-4 bg-white/5 rounded-xl border border-white/5 space-y-3">
                                            <p className="leading-relaxed">{t.guideSpotifyStep}</p>
                                            <a href="https://www.spotify.com/account/privacy/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg transition-colors">
                                                <IconSpotify className="w-4 h-4" /> {t.openSpotifyPrivacy}
                                            </a>
                                        </div>
                                        <div className="p-4 bg-white/5 rounded-xl border border-white/5 space-y-3">
                                            <p className="leading-relaxed">{t.guideYTMStep}</p>
                                            <a href="https://takeout.google.com/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-xs bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2 rounded-lg transition-colors">
                                                {t.openGoogleTakeout}
                                            </a>
                                        </div>
                                        <p className="text-purple-300 font-medium text-xs bg-purple-500/10 p-3 rounded-lg border border-purple-500/20 leading-relaxed">
                                            {t.guideZipNote}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen px-4 sm:px-6 md:px-8 py-6 font-sans selection:bg-purple-500/30 pb-20">
                    <div className="max-w-7xl mx-auto space-y-8">
                        
                        {/* HEADER PRINCIPALE: Risolto overflow e margini per mobile */}
                        <header className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-6">
                            
                            <div className="flex items-center gap-3 sm:gap-4 w-full">
                                <Logo className="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 flex-shrink-0" />
                                {/* min-w-0 e flex-1 impediscono al testo di spingere fuori il contenitore su mobile */}
                                <div className="flex-1 min-w-0">
                                    <h1 className="font-display text-[1.4rem] min-[375px]:text-[1.7rem] sm:text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-pink-400 to-orange-300 leading-tight tracking-tight sm:tracking-normal truncate sm:overflow-visible">
                                        {t.brand}
                                    </h1>
                                    <p className="text-gray-400 mt-1 font-medium text-xs sm:text-sm md:text-base leading-tight truncate sm:overflow-visible">{t.headerSubtitle}</p>
                                    <p className="text-purple-300 text-xs sm:text-sm mt-1 truncate sm:overflow-visible">
                                        {filterMode === 'all' && t.showingAll}
                                        {filterMode === 'year' && (selectedYear === 'all' ? t.pickYear : t.showingYear(selectedYear))}
                                        {filterMode === 'range' && (dateFrom || dateTo) && t.showingRange(
                                            dateFrom ? new Date(dateFrom + 'T00:00:00').toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US') : t.rangeStart,
                                            dateTo ? new Date(dateTo + 'T00:00:00').toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US') : t.rangeToday
                                        )}
                                        {filterMode === 'range' && !dateFrom && !dateTo && t.pickRange}
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex flex-col gap-3 bg-white/[0.04] p-4 rounded-2xl border border-white/10 w-full lg:w-auto backdrop-blur-sm">
                                <div className="flex items-center justify-between lg:justify-end gap-2">
                                    <span className="text-sm font-semibold text-gray-300 lg:hidden">Impostazioni</span>
                                    <LangSwitch />
                                </div>
                                <div className="grid grid-cols-1 sm:flex sm:flex-wrap items-center gap-3">
                                    <div className="flex bg-black/25 rounded-lg p-1 w-full sm:w-auto">
                                        <button onClick={() => setFilterMode('all')} className={`flex-1 px-3 py-2 sm:py-1.5 rounded-md text-sm font-semibold transition-colors ${filterMode === 'all' ? 'bg-purple-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>{t.fAll}</button>
                                        <button onClick={() => setFilterMode('year')} className={`flex-1 px-3 py-2 sm:py-1.5 rounded-md text-sm font-semibold transition-colors ${filterMode === 'year' ? 'bg-purple-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>{t.fYear}</button>
                                        <button onClick={() => setFilterMode('range')} className={`flex-1 px-3 py-2 sm:py-1.5 rounded-md text-sm font-semibold transition-colors ${filterMode === 'range' ? 'bg-purple-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>{t.fRange}</button>
                                    </div>

                                    {filterMode === 'year' && (
                                        <select className="w-full sm:w-auto bg-black/25 text-white font-semibold outline-none cursor-pointer px-4 py-2.5 rounded-lg text-base sm:text-sm border border-white/10" value={selectedYear} onChange={(e) => setSelectedYear(e.target.value)}>
                                            <option value="all" className="bg-gray-900">{t.selectYear}</option>
                                            {anniDisponibili.map(anno => <option key={anno} value={anno} className="bg-gray-900">{anno}</option>)}
                                        </select>
                                    )}

                                    {filterMode === 'range' && (
                                        <div className="flex flex-col sm:flex-row items-center gap-2 w-full sm:w-auto text-sm">
                                            <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} className="w-full sm:w-auto bg-black/25 text-white px-3 py-2.5 rounded-lg outline-none border border-white/10 text-base sm:text-sm" />
                                            <span className="hidden sm:inline text-gray-400">→</span>
                                            <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)} className="w-full sm:w-auto bg-black/25 text-white px-3 py-2.5 rounded-lg outline-none border border-white/10 text-base sm:text-sm" />
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                                        <button onClick={resetFiltri} className="px-4 py-2.5 bg-white/10 hover:bg-white/20 rounded-lg text-sm font-medium transition-colors text-white">{t.resetFilters}</button>
                                        <button onClick={() => esportaCSV(datiFiltrati)} className="flex items-center justify-center gap-1.5 px-4 py-2.5 bg-white/10 hover:bg-white/20 rounded-lg text-sm font-medium transition-colors text-white"><IconDownload className="w-4 h-4" />{t.exportCSV}</button>
                                    </div>
                                    <button onClick={() => { setAscolti([]); resetFiltri(); }} className="w-full sm:w-auto px-4 py-2.5 bg-white/10 hover:bg-white/20 rounded-lg text-sm font-medium transition-colors text-white mt-2 sm:mt-0">{t.newFiles}</button>
                                </div>
                                {filterMode === 'range' && dateFrom && dateTo && dateFrom > dateTo && (
                                    <p className="text-red-400 text-xs mt-1">{t.rangeError}</p>
                                )}
                            </div>
                        </header>

                        {!stats && (
                            <div className="bg-white/[0.04] border border-white/10 rounded-3xl p-8 sm:p-10 text-center text-gray-300">
                                <IconAlert className="w-10 h-10 mx-auto mb-4 text-yellow-400" />
                                <p className="text-lg font-semibold">{t.noResultsTitle}</p>
                                <p className="text-sm text-gray-500 mt-2">{t.noResultsSubtitle}</p>
                            </div>
                        )}
                        
                        {stats && (
                            <div className="space-y-6 sm:space-y-8">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-white/[0.05] border border-white/10 rounded-2xl p-5 sm:p-6 flex flex-col hover:bg-white/[0.08] hover:border-pink-400/30 transition-all">
                                        <div className="flex items-center gap-3 mb-3 sm:mb-4 text-gray-400"><IconPlay className="w-5 h-5 sm:w-6 sm:h-6 text-pink-400" /><h3 className="font-semibold text-xs sm:text-sm uppercase tracking-wider">{t.cardStreams}</h3></div>
                                        <p className="font-display text-3xl font-black mb-1 text-white">{stats.totali.toLocaleString()}</p>
                                        <p className="text-xs sm:text-sm text-gray-500">{t.cardStreamsSub(stats.spCount, stats.ytmCount)}</p>
                                    </div>
                                    <div className="bg-white/[0.05] border border-white/10 rounded-2xl p-5 sm:p-6 flex flex-col hover:bg-white/[0.08] hover:border-purple-400/30 transition-all">
                                        <div className="flex items-center gap-3 mb-3 sm:mb-4 text-gray-400"><IconClock className="w-5 h-5 sm:w-6 sm:h-6 text-purple-400" /><h3 className="font-semibold text-xs sm:text-sm uppercase tracking-wider">{t.cardMinutes}</h3></div>
                                        <p className="font-display text-3xl font-black mb-1 text-white">{stats.minutiTotali.toLocaleString()}</p>
                                        <p className="text-xs sm:text-sm text-gray-500">{t.cardMinutesSub(Math.round(stats.minutiTotali/60))}</p>
                                    </div>
                                    <div className="bg-white/[0.05] border border-white/10 rounded-2xl p-5 sm:p-6 flex flex-col hover:bg-white/[0.08] hover:border-green-400/30 transition-all">
                                        <div className="flex items-center gap-3 mb-3 sm:mb-4 text-gray-400"><IconMic className="w-5 h-5 sm:w-6 sm:h-6 text-green-400" /><h3 className="font-semibold text-xs sm:text-sm uppercase tracking-wider">{t.cardArtists}</h3></div>
                                        <p className="font-display text-3xl font-black mb-1 text-white">{stats.artistiUnici.toLocaleString()}</p>
                                        <p className="text-xs sm:text-sm text-gray-500">{t.cardArtistsSub}</p>
                                    </div>
                                    <div className="bg-white/[0.05] border border-white/10 rounded-2xl p-5 sm:p-6 flex flex-col hover:bg-white/[0.08] hover:border-blue-400/30 transition-all">
                                        <div className="flex items-center gap-3 mb-3 sm:mb-4 text-gray-400"><IconDisc className="w-5 h-5 sm:w-6 sm:h-6 text-blue-400" /><h3 className="font-semibold text-xs sm:text-sm uppercase tracking-wider">{t.cardTracks}</h3></div>
                                        <p className="font-display text-3xl font-black mb-1 text-white">{stats.braniUnici.toLocaleString()}</p>
                                        <p className="text-xs sm:text-sm text-gray-500">{t.cardTracksSub}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
                                    {/* ARTISTI */}
                                    <div className="bg-white/[0.05] border border-white/10 rounded-3xl p-5 sm:p-8 backdrop-blur-sm">
                                        <div className="flex items-center gap-3 mb-5 sm:mb-6">
                                            <IconMic className="text-purple-400 w-5 h-5 sm:w-6 sm:h-6" />
                                            <h2 className="font-display text-xl sm:text-2xl font-bold">{t.topArtists}</h2>
                                        </div>
                                        <div className="space-y-3">
                                            {stats.topArtisti.map((artista, index) => {
                                                const maxCount = stats.topArtisti[0][1];
                                                const width = `${(artista[1] / maxCount) * 100}%`;
                                                return (
                                                    <div key={index} className="relative group overflow-hidden rounded-xl bg-white/[0.02] hover:bg-white/[0.05] transition-colors border border-transparent hover:border-white/5">
                                                        <div className="flex justify-between items-center z-10 relative px-3 sm:px-4 py-2.5 sm:py-3 gap-3">
                                                            <div className="flex items-center gap-3 min-w-0 flex-1">
                                                                <span className="text-gray-500 font-bold w-4 text-center flex-shrink-0 text-sm">{index + 1}</span>
                                                                <EntityImage artist={artista[0]} type="artist" altText={artista[0]} className="w-10 h-10 sm:w-12 sm:h-12 rounded-full flex-shrink-0 border border-white/10" />
                                                                <span className="font-bold truncate text-gray-100 min-w-0 text-sm sm:text-base">{artista[0]}</span>
                                                            </div>
                                                            <span className="text-purple-300 font-mono text-xs sm:text-sm flex-shrink-0">{artista[1]} <span className="hidden sm:inline">{t.listens}</span></span>
                                                        </div>
                                                        <div className="absolute top-0 left-0 h-full w-full pointer-events-none opacity-20 group-hover:opacity-30 transition-opacity">
                                                            <div className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-1000" style={{ width }}></div>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>

                                    {/* BRANI */}
                                    <div className="bg-white/[0.05] border border-white/10 rounded-3xl p-5 sm:p-8 backdrop-blur-sm">
                                        <div className="flex items-center gap-3 mb-5 sm:mb-6">
                                            <IconMusic className="text-pink-400 w-5 h-5 sm:w-6 sm:h-6" />
                                            <h2 className="font-display text-xl sm:text-2xl font-bold">{t.topTracks}</h2>
                                        </div>
                                        <div className="space-y-3">
                                            {stats.topBrani.length > 0 ? stats.topBrani.map((brano, index) => {
                                                const [titolo, artista] = brano[0].split(' -|- ');
                                                const maxCount = stats.topBrani[0][1];
                                                const width = `${(brano[1] / maxCount) * 100}%`;
                                                return (
                                                    <div key={index} className="relative group overflow-hidden rounded-xl bg-white/[0.02] hover:bg-white/[0.05] transition-colors border border-transparent hover:border-white/5">
                                                        <div className="flex justify-between items-center z-10 relative px-3 sm:px-4 py-2.5 sm:py-3 gap-3">
                                                            <div className="flex items-center gap-3 min-w-0 flex-1">
                                                                <span className="text-gray-500 font-bold w-4 text-center flex-shrink-0 text-sm">{index + 1}</span>
                                                                <EntityImage artist={artista} title={titolo} type="track" altText={titolo} className="w-10 h-10 sm:w-12 sm:h-12 rounded-lg flex-shrink-0 border border-white/10" />
                                                                <div className="truncate min-w-0 flex-1">
                                                                    <p className="font-bold truncate text-gray-100 text-sm sm:text-base">{titolo}</p>
                                                                    <p className="text-xs text-gray-400 truncate mt-0.5">{artista}</p>
                                                                </div>
                                                            </div>
                                                            <span className="text-pink-300 font-mono text-xs sm:text-sm whitespace-nowrap flex-shrink-0">{brano[1]} <span className="hidden sm:inline">{t.listens}</span></span>
                                                        </div>
                                                        <div className="absolute top-0 left-0 h-full w-full pointer-events-none opacity-20 group-hover:opacity-30 transition-opacity">
                                                            <div className="h-full bg-pink-500 transition-all duration-1000" style={{ width }}></div>
                                                        </div>
                                                    </div>
                                                )
                                            }) : <p className="text-gray-400 text-center py-10 text-sm">{t.notEnoughTracks}</p>}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-gradient-to-br from-indigo-900/20 to-purple-900/20 border border-indigo-500/20 rounded-3xl p-5 sm:p-8">
                                    <h2 className="font-display text-xl sm:text-2xl font-bold mb-5 sm:mb-6 flex items-center gap-3 text-white">
                                        <IconCalendar className="text-indigo-400 w-5 h-5 sm:w-6 sm:h-6" /> {t.clockTitle}
                                    </h2>
                                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                                        <div className="border-l-2 border-indigo-500/50 pl-3 sm:pl-4">
                                            <p className="text-gray-400 text-xs sm:text-sm mb-1">{t.mostActiveDay}</p>
                                            <p className="text-lg sm:text-xl font-bold text-gray-100">{stats.date.giornoTop ? (() => { const [y, m, d] = stats.date.giornoTop.data.split('-'); return lang === 'it' ? `${d}/${m}/${y}` : `${m}/${d}/${y}`; })() : t.na}</p>
                                            <p className="text-indigo-300 text-xs sm:text-sm mt-1">{stats.date.giornoTop ? t.nListens(stats.date.giornoTop.count) : ''}</p>
                                        </div>
                                        <div className="border-l-2 border-indigo-500/50 pl-3 sm:pl-4">
                                            <p className="text-gray-400 text-xs sm:text-sm mb-1">{t.favoriteMonth}</p>
                                            <p className="text-lg sm:text-xl font-bold text-gray-100">{stats.date.meseTop}</p>
                                            <p className="text-indigo-300 text-xs sm:text-sm mt-1">{t.nListens(stats.date.meseCount)}</p>
                                        </div>
                                        <div className="border-l-2 border-indigo-500/50 pl-3 sm:pl-4 mt-2 sm:mt-0">
                                            <p className="text-gray-400 text-xs sm:text-sm mb-1">{t.weekday}</p>
                                            <p className="text-lg sm:text-xl font-bold text-gray-100">{stats.date.giornoSettimanaTop}</p>
                                            <p className="text-indigo-300 text-xs sm:text-sm mt-1 truncate">{t.weekdaySub}</p>
                                        </div>
                                        <div className="border-l-2 border-indigo-500/50 pl-3 sm:pl-4 mt-2 sm:mt-0">
                                            <p className="text-gray-400 text-xs sm:text-sm mb-1">{t.timeSlot}</p>
                                            <p className="text-lg sm:text-xl font-bold text-gray-100">{stats.date.fasciaTop}</p>
                                            <p className="text-indigo-300 text-xs sm:text-sm mt-1 truncate">{t.timeSlotSub}</p>
                                        </div>
                                    </div>
                                    <div className="mt-6 sm:mt-8 border-t border-white/10 pt-5 sm:pt-6">
                                    <p className="text-gray-400 text-xs sm:text-sm mb-4">{t.weeklyDistribution}</p>
                                    
                                    <div className="flex items-end justify-between gap-1.5 sm:gap-2 h-28 sm:h-32">
                                        {stats.weekdayFull.map((w, idx) => (
                                            <div key={idx} className="flex flex-col items-center flex-1 h-full">
                                                <span className="text-[10px] sm:text-xs text-gray-400 mb-1">{w.count}</span>
                                                <div className="w-full flex-1 flex items-end">
                                                    <div 
                                                        className="w-full bg-indigo-500/60 hover:bg-indigo-400/80 rounded-t-md transition-all duration-700" 
                                                        style={{ 
                                                            height: `${(w.count / stats.maxWeekday) * 100}%`, 
                                                            minHeight: w.count > 0 ? '4px' : '0px' 
                                                        }}
                                                    ></div>
                                                </div>
                                                <span className="text-[10px] sm:text-xs text-gray-500 mt-2">{w.nome.slice(0, 3)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                    <div className="mt-5 sm:mt-6 flex flex-col sm:flex-row justify-between gap-2 text-xs sm:text-sm text-gray-400 border-t border-white/10 pt-4">
                                        <span>{t.firstListen}: {stats.date.inizio.toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US')}</span>
                                        <span>{t.lastListen}: {stats.date.fine.toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US')}</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        <footer className="mt-10 sm:mt-12 pb-6 text-center text-xs text-gray-500">
                            <p>WrapYourFavMusic <span className="opacity-75">v1.1.1 (Mobile Fix)</span></p>
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
