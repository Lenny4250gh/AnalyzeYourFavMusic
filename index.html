                const totalWeight = weights.reduce((a, b) => a + b, 0);

                const now = new Date();
                const startDate = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
                const demo = [];
                const N = 2800;

                for (let i = 0; i < N; i++) {
                    let r = Math.random() * totalWeight;
                    let idx = 0;
                    while (r > weights[idx] && idx < weights.length - 1) {
                        r -= weights[idx];
                        idx++;
                    }
                    const artistObj = demoArtists[idx];
                    const track = artistObj.tracks[Math.floor(Math.random() * artistObj.tracks.length)];
                    const randomTime = startDate.getTime() + Math.random() * (now.getTime() - startDate.getTime());
                    const data = new Date(randomTime);
                    const ms_played = Math.round(60000 + Math.random() * 180000);
                    const fonte = Math.random() < 0.8 ? 'Spotify' : 'YTMusic';
                    demo.push({ fonte, artista: artistObj.artista, titolo: track.titolo, album: track.album, data, ms_played });
                }

                demo.sort((a, b) => a.data - b.data);
                setAscolti(demo);
            }, []);

            const handleDrop = useCallback((e) => {
                e.preventDefault();
                processFiles(Array.from(e.dataTransfer.files));
                if (document.activeElement) document.activeElement.blur();
                window.focus();
            }, [lang]);

            const handleFileInput = (e) => {
                processFiles(Array.from(e.target.files));
                e.target.blur();
                window.focus();
            };

            const resetFiltri = () => {
                setFilterMode('all');
                setSelectedYear('all');
                setDateFrom('');
                setDateTo('');
            };

            const esportaCSV = (filteredData) => {
                if (!filteredData || filteredData.length === 0) return;
                const header = 'Date,Source,Artist,Title,Album,MinutesPlayed\n';
                const rows = filteredData.map(a => {
                    const dataStr = a.data.toLocaleString(lang === 'it' ? 'it-IT' : 'en-US');
                    const escape = (s) => `"${(s || '').toString().replace(/"/g, '""')}"`;
                    return [escape(dataStr), escape(a.fonte), escape(a.artista), escape(a.titolo), escape(a.album || ''), (a.ms_played / 60000).toFixed(2)].join(',');
                }).join('\n');
                const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `analyze_your_fav_music_export_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const datiFiltrati = useMemo(() => {
                if (ascolti.length === 0) return [];
                if (filterMode === 'year' && selectedYear !== 'all') {
                    return ascolti.filter(a => a.data.getFullYear().toString() === selectedYear);
                }
                if (filterMode === 'range' && (dateFrom || dateTo)) {
                    const from = dateFrom ? new Date(dateFrom + 'T00:00:00') : null;
                    const to = dateTo ? new Date(dateTo + 'T23:59:59') : null;
                    return ascolti.filter(a => (!from || a.data >= from) && (!to || a.data <= to));
                }
                return ascolti;
            }, [ascolti, filterMode, selectedYear, dateFrom, dateTo]);

            const stats = useMemo(() => {
                if (ascolti.length === 0) return null;
                const filtered = datiFiltrati;
                if (filtered.length === 0) return null;

                const ytmCount = filtered.filter(a => a.fonte === 'YTMusic').length;
                const spCount = filtered.filter(a => a.fonte === 'Spotify').length;
                const minutiTotali = Math.floor(filtered.reduce((acc, curr) => acc + curr.ms_played, 0) / 60000);

                const artistiCount = {};
                const braniCount = {};
                const albumCount = {};
                const trackKnownAlbumVotes = {}; // chiaveBrano -> { nomeAlbum: quante volte compare }
                const giorniCount = {};
                const mesiCount = {};
                const mesiArtistiCount = {};
                const weekdayCount = {};
                const fasceCount = {};

                let minDate = filtered[0].data;
                let maxDate = filtered[0].data;

                // Primo passaggio: per ogni brano, raccogliamo quale album gli è stato associato nelle
                // riproduzioni che lo specificano (in pratica quelle da Spotify), così da poter attribuire
                // lo stesso album anche alle riproduzioni dello stesso brano fatte su YouTube Music, che
                // nel suo storico non include mai l'informazione dell'album.
                filtered.forEach(a => {
                    if (a.album) {
                        const chiaveBrano = `${a.titolo} -|- ${a.artista}`;
                        if (!trackKnownAlbumVotes[chiaveBrano]) trackKnownAlbumVotes[chiaveBrano] = {};
                        trackKnownAlbumVotes[chiaveBrano][a.album] = (trackKnownAlbumVotes[chiaveBrano][a.album] || 0) + 1;
                    }
                });
                const trackToAlbumName = {};
                Object.keys(trackKnownAlbumVotes).forEach(chiaveBrano => {
                    const voti = Object.entries(trackKnownAlbumVotes[chiaveBrano]).sort((x, y) => y[1] - x[1]);
                    trackToAlbumName[chiaveBrano] = voti[0][0];
                });

                const unknownAlbumTrackCount = {}; // chiaveBrano -> quante riproduzioni senza un album noto
                const unknownAlbumTrackInfo = {}; // chiaveBrano -> { artista, titolo }

                filtered.forEach(a => {
                    artistiCount[a.artista] = (artistiCount[a.artista] || 0) + 1;
                    const chiaveBrano = `${a.titolo} -|- ${a.artista}`;
                    braniCount[chiaveBrano] = (braniCount[chiaveBrano] || 0) + 1;

                    const nomeAlbumNoto = a.album || trackToAlbumName[chiaveBrano] || null;
                    if (nomeAlbumNoto) {
                        albumCount[`${nomeAlbumNoto} -|- ${a.artista}`] = (albumCount[`${nomeAlbumNoto} -|- ${a.artista}`] || 0) + 1;
                    } else {
                        unknownAlbumTrackCount[chiaveBrano] = (unknownAlbumTrackCount[chiaveBrano] || 0) + 1;
                        unknownAlbumTrackInfo[chiaveBrano] = { artista: a.artista, titolo: a.titolo };
                    }

                    if (a.data < minDate) minDate = a.data;
                    if (a.data > maxDate) maxDate = a.data;

                    const y = a.data.getFullYear(), m = String(a.data.getMonth() + 1).padStart(2, '0'), d = String(a.data.getDate()).padStart(2, '0');
                    const dateStr = `${y}-${m}-${d}`;
                    giorniCount[dateStr] = (giorniCount[dateStr] || 0) + 1;

                    const meseStr = `${a.data.getFullYear()}-${a.data.getMonth()}`;
                    mesiCount[meseStr] = (mesiCount[meseStr] || 0) + 1;
                    if (!mesiArtistiCount[meseStr]) mesiArtistiCount[meseStr] = {};
                    mesiArtistiCount[meseStr][a.artista] = (mesiArtistiCount[meseStr][a.artista] || 0) + 1;

                    weekdayCount[a.data.getDay()] = (weekdayCount[a.data.getDay()] || 0) + 1;

                    const fasciaIdx = getFasciaIndex(a.data.getHours());
                    fasceCount[fasciaIdx] = (fasceCount[fasciaIdx] || 0) + 1;
                });

                const sortObject = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1]);

                const topMeseRaw = sortObject(mesiCount)[0];
                let topMeseNome = t.na;
                if (topMeseRaw) {
                    const [anno, mese] = topMeseRaw[0].split('-');
                    topMeseNome = `${t.months[parseInt(mese)]} ${anno}`;
                }

                const weekdayFull = t.days.map((nome, idx) => ({ nome, count: weekdayCount[idx] || 0 }));
                const maxWeekday = Math.max(1, ...weekdayFull.map(w => w.count));

                // Corsa mensile tra i Top 5 artisti: per ogni mese, quante riproduzioni ha avuto in QUEL mese
                // (non cumulative) ciascuno dei 5 artisti più ascoltati in assoluto - usata per l'animazione stile
                // "bar chart race" dove i vari artisti si superano a vicenda mese dopo mese, in base a chi è stato
                // più ascoltato in quello specifico mese.
                const top5NamesForRace = sortObject(artistiCount).slice(0, 5).map(([name]) => name);
                const monthKeysSorted = Object.keys(mesiArtistiCount).sort((a, b) => {
                    const [ya, ma] = a.split('-').map(Number);
                    const [yb, mb] = b.split('-').map(Number);
                    return ya - yb || ma - mb;
                });
                const monthlyArtistRace = monthKeysSorted.map(key => {
                    const [annoM, meseM] = key.split('-').map(Number);
                    const countsThisMonth = mesiArtistiCount[key];
                    const ranking = top5NamesForRace
                        .map(n => ({ artist: n, total: countsThisMonth[n] || 0 }))
                        .sort((a, b) => b.total - a.total);
                    return {
                        key,
                        label: `${t.months[meseM].slice(0, 3)} ${annoM}`,
                        fullLabel: `${t.months[meseM]} ${annoM}`,
                        ranking
                    };
                });

                return {
                    totali: filtered.length,
                    ytmCount, spCount, minutiTotali,
                    artistiUnici: Object.keys(artistiCount).length,
                    braniUnici: Object.keys(braniCount).length,
                    albumUnici: Object.keys(albumCount).length,
                    topArtisti: sortObject(artistiCount).slice(0, 10),
                    topArtistiPerGeneri: sortObject(artistiCount).slice(0, 40),
                    topBrani: sortObject(braniCount).filter(b => b[1] > 1).slice(0, 10),
                    topAlbum: sortObject(albumCount).filter(b => b[1] > 1).slice(0, 10),
                    albumCountBase: albumCount,
                    // Elenco COMPLETO dei brani (non solo la top10): serve per la musica di sottofondo del
                    // Wrapped, per risalire al brano più ascoltato di un dato artista o di un dato album.
                    braniFull: sortObject(braniCount),
                    // chiaveBrano -> nome album, per i brani il cui album è già noto direttamente dai dati
                    // (Spotify) o per maggioranza di voti; i brani di YouTube Music risolti in un secondo
                    // momento via iTunes vengono aggiunti separatamente in albumStats.trackAlbumMapResolved.
                    trackAlbumMapKnown: trackToAlbumName,
                    // Brani più ascoltati per cui non conosciamo ancora l'album (tipicamente da YouTube Music):
                    // verranno risolti in un secondo momento via iTunes per completare le statistiche sugli album
                    unresolvedTracksForAlbum: sortObject(unknownAlbumTrackCount).slice(0, 80).map(([chiaveBrano, count]) => ({
                        chiaveBrano, count, ...unknownAlbumTrackInfo[chiaveBrano]
                    })),
                    weekdayFull, maxWeekday, monthlyArtistRace,
                    date: {
                        inizio: minDate,
                        fine: maxDate,
                        giornoTop: sortObject(giorniCount)[0] ? { data: sortObject(giorniCount)[0][0], count: sortObject(giorniCount)[0][1] } : null,
                        meseTop: topMeseNome,
                        meseCount: topMeseRaw ? topMeseRaw[1] : 0,
                        giornoSettimanaTop: sortObject(weekdayCount)[0] ? t.days[sortObject(weekdayCount)[0][0]] : t.na,
                        fasciaTop: sortObject(fasceCount)[0] ? t.slots[sortObject(fasceCount)[0][0]] : t.na
                    }
                };
            }, [datiFiltrati, lang]);

            const topArtistName = stats?.topArtisti?.[0]?.[0] || null;
            const [topGenre, setTopGenre] = useState(null);
            useEffect(() => {
                let cancelled = false;
                if (!topArtistName) { setTopGenre(null); return; }
                setTopGenre(null);
                (async () => {
                    try {
                        let results = await searchITunesResults(topArtistName, 'musicArtist');
                        let found = results.find(r => r.primaryGenreName)?.primaryGenreName;
                        if (!found) {
                            results = await searchITunesResults(topArtistName, 'song');
                            found = results.find(r => normalizeForMatch(r.artistName) === normalizeForMatch(topArtistName) && r.primaryGenreName)?.primaryGenreName;
                        }
                        if (!cancelled) setTopGenre(found || null);
                    } catch (e) {
                        if (!cancelled) setTopGenre(null);
                    }
                })();
                return () => { cancelled = true; };
            }, [topArtistName]);

            // Calcola i generi ascoltati basandosi sui generi dei tuoi artisti principali (approccio best-effort via iTunes)
            const [genreStats, setGenreStats] = useState({ loading: false, count: 0, top5: [] });
            useEffect(() => {
                let cancelled = false;
                const artistsForGenres = stats?.topArtistiPerGeneri || [];
                if (artistsForGenres.length === 0) {
                    setGenreStats({ loading: false, count: 0, top5: [] });
                    return;
                }
                setGenreStats({ loading: true, count: 0, top5: [] });
                (async () => {
                    const genreCounts = {};
                    await Promise.all(artistsForGenres.map(async ([name, count]) => {
                        const genre = await fetchArtistGenre(name);
                        if (genre) genreCounts[genre] = (genreCounts[genre] || 0) + count;
                    }));
                    if (cancelled) return;
                    const sorted = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]);
                    setGenreStats({ loading: false, count: sorted.length, top5: sorted.slice(0, 5) });
                })();
                return () => { cancelled = true; };
            }, [stats]);

            // Statistiche sugli album, valide sia per Spotify che per YouTube Music: partiamo dagli album già
            // noti (Spotify) e arricchiamo in background con l'album dei brani ascoltati su YouTube Music,
            // risolto via iTunes (best-effort, sullo stesso modello usato per i generi musicali).
            const [albumStats, setAlbumStats] = useState({ loading: false, albumUnici: 0, topAlbum: [], trackAlbumMapResolved: {} });

            useEffect(() => {
                let cancelled = false;
                if (!stats) { setAlbumStats({ loading: false, albumUnici: 0, topAlbum: [], trackAlbumMapResolved: {} }); return; }

                const baseCount = stats.albumCountBase || {};
                const baseSorted = Object.entries(baseCount).sort((a, b) => b[1] - a[1]);
                const unresolved = stats.unresolvedTracksForAlbum || [];

                setAlbumStats({
                    loading: unresolved.length > 0,
                    albumUnici: Object.keys(baseCount).length,
                    topAlbum: baseSorted.filter(b => b[1] > 1).slice(0, 10),
                    trackAlbumMapResolved: {}
                });

                if (unresolved.length === 0) return;

                (async () => {
                    const merged = { ...baseCount };

                    // Le richieste passano comunque dalla coda condivisa (fetchTrackAlbum → searchITunesResults →
                    // runQueued), che limita già la concorrenza reale a 4 richieste alla volta e riprova in caso
                    // di errore/rate-limit. Il vecchio ciclo seriale con 300ms di pausa FISSA tra un brano e
                    // l'altro era quindi un doppio freno inutile (ogni richiesta aspettava sia la coda SIA questa
                    // pausa), che con tante tracce da abbinare poteva far durare l'operazione anche oltre un
                    // minuto. Lanciandole tutte insieme e lasciando che sia la coda a scaglionarle davvero, lo
                    // stesso lavoro finisce in una frazione del tempo, restando comunque rispettoso verso l'API.
                    const results = await Promise.all(unresolved.map(async (tr) => {
                        const albumName = await fetchTrackAlbum(tr.artista, tr.titolo);
                        return albumName ? { tr, albumName } : null;
                    }));

                    if (cancelled) return;

                    const resolvedMap = {};
                    results.forEach(res => {
                        if (!res) return;
                        const key = `${res.albumName} -|- ${res.tr.artista}`;
                        merged[key] = (merged[key] || 0) + res.tr.count;
                        resolvedMap[res.tr.chiaveBrano] = res.albumName;
                    });

                    const sorted = Object.entries(merged).sort((a, b) => b[1] - a[1]);
                    setAlbumStats({
                        loading: false,
                        albumUnici: Object.keys(merged).length,
                        topAlbum: sorted.filter(b => b[1] > 1).slice(0, 10),
                        trackAlbumMapResolved: resolvedMap
                    });
                })();

                return () => { cancelled = true; };
            }, [stats]);

            // "Specchi" sempre aggiornati di genreStats/albumStats, leggibili da dentro un effect senza
            // dover rimettere questi oggetti nelle dipendenze (cosa che farebbe ripartire l'effect ad ogni
            // loro variazione, anche solo di riferimento) e senza rischiare di leggere valori vecchi.
            const genreStatsRef = useRef(genreStats);
            genreStatsRef.current = genreStats;
            const albumStatsRef = useRef(albumStats);
            albumStatsRef.current = albumStats;

            useEffect(() => {
                const topArtistName = stats?.topArtisti?.[0]?.[0];
                if (!topArtistName) return;
                // Precarica e converte la foto dell'artista #1 non appena i dati sono pronti (Promise condivisa, no doppioni)
                getArtistPhotoDataUrl(topArtistName);
            }, [stats]);

            const anniDisponibili = useMemo(() => {
                const anni = new Set();
                ascolti.forEach(a => anni.add(a.data.getFullYear()));
                return Array.from(anni).sort((a, b) => b - a);
            }, [ascolti]);

            const quizQuestions = useMemo(() => generateQuizQuestions(stats, t, lang), [stats, quizSeed, lang]);

            // Domande del mini-quiz integrato come "storia" dentro il Wrapped (indipendenti dal quiz del modal)
            const storyQuizQuestions = useMemo(() => generateQuizQuestions(stats, t, lang).filter(q => q.id === 'track'), [stats, lang]);
            const [storyQuizAnswers, setStoryQuizAnswers] = useState({});
            // Tiene traccia delle domande del quiz-storia per cui è già scattato l'avanzamento
            // automatico: così, se si torna indietro su una domanda a cui si è già risposto in
            // precedenza, non riparte da capo il timer che fa avanzare da solo alla storia dopo.
            const autoAdvancedQuizIdsRef = useRef(new Set());
            const answerStoryQuiz = useCallback((qid, option) => {
                setStoryQuizAnswers(prev => (prev[qid] !== undefined ? prev : { ...prev, [qid]: option }));
            }, []);

            const openQuiz = () => {
                clearAutoAdvance();
                setShowQuiz(true);
                setQuizPhase('intro');
                setQuizIndex(0);
                setQuizScore(0);
                setSelectedOption(null);
                setAnswered(false);
            };

            // Le domande del quiz del modal cambiano ad ogni partita (nuovo quizSeed → nuove
            // opzioni), quindi non possono essere precaricate in anticipo come quelle del Wrapped.
            // Appena si preme "Inizia il quiz" passiamo per una breve fase 'loading' che scarica le
            // immagini di TUTTE le opzioni della partita appena generata, così durante il gioco non
            // ci sono più skeleton che compaiono a scatti sulle risposte. Molte di queste immagini
            // sono già in cache (dashboard/Wrapped le hanno probabilmente già scaricate), quindi
            // nella maggior parte dei casi questa fase dura pochissimo o è invisibile.
            const [quizPreparing, setQuizPreparing] = useState(false);
            const [quizLoadingLabel, setQuizLoadingLabel] = useState('');

            const startQuiz = () => {
                clearAutoAdvance();
                if (quizQuestions && quizQuestions.length > 0) {
                    setQuizSeed(s => s + 1);
                    setQuizPhase('loading');
                    setQuizPreparing(true);
                    setQuizIndex(0);
                    setQuizScore(0);
                    setSelectedOption(null);
                    setAnswered(false);
                    setQuizHistory({});
                } else {
                    setQuizPhase('no_data');
                }
            };

            useEffect(() => {
                if (!quizPreparing) return;

                let cancelled = false;
                (async () => {
                    const jobs = [];
                    const seen = new Set();
                    const addJob = (artist, title, type) => {
                        if (!artist) return;
                        const key = `${type}-${artist}-${title || ''}`;
                        if (seen.has(key)) return;
                        seen.add(key);
                        jobs.push({ artist, title, type });
                    };

                    quizQuestions.forEach(q => {
                        if (!['artist', 'track', 'album', 'compare'].includes(q.id)) return;
                        (q.options || []).forEach(option => {
                            let optArtist = null;
                            let optTitle = null;
                            if (q.id === 'track' || q.id === 'album') {
                                const parts = String(option).split(' -|- ');
                                optTitle = parts[0];
                                if (parts.length > 1) optArtist = parts[1];
                            } else {
                                optArtist = option;
                            }
                            addJob(optArtist, optTitle, q.id === 'artist' || q.id === 'compare' ? 'artist' : q.id);
                        });
                    });

                    setQuizLoadingLabel(t.quizPreparingSubtitle);
                    const IMAGE_LOAD_CONCURRENCY = 4;
                    let nextIdx = 0;
                    const worker = async () => {
                        while (nextIdx < jobs.length) {
                            if (cancelled) return;
                            const job = jobs[nextIdx++];
                            await fetchArtwork(job.artist, job.title, job.type);
                        }
                    };
                    await Promise.all(
                        Array.from({ length: Math.min(IMAGE_LOAD_CONCURRENCY, jobs.length) }, worker)
                    );
                    if (cancelled) return;

                    setQuizPhase('playing');
                    setQuizPreparing(false);
                })();

                return () => { cancelled = true; };
            }, [quizPreparing, quizQuestions]);

            const autoAdvanceTimeoutRef = useRef(null);

            const clearAutoAdvance = () => {
                if (autoAdvanceTimeoutRef.current) {
                    clearTimeout(autoAdvanceTimeoutRef.current);
                    autoAdvanceTimeoutRef.current = null;
                }
            };

            // Pulisce il timer automatico quando il componente viene smontato
            useEffect(() => {
                return () => clearAutoAdvance();
            }, []);

            const answerQuiz = (option) => {
                if (answered) return;
                setSelectedOption(option);
                setAnswered(true);
                const current = quizQuestions[quizIndex];
                const isCorrect = !!(current && option === current.correct);
                if (isCorrect) {
                    setQuizScore(s => s + 1);
                }
                setQuizHistory(h => ({ ...h, [quizIndex]: { option, isCorrect } }));

                // Dopo aver mostrato se la risposta è giusta o sbagliata, passa in automatico alla domanda successiva
                clearAutoAdvance();
                autoAdvanceTimeoutRef.current = setTimeout(() => {
                    autoAdvanceTimeoutRef.current = null;
                    nextQuizQuestion();
                }, 1500);
            };

            const nextQuizQuestion = () => {
                clearAutoAdvance();
                if (quizIndex + 1 < quizQuestions.length) {
                    const nextIndex = quizIndex + 1;
                    setQuizIndex(nextIndex);
                    const prevAnswer = quizHistory[nextIndex];
                    if (prevAnswer) {
                        setSelectedOption(prevAnswer.option);
                        setAnswered(true);
                    } else {
                        setSelectedOption(null);
                        setAnswered(false);
                    }
                } else {
                    setQuizPhase('finished');
                }
            };

            const prevQuizQuestion = () => {
                clearAutoAdvance();
                if (quizIndex > 0) {
                    const prevIndex = quizIndex - 1;
                    setQuizIndex(prevIndex);
                    const prevAnswer = quizHistory[prevIndex];
                    if (prevAnswer) {
                        setSelectedOption(prevAnswer.option);
                        setAnswered(true);
                    } else {
                        setSelectedOption(null);
                        setAnswered(false);
                    }
                }
            };

            const closeQuiz = () => {
                clearAutoAdvance();
                setShowQuiz(false);
                // Se il modal viene chiuso mentre le immagini della partita sono ancora in
                // caricamento, annulla quella preparazione: altrimenti, riaprendo il quiz (che
                // riparte sempre da 'intro'), il caricamento in sospeso potrebbe completarsi da
                // solo e catapultare l'utente dritto in 'playing' senza che abbia premuto Inizia.
                setQuizPreparing(false);
            };

            const nfWrapped = (n) => Math.round(n).toLocaleString(lang === 'it' ? 'it-IT' : 'en-US');
            const truncateWrapped = (str, max = 40) => {
                if (!str) return str;
                return str.length > max ? str.slice(0, max).trimEnd() + '…' : str;
            };

            // Riduce la dimensione dei numeri "hero" del Wrapped quando le cifre sono tante,
            // per evitare che con numeri alti (es. minuti totali) il testo sia enorme e vada
            // fuori dai margini o si spezzi male su schermi piccoli.
            const heroNumClass = (str) => {
                const len = String(str).replace(/[^0-9]/g, '').length;
                if (len >= 7) return 'text-4xl sm:text-6xl';
                if (len >= 6) return 'text-5xl sm:text-7xl';
                if (len >= 5) return 'text-6xl sm:text-7xl';
                return 'text-7xl sm:text-8xl';
            };

            // Indice della "sotto-storia" corrente all'interno della slide "artista del mese"
            const [monthlyStoryIdx, setMonthlyStoryIdx] = useState(0);
            // Indice della "sotto-storia" corrente all'interno della slide "Top 5 artisti in ordine casuale"
            const [randomArtistStoryIdx, setRandomArtistStoryIdx] = useState(0);

            // Ordine casuale dei Top 5 artisti, calcolato UNA SOLA VOLTA per ogni set di statistiche
            // (non deve dipendere da randomArtistStoryIdx, altrimenti verrebbe rimescolato ad ogni avanzamento)
            const shuffledTop5Artists = useMemo(() => {
                if (!stats || !stats.topArtisti || stats.topArtisti.length < 3) return [];
                return shuffleArray(stats.topArtisti.slice(0, 5).map(([name]) => name))
                    .map((name, i) => ({ key: `${name}-${i}`, artist: name }));
            }, [stats]);

            // Risale al brano PIÙ ASCOLTATO (in base ai dati reali) di un dato album, incrociando
            // l'elenco completo dei brani con la mappa brano->album (sia quella nota direttamente
            // dai dati sia quella risolta in un secondo momento via iTunes per YouTube Music).
            // Chiave univoca titolo+artista, nello stesso formato di "chiaveBrano", usata per
            // capire se un brano è già stato scelto come audioCue di un'altra slide del Wrapped
            const trackAudioKey = (title, artist) => `${title} -|- ${artist || ''}`;

            const getTopTrackForAlbum = (albumTitle, albumArtist, excludeKeys) => {
                if (!stats || !albumTitle) return null;
                const known = stats.trackAlbumMapKnown || {};
                const resolved = albumStats.trackAlbumMapResolved || {};
                let best = null; // migliore in assoluto, usato come fallback se sono tutti esclusi
                let bestNotExcluded = null;
                (stats.braniFull || []).forEach(([chiaveBrano, count]) => {
                    const [title, artist] = chiaveBrano.split(' -|- ');
                    if (albumArtist && artist !== albumArtist) return;
                    const albumOfTrack = known[chiaveBrano] || resolved[chiaveBrano] || null;
                    if (albumOfTrack !== albumTitle) return;
                    if (!best || count > best.count) best = { title, artist, count };
                    const isExcluded = excludeKeys && excludeKeys.has(trackAudioKey(title, artist));
                    if (!isExcluded && (!bestNotExcluded || count > bestNotExcluded.count)) {
                        bestNotExcluded = { title, artist, count };
                    }
                });
                // Preferiamo un brano non ancora usato altrove nel Wrapped; se nell'album c'è un
                // solo brano (o sono tutti già usati), ripieghiamo comunque sul più ascoltato
                return bestNotExcluded || best;
            };

            // Risale al brano più ascoltato di un dato artista, in base ai dati reali. Se
            // excludeKeys è passato, evita brani già scelti come audioCue di un'altra slide del
            // Wrapped (es. lo stesso brano già mostrato come "top brano assoluto"), passando al
            // brano successivo più ascoltato di quell'artista; se non ce ne sono altri, ripiega
            // comunque sul più ascoltato per non lasciare la slide senza musica.
            const getTopTrackForArtist = (artistName, excludeKeys) => {
                if (!stats || !artistName) return null;
                let best = null;
                let bestNotExcluded = null;
                (stats.braniFull || []).forEach(([chiaveBrano, count]) => {
                    const [title, artist] = chiaveBrano.split(' -|- ');
                    if (artist !== artistName) return;
                    if (!best || count > best.count) best = { title, artist, count };
                    const isExcluded = excludeKeys && excludeKeys.has(trackAudioKey(title, artist));
                    if (!isExcluded && (!bestNotExcluded || count > bestNotExcluded.count)) {
                        bestNotExcluded = { title, artist, count };
                    }
                });
                return bestNotExcluded || best;
            };

            // Brano scelto (una sola volta a sessione) tra la Top 5 per accompagnare l'inizio del
            // Wrapped, prima che vengano rivelati il top brano/album/artista
            const introAudioTrack = useMemo(() => {
                if (!stats || !stats.topBrani || stats.topBrani.length === 0) return null;
                const pool = stats.topBrani.slice(0, 5);
                const [key] = pool[Math.floor(Math.random() * pool.length)];
                const [title, artist] = key.split(' -|- ');
                return { title, artist };
            }, [stats]);

            // Pool di riserva (Top 10 brani) usato come fallback audio: se l'anteprima iTunes del
            // brano "giusto" per una slide non è disponibile (rate limit, CORS, 403...), proviamo
            // in ordine questi brani finché uno restituisce un'anteprima riproducibile, così la
            // musica di sottofondo non resta muta. Appena l'anteprima corretta torna disponibile
            // (es. cambiando slide e tornando indietro, o a un nuovo tentativo), viene usata quella.
            const topAudioPool = useMemo(() => {
                if (!stats || !stats.topBrani) return [];
                return stats.topBrani.slice(0, 10).map(([key]) => {
                    const [title, artist] = key.split(' -|- ');
                    return { title, artist };
                });
            }, [stats]);

            // Costruisce un audioCue con lista di brani di riserva (Top 10) allegata, escludendo
            // il brano stesso dalla lista dei candidati di riserva
            const buildAudioCue = (idPrefix, title, artist) => {
                if (!title) return null;
                return {
                    id: `${idPrefix}-${title}-${artist}`,
                    title,
                    artist,
                    candidates: topAudioPool.filter(c => !(c.title === title && c.artist === artist))
                };
            };

            const wrappedSlides = useMemo(() => {
                if (!stats) return [];
                const slides = [];
                const dateFmt = (d) => d.toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US', { day: 'numeric', month: 'short', year: 'numeric' });
                // Tiene traccia dei brani già usati come sottofondo di una slide precedente, così
                // le slide successive (album/artista) evitano di riproporre lo stesso identico brano
                const usedAudioTrackKeys = new Set();
                if (introAudioTrack) usedAudioTrackKeys.add(trackAudioKey(introAudioTrack.title, introAudioTrack.artist));

                // 0. Copertina
                slides.push({
                    gradient: 'from-fuchsia-600 to-purple-700',
                    audioCue: introAudioTrack ? buildAudioCue('intro', introAudioTrack.title, introAudioTrack.artist) : null,
                    content: (
                        <div className="flex flex-col items-center justify-center gap-6">
                            <div className="w-20 h-20 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center animate-float">
                                <IconMusic className="w-10 h-10 text-white" />
                            </div>
                            <h2 className="font-wrapped text-4xl sm:text-5xl font-black text-white leading-tight">{t.wrappedCoverTitle}</h2>
                            <p className="text-white/80 text-sm sm:text-base">{t.wrappedCoverSubtitle(dateFmt(stats.date.inizio), dateFmt(stats.date.fine))}</p>
                            <p className="wrapped-nav-hint text-white/60 text-xs mt-10 animate-pulse">{t.wrappedTapHint}</p>
                            <p className="wrapped-scroll-hint hidden text-white/60 text-xs mt-10 animate-pulse">{t.wrappedScrollHint}</p>
                        </div>
                    )
                });

                // 1. Minuti ascoltati
                const hoursW = Math.round(stats.minutiTotali / 60);
                const daysW = Math.floor(stats.minutiTotali / 1440);
                slides.push({
                    gradient: 'from-blue-600 to-indigo-700',
                    content: (
                        <div className="flex flex-col items-center gap-4">
                            <IconClock className="w-10 h-10 text-white/80 animate-float-icon" />
                            <p className={`font-wrapped ${heroNumClass(nfWrapped(stats.minutiTotali))} font-black text-white animate-number-pop`}>{nfWrapped(stats.minutiTotali)}</p>
                            <p className="text-white text-lg font-bold">{t.wrappedMinutesTitle}</p>
                            <p className="text-white/70 text-sm max-w-xs">{t.wrappedMinutesSub(nfWrapped(hoursW), nfWrapped(daysW))}</p>
                        </div>
                    )
                });

                // 2. Numero generi ascoltati
                slides.push({
                    gradient: 'from-cyan-500 to-blue-600',
                    content: (
                        <div className="flex flex-col items-center gap-4">
                            <IconTag className="w-8 h-8 text-white/70 mt-1 animate-float-icon" />
                            <p className={`font-wrapped ${heroNumClass(genreStats.loading ? '' : (genreStats.count > 0 ? nfWrapped(genreStats.count) : ''))} font-black text-white animate-number-pop`}>
                                {genreStats.loading ? '…' : (genreStats.count > 0 ? nfWrapped(genreStats.count) : t.na)}
                            </p>
                            <p className="text-white text-lg font-bold">{t.wrappedGenresTitle}</p>
                            <p className="text-white/70 text-sm max-w-xs">{t.wrappedGenresSub}</p>
                        </div>
                    )
                });

                // 3. Top 5 generi ascoltati
                if (genreStats.top5.length > 0) {
                    slides.push({
                        gradient: 'from-[#1DB954] to-emerald-700',
                        content: (
                            <div className="flex flex-col items-center gap-5 w-full -mt-12">
                                <p className="text-white text-xl font-bold -mt-1 mb-1">{t.wrappedTopGenresListTitle}</p>
                                <div className="w-full max-w-xs flex flex-col gap-3">
                                    {genreStats.top5.map(([name], idx) => (
                                        <div key={name} className="flex items-center gap-3 bg-white/10 rounded-xl px-4 py-2.5 animate-float-card" style={{ animationDelay: `${idx * 0.15}s` }}>
                                            <span className="font-wrapped text-xl font-black text-white/70 w-5">{idx + 1}</span>
                                            <span className="flex-1 text-white font-semibold text-sm text-left truncate">{name}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )
                    });
                }

                // 4. Numero brani ascoltati
                slides.push({
                    gradient: 'from-rose-600 to-red-700',
                    content: (
                        <div className="flex flex-col items-center gap-4">
                            <IconMusic className="w-8 h-8 text-white/70 mt-1 animate-float-icon" />
                            <p className={`font-wrapped ${heroNumClass(nfWrapped(stats.braniUnici))} font-black text-white animate-number-pop`}>{nfWrapped(stats.braniUnici)}</p>
                            <p className="text-white text-lg font-bold">{t.wrappedTracksCountTitle}</p>
                            <p className="text-white/70 text-sm max-w-xs">{t.wrappedTracksCountSub}</p>
                        </div>
                    )
                });


                // 5. Quiz: indovina il brano #1
                storyQuizQuestions.forEach((q, qi) => {
                    const answeredQ = storyQuizAnswers[q.id] !== undefined;
                    const selectedQ = storyQuizAnswers[q.id];
                    const isEntityQ = ['artist', 'track', 'album', 'compare'].includes(q.id);

                    slides.push({
                        gradient: 'from-violet-700 to-fuchsia-800',
                        qid: q.id,
                        content: (
                            <div className="flex flex-col items-center justify-center gap-4 w-full h-full" onClick={(e) => { if (answeredQ) return; e.stopPropagation(); }}>
                                <p className="text-white/70 text-xs uppercase tracking-widest font-bold">{t.quizQuestionOf(qi + 1, storyQuizQuestions.length)}</p>
                                <h3 className="font-wrapped text-xl sm:text-2xl font-black text-white leading-tight px-2">{q.question}</h3>
                                <div className="w-full flex flex-col gap-2.5 px-1 max-h-[48vh] overflow-y-auto no-scrollbar">
                                    {q.options.map((option, idx) => {
                                        let displayTitleQ = option;
                                        let queryArtistQ = null;
                                        let queryTitleQ = option;
                                        if (q.id === 'track' || q.id === 'album') {
                                            const parts = String(option).split(' -|- ');
                                            displayTitleQ = parts[0];
                                            queryTitleQ = parts[0];
                                            if (parts.length > 1) queryArtistQ = parts[1];
                                        } else if (q.id === 'artist' || q.id === 'compare') {
                                            queryArtistQ = option;
                                        }

                                        let clsQ = 'bg-white/10 border-transparent text-white';
                                        if (answeredQ) {
                                            if (option === q.correct) clsQ = 'bg-emerald-500/25 border-emerald-400 text-white';
                                            else if (option === selectedQ) clsQ = 'bg-red-500/25 border-red-400 opacity-70 text-white';
                                            else clsQ = 'bg-black/20 border-transparent text-white/40 opacity-50';
                                        }

                                        return (
                                            <button
                                                key={idx}
                                                onClick={(e) => { e.stopPropagation(); if (!answeredQ) answerStoryQuiz(q.id, option); }}
                                                disabled={answeredQ}
                                                className={`relative w-full flex items-center p-3 rounded-2xl border-2 transition-all duration-200 transform-gpu active:scale-[0.98] text-left overflow-hidden ${clsQ} ${isEntityQ ? 'h-16 sm:h-20' : ''}`}
                                            >
                                                {isEntityQ && (
                                                    <EntityImageBox
                                                        artist={queryArtistQ}
                                                        title={queryTitleQ}
                                                        type={q.id === 'artist' || q.id === 'compare' ? 'artist' : q.id}
                                                        altText={displayTitleQ}
                                                        boxClassName={`relative flex-shrink-0 mr-3 overflow-hidden bg-white/10 flex items-center justify-center w-11 h-11 sm:w-14 sm:h-14 ${q.id === 'artist' || q.id === 'compare' ? 'rounded-full' : 'rounded-lg'}`}
                                                        imgClassName="w-full h-full"
                                                    />
                                                )}
                                                <span className="font-bold leading-tight text-sm sm:text-base flex flex-col justify-center">
                                                    <span className="line-clamp-2">{displayTitleQ}</span>
                                                    {queryArtistQ && (q.id === 'track' || q.id === 'album') && (
                                                        <span className="text-xs text-gray-300 font-normal mt-0.5 truncate">{queryArtistQ}</span>
                                                    )}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                                {answeredQ && (
                                    <p className={`text-sm font-bold animate-fadein ${selectedQ === q.correct ? 'text-emerald-300' : 'text-red-300'}`}>
                                        {selectedQ === q.correct ? t.quizCorrect : `${t.quizWrong} — ${t.quizCorrectWas(String(q.correct).split(' -|- ')[0])}`}
                                    </p>
                                )}
                                <p className="text-white/40 text-[11px] mt-1">{answeredQ ? t.wrappedQuizTapContinue : t.wrappedQuizChoose}</p>
                            </div>
                        )
                    });
                });
                
                // 5b. Top brano più ascoltato
                if (stats.topBrani.length > 0) {
                    const [trackKeyW, trackCountW] = stats.topBrani[0];
                    const [trackTitleW, trackArtistW] = trackKeyW.split(' -|- ');
                    slides.push({
                        gradient: 'from-orange-500 to-rose-600',
                        audioCue: buildAudioCue('track', trackTitleW, trackArtistW),
                        content: (
                            <div className="flex flex-col items-center gap-4">
                                <IconTrophy className="w-8 h-8 text-white/90 animate-float-icon" />
                                <p className="text-white/80 text-sm uppercase tracking-wider font-semibold">{t.wrappedTopTrackLabel}</p>
                                <EntityImageBox artist={trackArtistW} title={trackTitleW} type="track" altText={trackTitleW} boxClassName="w-36 h-36 rounded-2xl overflow-hidden bg-white/10 border-4 border-white/30 shadow-xl flex items-center justify-center animate-float-cover" imgClassName="w-full h-full" />
                                <p className="font-wrapped text-3xl sm:text-4xl font-black text-white text-center px-4 break-words">{truncateWrapped(trackTitleW, 40)}</p>
                                {trackArtistW && <p className="text-white/70 text-sm font-semibold">{trackArtistW}</p>}
                                <p className="text-white/80 text-sm">{t.wrappedTopTrackSub(nfWrapped(trackCountW))}</p>
                            </div>
                        )
                    });
                    usedAudioTrackKeys.add(trackAudioKey(trackTitleW, trackArtistW));
                }

                // 6. Top 5 brani più ascoltati
                if (stats.topBrani.length >= 3) {
                    slides.push({
                        gradient: 'from-sky-500 to-blue-700',
                        content: (
                            <div className="flex flex-col items-center gap-5 w-full">
                                <p className="text-white text-xl font-bold mb-2">{t.wrappedTopTracksListTitle}</p>
                                <div className="w-full max-w-xs flex flex-col gap-3">
                                    {stats.topBrani.slice(0, 5).map(([keyT, count], idx) => {
                                        const [title, artist] = keyT.split(' -|- ');
                                        return (
                                            <div key={keyT} className="flex items-center gap-3 bg-white/10 rounded-xl px-3 py-2.5 animate-float-card" style={{ animationDelay: `${idx * 0.15}s` }}>
                                                <span className="font-wrapped text-xl font-black text-white/70 w-5 flex-shrink-0">{idx + 1}</span>
                                                <EntityImageBox artist={artist} title={title} type="track" altText={title} boxClassName="w-11 h-11 rounded-lg overflow-hidden bg-white/10 flex-shrink-0" imgClassName="w-full h-full" />
                                                <span className="flex-1 min-w-0 text-left">
                                                    <span className="block text-white font-semibold text-sm truncate">{title}</span>
                                                    <span className="block text-white/60 text-xs truncate">{artist}</span>
                                                </span>
                                                <span className="text-white/60 text-xs flex-shrink-0">{nfWrapped(count)}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )
                    });
                }

                // 6b. Numero album ascoltati
                // FIX instabilità: prima il numero veniva mostrato anche mentre in background si stava
                // ancora provando a risolvere via iTunes l'album dei brani ascoltati su YouTube Music.
                // Se l'utente arrivava su questa slide PRIMA che la risoluzione finisse (dipende da quanto
                // è reattivo lo swipe e da quanto è veloce la rete in quel momento), vedeva un conteggio
                // parziale — da qui gran parte della "casualità" percepita tra un dispositivo e l'altro,
                // più della semplice variabilità di rete. Ora, finché albumStats è ancora in caricamento,
                // si mostra un indicatore invece del numero: il totale che l'utente vede è sempre quello
                // definitivo (per quella sessione), mai un valore a metà.
                slides.push({
                    gradient: 'from-pink-500 to-fuchsia-700',
                    content: (
                        <div className="flex flex-col items-center gap-4">
                            <IconDisc className={`w-8 h-8 text-white/70 mt-1 ${albumStats.loading ? 'animate-spin-slower' : 'animate-float-icon'}`} />
                            {albumStats.loading ? (
                                <div className="flex flex-col items-center gap-3 py-4">
                                    <div className="flex gap-1.5">
                                        <span className="w-2.5 h-2.5 rounded-full bg-white/80 animate-bounce" style={{ animationDelay: '0ms' }}></span>
                                        <span className="w-2.5 h-2.5 rounded-full bg-white/80 animate-bounce" style={{ animationDelay: '150ms' }}></span>
                                        <span className="w-2.5 h-2.5 rounded-full bg-white/80 animate-bounce" style={{ animationDelay: '300ms' }}></span>
                                    </div>
                                    <p className="text-white/70 text-sm max-w-xs text-center">{t.wrappedAlbumsCountLoading}</p>
                                </div>
                            ) : (
                                <p className={`font-wrapped ${heroNumClass(nfWrapped(albumStats.albumUnici))} font-black text-white animate-number-pop`}>{nfWrapped(albumStats.albumUnici)}</p>
                            )}
                            <p className="text-white text-lg font-bold">{t.wrappedAlbumsCountTitle}</p>
                            {!albumStats.loading && (
                                <p className="text-white/70 text-sm max-w-xs">{t.wrappedAlbumsCountSub}</p>
                            )}
                        </div>
                    )
                });

                // 6c. Album più ascoltato
                if (albumStats.topAlbum.length > 0) {
                    const [albumKeyW, albumCountW] = albumStats.topAlbum[0];
                    const [albumTitleW, albumArtistW] = albumKeyW.split(' -|- ');
                    const albumTopTrackW = getTopTrackForAlbum(albumTitleW, albumArtistW, usedAudioTrackKeys);
                    if (albumTopTrackW) usedAudioTrackKeys.add(trackAudioKey(albumTopTrackW.title, albumTopTrackW.artist));
                    slides.push({
                        gradient: 'from-fuchsia-600 to-indigo-700',
                        audioCue: albumTopTrackW ? buildAudioCue('album', albumTopTrackW.title, albumTopTrackW.artist) : null,
                        content: (
                            <div className="flex flex-col items-center gap-4 -mt-12">
                                <IconTrophy className="w-8 h-8 text-white/90 animate-float-icon" />
                                <p className="text-white/80 text-sm uppercase tracking-wider font-semibold">{t.wrappedTopAlbumLabel}</p>
                                <EntityImageBox artist={albumArtistW} title={albumTitleW} type="album" altText={albumTitleW} boxClassName="w-36 h-36 rounded-2xl overflow-hidden bg-white/10 border-4 border-white/30 shadow-xl flex items-center justify-center animate-float-cover" imgClassName="w-full h-full" />
                                <p className="font-wrapped text-3xl sm:text-4xl font-black text-white text-center px-4 break-words">{truncateWrapped(albumTitleW, 40)}</p>
                                {albumArtistW && <p className="text-white/70 text-sm font-semibold">{albumArtistW}</p>}
                                <p className="text-white/80 text-sm">{t.wrappedTopAlbumSub(nfWrapped(albumCountW))}</p>
                            </div>
                        )
                    });
                }

                // 6d. Top 5 album più ascoltati
                if (albumStats.topAlbum.length >= 3) {
                    slides.push({
                        gradient: 'from-purple-600 to-rose-600',
                        content: (
                            <div className="flex flex-col items-center gap-5 w-full">
                                <p className="text-white text-xl font-bold mb-2">{t.wrappedTopAlbumsListTitle}</p>
                                <div className="w-full max-w-xs flex flex-col gap-3">
                                    {albumStats.topAlbum.slice(0, 5).map(([keyA, count], idx) => {
                                        const [title, artist] = keyA.split(' -|- ');
                                        return (
                                            <div key={keyA} className="flex items-center gap-3 bg-white/10 rounded-xl px-3 py-2.5 animate-float-card" style={{ animationDelay: `${idx * 0.15}s` }}>
                                                <span className="font-wrapped text-xl font-black text-white/70 w-5 flex-shrink-0">{idx + 1}</span>
                                                <EntityImageBox artist={artist} title={title} type="album" altText={title} boxClassName="w-11 h-11 rounded-lg overflow-hidden bg-white/10 flex-shrink-0" imgClassName="w-full h-full" />
                                                <span className="flex-1 min-w-0 text-left">
                                                    <span className="block text-white font-semibold text-sm truncate">{title}</span>
                                                    <span className="block text-white/60 text-xs truncate">{artist}</span>
                                                </span>
                                                <span className="text-white/60 text-xs flex-shrink-0">{nfWrapped(count)}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )
                    });
                }

                // 7. Numero artisti ascoltati
                slides.push({
                    gradient: 'from-amber-400 to-orange-600',
                    content: (
                        <div className="flex flex-col items-center gap-4">
                            <IconMic className="w-8 h-8 text-white/70 mt-1" />
                            <p className={`font-wrapped ${heroNumClass(nfWrapped(stats.artistiUnici))} font-black text-white animate-number-pop`}>{nfWrapped(stats.artistiUnici)}</p>
                            <p className="text-white text-lg font-bold">{t.wrappedArtistsCountTitle}</p>
                            <p className="text-white/70 text-sm max-w-xs">{t.wrappedArtistsCountSub}</p>
                        </div>
                    )
                });

                // 8. Top 5 artisti più ascoltati (ordine casuale) - macro-storia con una sotto-storia per artista,
                // sullo stesso modello della macro-storia "artista del mese"
                // (shuffledTop5Artists è calcolato una sola volta fuori da questo useMemo, per non essere rimescolato ad ogni avanzamento)
                if (shuffledTop5Artists.length >= 3) {
                    slides.push({
                        gradient: 'from-violet-600 to-indigo-800',
                        isRandomTop: true,
                        // Usati dal formato Scroll per far funzionare il tap sinistra/destra tra le
                        // sotto-storie (un artista alla volta) anche lì, esattamente come nel formato Storie.
                        subStoryIdx: randomArtistStoryIdx,
                        subStoryMax: shuffledTop5Artists.length - 1,
                        onSubStoryChange: setRandomArtistStoryIdx,
                        content: (
                            <RandomTopArtistsStory
                                artists={shuffledTop5Artists}
                                title={t.wrappedRandomArtistsListTitle}
                                subtitle={t.wrappedRandomArtistsListSub}
                                idx={randomArtistStoryIdx}
                                onIdxChange={setRandomArtistStoryIdx}
                                onFinish={() => nextWrappedSlide()}
                                skipLabel={t.wrappedMonthlySkip}
                                backLabel={t.wrappedMonthlyBack}
                                canGoBack={wrappedIndex > 0}
                                onGoBack={() => {
                                    // Torna alla storia precedente del Wrapped (macro-storia), non all'artista precedente
                                    setRandomArtistStoryIdx(0);
                                    setWrappedIndex(i => Math.max(i - 1, 0));
                                }}
                                onSkipAll={() => {
                                    // Salta l'intera macro-storia dei "Top 5 artisti casuali" e passa alla slide successiva del Wrapped
                                    setRandomArtistStoryIdx(0);
                                    setWrappedIndex(i => Math.min(i + 1, wrappedSlides.length - 1));
                                }}
                            />
                        )
                    });
                }

                AreThereMultipleMonths = false

                // 9. Corsa tra i Top 5 artisti mese dopo mese (se il periodo copre più mesi) - si superano a vicenda
                if (stats.monthlyArtistRace && stats.monthlyArtistRace.length > 1) {
                    AreThereMultipleMonths = true

                    slides.push({
                        gradient: 'from-indigo-600 to-blue-800',
                        isMonthly: true,
                        // Colore di sfondo dinamico: quello del primo classificato del mese corrente.
                        // Resta invariato finché il leader non cambia da un mese all'altro.
                        bgOverrideColor: raceLeaderColor(stats.monthlyArtistRace, monthlyStoryIdx),
                        // Usati dal formato Scroll per far funzionare il tap sinistra/destra tra le
                        // sotto-storie (un mese alla volta) anche lì, esattamente come nel formato Storie.
                        subStoryIdx: monthlyStoryIdx,
                        subStoryMax: stats.monthlyArtistRace.length - 1,
                        onSubStoryChange: setMonthlyStoryIdx,
                        content: (
                            <MonthlyArtistRaceStory
                                months={stats.monthlyArtistRace}
                                title={t.wrappedMonthlyArtistsTitle}
                                subtitle={t.wrappedMonthlyArtistsSub}
                                idx={monthlyStoryIdx}
                                onIdxChange={setMonthlyStoryIdx}
                                onFinish={() => nextWrappedSlide()}
                                skipLabel={t.wrappedMonthlySkip}
                                backLabel={t.wrappedMonthlyBack}
                                newLabel={t.wrappedMonthlyNew}
                                canGoBack={wrappedIndex > 0}
                                onGoBack={() => {
                                    // Torna alla storia precedente del Wrapped (macro-storia), non al mese precedente
                                    setMonthlyStoryIdx(0);
                                    setWrappedIndex(i => Math.max(i - 1, 0));
                                }}
                                onSkipAll={() => {
                                    // Salta l'intera macro-storia dei "top del mese" e passa alla slide successiva del Wrapped
                                    setMonthlyStoryIdx(0);
                                    setWrappedIndex(i => Math.min(i + 1, wrappedSlides.length - 1));
                                }}
                            />
                        )
                    });
                }

                // 9.5. Mese con più riproduzioni
                if (stats.date.meseTop && stats.date.meseTop !== t.na && AreThereMultipleMonths) {
                    slides.push({
                        gradient: 'from-teal-500 to-emerald-700',
                        bgVariant: 'orbs',
                        content: (
                            <div className="flex flex-col items-center gap-4">
                                <IconClock className="w-8 h-8 text-white/80 animate-float-icon" />
                                <p className="text-white/80 text-sm uppercase tracking-wider font-semibold">{t.wrappedTopMonthLabel}</p>
                                <p className="font-wrapped text-3xl sm:text-4xl font-black text-white text-center px-2 break-words animate-number-pop">{stats.date.meseTop}</p>
                                <p className="text-white/80 text-sm">{t.wrappedTopMonthSub(nfWrapped(stats.date.meseCount))}</p>
                            </div>
                        )
                    });
                }

                // 10. Top artista più ascoltato
                if (stats.topArtisti.length > 0) {
                    const [artistName, artistCount] = stats.topArtisti[0];
                    const artistTopTrackW = getTopTrackForArtist(artistName, usedAudioTrackKeys);
                    if (artistTopTrackW) usedAudioTrackKeys.add(trackAudioKey(artistTopTrackW.title, artistTopTrackW.artist));
                    slides.push({
                        gradient: 'from-orange-500 to-red-700',
                        bgVariant: 'rings',
                        audioCue: artistTopTrackW ? buildAudioCue('artist', artistTopTrackW.title, artistTopTrackW.artist) : null,
                        content: (
                            <div className="flex flex-col items-center gap-4">
                                <IconTrophy className="w-8 h-8 text-white/90 animate-float-icon" />
                                <p className="text-white/80 text-sm uppercase tracking-wider font-semibold">{t.wrappedTopArtistLabel}</p>
                                <div className="relative w-36 h-36">
                                    <EntityImageBox artist={artistName} type="artist" altText={artistName} boxClassName="relative w-full h-full rounded-full overflow-hidden bg-white/10 shadow-xl flex items-center justify-center animate-float-cover" imgClassName="w-full h-full rounded-full object-cover" />
                                </div>
                                <p className="font-wrapped text-3xl sm:text-4xl font-black text-white text-center px-2 break-words">{artistName}</p>
                                <p className="text-white/80 text-sm">{t.wrappedTopArtistSub(nfWrapped(artistCount))}</p>
                            </div>
                        )
                    });
                }

                // 11. Top 5 artisti più ascoltati (in ordine)
                if (stats.topArtisti.length >= 3) {
                    slides.push({
                        gradient: 'from-fuchsia-700 to-indigo-800',
                        bgVariant: 'blob',
                        content: (
                            <div className="flex flex-col items-center gap-5 w-full">
                                <p className="text-white text-xl font-bold mb-2">{t.wrappedTopArtistsListTitle}</p>
                                <div className="w-full max-w-xs flex flex-col gap-3">
                                    {stats.topArtisti.slice(0, 5).map(([name, count], idx) => (
                                        <div key={name} className="flex items-center gap-3 bg-white/10 rounded-xl px-3 py-2.5 animate-float-card" style={{ animationDelay: `${idx * 0.15}s` }}>
                                            <span className="font-wrapped text-xl font-black text-white/70 w-5 flex-shrink-0">{idx + 1}</span>
                                            <EntityImageBox artist={name} type="artist" altText={name} boxClassName="w-11 h-11 rounded-full overflow-hidden bg-white/10 flex-shrink-0" imgClassName="w-full h-full" />
                                            <span className="flex-1 text-white font-semibold text-sm text-left truncate">{name}</span>
                                            <span className="text-white/60 text-xs flex-shrink-0">{nfWrapped(count)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )
                    });
                }

                // 11.5. Abitudini d'ascolto: giorno da record, giorno della settimana preferito, fascia oraria top
                if (stats.date.giornoTop) {
                    const [recAnno, recMese, recGiorno] = stats.date.giornoTop.data.split('-');
                    const recordDayLabel = lang === 'it' ? `${recGiorno}/${recMese}/${recAnno}` : `${recMese}/${recGiorno}/${recAnno}`;
                    slides.push({
                        gradient: 'from-indigo-700 to-purple-800',
                        bgVariant: 'orbs',
                        content: (
                            <div className="flex flex-col items-center gap-5 w-full">
                                <IconCalendar className="w-8 h-8 text-white/80 animate-float-icon" />
                                <p className="text-white text-xl font-bold -mt-1 mb-1">{t.wrappedHabitsTitle}</p>
                                <div className="w-full max-w-xs flex flex-col gap-3">
                                    <div className="flex items-center gap-4 bg-white/10 rounded-2xl px-4 py-3.5 animate-float-card" style={{ animationDelay: '0s' }}>
                                        <div className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center flex-shrink-0">
                                            <IconCalendar className="w-5 h-5 text-white/80" />
                                        </div>
                                        <div className="flex-1 text-left min-w-0">
                                            <p className="text-white/60 text-xs uppercase tracking-wide">{t.wrappedHabitsRecordDay}</p>
                                            <p className="text-white font-bold text-base truncate">{recordDayLabel}</p>
                                            <p className="text-white/70 text-xs mt-0.5">{t.nListens(stats.date.giornoTop.count)}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4 bg-white/10 rounded-2xl px-4 py-3.5 animate-float-card" style={{ animationDelay: '0.15s' }}>
                                        <div className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center flex-shrink-0">
                                            <IconTag className="w-5 h-5 text-white/80" />
                                        </div>
                                        <div className="flex-1 text-left min-w-0">
                                            <p className="text-white/60 text-xs uppercase tracking-wide">{t.wrappedHabitsWeekday}</p>
                                            <p className="text-white font-bold text-base truncate">{stats.date.giornoSettimanaTop}</p>
                                            <p className="text-white/70 text-xs mt-0.5">{t.weekdaySub}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4 bg-white/10 rounded-2xl px-4 py-3.5 animate-float-card" style={{ animationDelay: '0.3s' }}>
                                        <div className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center flex-shrink-0">
                                            <IconClock className="w-5 h-5 text-white/80" />
                                        </div>
                                        <div className="flex-1 text-left min-w-0">
                                            <p className="text-white/60 text-xs uppercase tracking-wide">{t.wrappedHabitsTimeSlot}</p>
                                            <p className="text-white font-bold text-base truncate">{stats.date.fasciaTop}</p>
                                            <p className="text-white/70 text-xs mt-0.5">{t.timeSlotSub}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )
                    });
                }

                // 12. Riassunto finale
                const topArtistNameW = stats.topArtisti[0] ? stats.topArtisti[0][0] : t.na;
                const topTrackKeyW = stats.topBrani[0] ? stats.topBrani[0][0] : null;
                const topTrackTitleW = topTrackKeyW ? topTrackKeyW.split(' -|- ')[0] : t.na;
                const recapGenreW = topGenre || (genreStats.top5[0] ? genreStats.top5[0][0] : null);
                const localeW = lang === 'it' ? 'it-IT' : 'en-US';
                let periodLabelW = t.wrappedRecapPeriodAll;
                if (filterMode === 'year' && selectedYear !== 'all') {
                    periodLabelW = t.wrappedRecapPeriodYear(selectedYear);
                } else if (filterMode === 'range' && (dateFrom || dateTo)) {
                    periodLabelW = t.wrappedRecapPeriodRange(
                        dateFrom ? new Date(dateFrom + 'T00:00:00').toLocaleDateString(localeW) : t.rangeStart,
                        dateTo ? new Date(dateTo + 'T23:59:59').toLocaleDateString(localeW) : t.rangeToday
                    );
                } else if (stats.date.inizio && stats.date.fine) {
                    periodLabelW = t.wrappedRecapPeriodRange(
                        stats.date.inizio.toLocaleDateString(localeW),
                        stats.date.fine.toLocaleDateString(localeW)
                    );
                }
                slides.push({
                    gradient: 'from-neutral-100 to-neutral-100',
                    isRecap: true,
                    content: (
                        <div className="w-full h-full flex items-center justify-center">
                            <div ref={wrappedCardRef} className="relative flex flex-col w-full max-w-[360px] bg-[#f4f2ec] text-black rounded-2xl overflow-hidden shadow-[inset_0_0_0_1px_rgba(0,0,0,0.015)]">
                                <div
                                    className="absolute inset-0 !opacity-[0.05] pointer-events-none"
                                    style={{ backgroundImage: 'repeating-linear-gradient(135deg, #000 0px, #000 2px, transparent 2px, transparent 16px)' }}
                                ></div>

                                <div className="relative flex flex-col px-5 pt-5">
                                    <div className="flex justify-center mb-3">
                                        <span className="bg-black text-white text-[10px] font-bold uppercase tracking-wide px-3 py-1.5 rounded-full">{periodLabelW}</span>
                                    </div>
                                    <div className="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-black/10 mb-4 flex-shrink-0 flex items-center justify-center">
                                        {topArtistNameW && topArtistNameW !== t.na ? (
                                            <RecapArtistPhoto artist={topArtistNameW} altText={topArtistNameW} className="w-full h-full grayscale" />
                                        ) : (
                                            <IconMusic className="w-10 h-10 text-black/30" />
                                        )}
                                    </div>

                                    <div className="flex gap-4 text-left mb-5">
                                        <div className="flex-1 min-w-0 overflow-hidden">
                                            <p className="text-[9px] font-bold uppercase tracking-wide text-black/50 mb-2 whitespace-nowrap">{t.wrappedRecapTopArtists}</p>
                                            <div className="flex flex-col gap-1.5">
                                                {stats.topArtisti.slice(0, 5).map(([name], idx) => (
                                                    <div key={name} className="flex items-baseline gap-1.5">
                                                        <span className="text-black/40 text-[10px] font-bold flex-shrink-0">{idx + 1}</span>
                                                        <span className="text-[13px] font-semibold leading-snug truncate">{name}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="flex-1 min-w-0 overflow-hidden">
                                            <p className="text-[9px] font-bold uppercase tracking-wide text-black/50 mb-2 whitespace-nowrap">{t.wrappedRecapTopTracks}</p>
                                            <div className="flex flex-col gap-1.5">
                                                {stats.topBrani.slice(0, 5).map(([keyT]) => keyT.split(' -|- ')[0]).map((title, idx) => (
                                                    <div key={`${title}-${idx}`} className="flex items-baseline gap-1.5">
                                                        <span className="text-black/40 text-[10px] font-bold flex-shrink-0">{idx + 1}</span>
                                                        <span className="text-[13px] font-semibold leading-snug truncate">{title}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-4 text-left pb-5">
                                        <div className="flex-1 min-w-0">
                                            <p className="text-[9px] font-bold uppercase tracking-wide text-black/50 mb-1 whitespace-nowrap">{t.wrappedRecapMinutesListen}</p>
                                            <p className="font-wrapped text-xl font-black leading-tight truncate">{nfWrapped(stats.minutiTotali)}</p>
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <p className="text-[9px] font-bold uppercase tracking-wide text-black/50 mb-1 whitespace-nowrap">{t.wrappedRecapGenre}</p>
                                            <p className="font-wrapped text-sm font-black leading-tight truncate">{recapGenreW || (topArtistName ? '…' : t.na)}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="relative border-t border-black/10 px-5 py-3 flex items-center gap-2 flex-shrink-0 min-w-0">
                                    <div className="w-6 h-6 rounded-full bg-black flex items-center justify-center flex-shrink-0">
                                        <IconMusic className="w-3.5 h-3.5 text-white" />
                                    </div>
                                    <span className="font-wrapped font-bold text-[11px] tracking-wide truncate min-w-0">{t.wrappedRecapLink}</span>
