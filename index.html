<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnalyzeYourFavMusic</title>
    <meta name="description" content="Analyze your Spotify and YouTube Music listening history — completely offline, in your browser.">
    <meta name="theme-color" content="#0f0f13">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23a855f7'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230f0f13'/%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%230f0f13'/%3E%3Ccircle cx='32' cy='32' r='2.5' fill='url(%23g)'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: #f3f4f6;
            font-family: 'Inter', system-ui, sans-serif;
            background-image:
                radial-gradient(ellipse 80% 50% at 15% -10%, rgba(168, 85, 247, 0.25), transparent),
                radial-gradient(ellipse 60% 40% at 90% 10%, rgba(236, 72, 153, 0.18), transparent),
                radial-gradient(ellipse 60% 40% at 50% 100%, rgba(99, 102, 241, 0.15), transparent);
            background-attachment: fixed;
        }
        .font-display { font-family: 'Outfit', 'Inter', system-ui, sans-serif; }
        .animate-spin-slow { animation: spin 2.2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
        .animate-float { animation: floatY 4s ease-in-out infinite; }
        ::selection { background: rgba(168, 85, 247, 0.35); }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 999px; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useCallback, useEffect } = React;

        // --- ICONE ---
        const IconUpload = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M12 12v9"></path><path d="m16 16-4-4-4 4"></path></svg>;
        const IconMusic = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>;
        const IconMic = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 8-9.04 9.06a2.828 2.828 0 1 0 3.988 3.988L16 12"></path><circle cx="17" cy="7" r="5"></circle></svg>;
        const IconCalendar = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg>;
        const IconClock = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconPlay = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const IconDisc = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>;
        const IconRefresh = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;
        const IconAlert = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>;
        const IconDownload = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>;

        const Logo = ({ className }) => (
            <svg className={className} viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stopColor="#c084fc" />
                        <stop offset="100%" stopColor="#f472b6" />
                    </linearGradient>
                </defs>
                <circle cx="32" cy="32" r="30" fill="url(#logoGrad)" opacity="0.15" />
                <circle cx="32" cy="32" r="22" fill="url(#logoGrad)" />
                <circle cx="32" cy="32" r="7.5" fill="#0b0b0f" />
                <circle cx="32" cy="32" r="2.75" fill="url(#logoGrad)" />
            </svg>
        );

        const DICT = {
            it: {
                brand: 'AnalyzeYourFavMusic',
                landingTitle: 'Il Tuo Wrapped, Sempre',
                landingSubtitle: "Combina i dati di Spotify e YouTube Music in un'unica dashboard locale.",
                dropTitle: 'Trascina i file JSON o CSV',
                dropSubtitle: 'clicca per sfogliare',
                processing: 'Elaborazione...',
                errNoData: 'Nessun dato valido trovato.',
                errReading: 'Errore nella lettura dei file.',
                topArtists: 'Top Artisti', topTracks: 'Top Brani', topAlbums: 'Top Album',
                listens: 'asc.', na: 'N/D', cardStreams: 'Streaming Totali', cardMinutes: 'Minuti',
                cardArtists: 'Artisti', cardTracks: 'Brani', clockTitle: 'La tua routine',
                mostActiveDay: 'Giorno Top', favoriteMonth: 'Mese Top', weekday: 'Giorno relax',
                timeSlot: 'Fascia Oraria', weeklyDistribution: 'Distribuzione Settimanale',
                months: ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'],
                days: ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'],
                slots: ['Notte (0-6)', 'Mattina (6-12)', 'Pomeriggio (12-18)', 'Sera (18-24)'],
                resetFilters: 'Reset', exportCSV: 'Esporta', newFiles: 'Nuovi File',
                fAll: 'Tutto', fYear: 'Anno', fRange: 'Date', selectYear: 'Anno...',
            },
            en: {
                brand: 'AnalyzeYourFavMusic',
                landingTitle: 'Your Wrapped, Anytime',
                landingSubtitle: 'Combine Spotify and YouTube Music data in a local dashboard.',
                dropTitle: 'Drop JSON or CSV files',
                dropSubtitle: 'click to browse',
                processing: 'Processing...',
                errNoData: 'No valid data found.',
                errReading: 'Error reading files.',
                topArtists: 'Top Artists', topTracks: 'Top Tracks', topAlbums: 'Top Albums',
                listens: 'plays', na: 'N/A', cardStreams: 'Total Streams', cardMinutes: 'Minutes',
                cardArtists: 'Artists', cardTracks: 'Tracks', clockTitle: 'Your Routine',
                mostActiveDay: 'Top Day', favoriteMonth: 'Top Month', weekday: 'Chill Day',
                timeSlot: 'Time Slot', weeklyDistribution: 'Weekly Distribution',
                months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
                days: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                slots: ['Night (0-6)', 'Morning (6-12)', 'Afternoon (12-18)', 'Evening (18-24)'],
                resetFilters: 'Reset', exportCSV: 'Export', newFiles: 'New Files',
                fAll: 'All', fYear: 'Year', fRange: 'Range', selectYear: 'Year...',
            }
        };

        const imageCache = new Map();

        // LOGICA DI RICERCA MIGLIORATA
        const fetchArtwork = async (artist, title, type) => {
            const cleanArtist = (artist || '').replace(/\s-\sTopic$/i, '').trim();
            const cleanTitle = (title || '').trim();
            const cacheKey = `${type}-${cleanArtist}-${cleanTitle}`;
            
            if (imageCache.has(cacheKey)) return imageCache.get(cacheKey);

            let url = '';
            if (type === 'artist') {
                // Per l'artista cerchiamo specificamente l'entità musicArtist
                url = `https://itunes.apple.com/search?term=${encodeURIComponent(cleanArtist)}&entity=musicArtist&limit=1`;
            } else if (type === 'album') {
                url = `https://itunes.apple.com/search?term=${encodeURIComponent(cleanArtist + ' ' + cleanTitle)}&entity=album&limit=1`;
            } else {
                url = `https://itunes.apple.com/search?term=${encodeURIComponent(cleanArtist + ' ' + cleanTitle)}&entity=musicTrack&limit=1`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    const result = data.results[0];
                    let imgUrl = null;

                    // Verifica corrispondenza per evitare foto a caso
                    const foundName = (result.artistName || result.collectionName || '').toLowerCase();
                    const searchName = cleanArtist.toLowerCase();
                    
                    // Se stiamo cercando un artista e il nome restituito non c'entra nulla, scartiamo
                    if (type === 'artist' && !foundName.includes(searchName) && !searchName.includes(foundName)) {
                         // Fallback: prova a cercare un brano di quell'artista per avere almeno una cover corretta se l'artista non ha foto
                         const fallbackRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanArtist)}&entity=musicTrack&limit=1`);
                         const fallbackData = await fallbackRes.json();
                         if (fallbackData.results?.[0]) {
                             imgUrl = fallbackData.results[0].artworkUrl100.replace('100x100bb', '400x400bb');
                         }
                    } else {
                        imgUrl = (result.artworkUrl100 || '').replace('100x100bb', '400x400bb');
                    }

                    if (imgUrl) {
                        imageCache.set(cacheKey, imgUrl);
                        return imgUrl;
                    }
                }
            } catch (e) { console.warn(e); }

            imageCache.set(cacheKey, null);
            return null;
        };

        const EntityImage = ({ artist, title, type, altText, className }) => {
            const [src, setSrc] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                let isMounted = true;
                fetchArtwork(artist, title, type).then(url => {
                    if (isMounted) { setSrc(url); setLoading(false); }
                });
                return () => { isMounted = false; };
            }, [artist, title, type]);

            if (loading) return <div className={`animate-pulse bg-white/10 ${className}`}></div>;

            if (!src) {
                const charCode = (altText || 'A').charCodeAt(0);
                const gradients = [
                    'from-purple-600 to-blue-600',
                    'from-pink-600 to-orange-600',
                    'from-emerald-600 to-teal-600',
                    'from-blue-600 to-indigo-600'
                ];
                const grad = gradients[charCode % gradients.length];
                return (
                    <div className={`flex items-center justify-center bg-gradient-to-br ${grad} ${className} shadow-inner`}>
                        <span className="text-white font-bold text-xs opacity-80">
                            {(altText || '??').substring(0, 2).toUpperCase()}
                        </span>
                    </div>
                );
            }

            return <img src={src} alt={altText} className={`object-cover shadow-md ${className}`} loading="lazy" />;
        };

        // --- UTILS ---
        const parseDate = (s) => {
            if (!s) return null;
            let d = new Date(s.replace('Z', '+00:00'));
            if (!isNaN(d.getTime())) return d;
            const m1 = s.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
            if (m1) return new Date(m1[1], m1[2]-1, m1[3], m1[4], m1[5]);
            return null;
        };

        const getFasciaIndex = (h) => {
            if (h >= 6 && h < 12) return 1;
            if (h >= 12 && h < 18) return 2;
            if (h >= 18 && h < 24) return 3;
            return 0;
        };

        function App() {
            const [lang, setLang] = useState('it');
            const t = DICT[lang];
            const [ascolti, setAscolti] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [filterMode, setFilterMode] = useState('all');
            const [selectedYear, setSelectedYear] = useState('all');
            const [dateFrom, setDateFrom] = useState('');
            const [dateTo, setDateTo] = useState('');

            const processFiles = async (files) => {
                setIsProcessing(true);
                let list = [];
                try {
                    for (const file of files) {
                        const text = await file.text();
                        if (file.name.endsWith('.json')) {
                            const data = JSON.parse(text);
                            const items = Array.isArray(data) ? data : (data.items || []);
                            items.forEach(item => {
                                // Spotify or YTM
                                const isYTM = item.header === 'YouTube Music';
                                let art = isYTM ? (item.subtitles?.[0]?.name || '') : (item.artistName || item.master_metadata_album_artist_name);
                                let tit = isYTM ? (item.title || '') : (item.trackName || item.master_metadata_track_name);
                                let ms = isYTM ? 180000 : (item.msPlayed || item.ms_played || 0);
                                let alb = item.master_metadata_album_album_name || null;
                                let time = item.time || item.endTime || item.ts;

                                if (isYTM && tit.startsWith('Watched ')) tit = tit.replace('Watched ', '');
                                if (isYTM && tit.startsWith('Hai guardato ')) tit = tit.replace('Hai guardato ', '');
                                
                                if (art && tit && ms > 30000) {
                                    const dt = parseDate(time);
                                    if (dt) list.push({ fonte: isYTM ? 'YTM' : 'Spotify', artista: art.trim(), titolo: tit.trim(), album: alb, data: dt, ms_played: ms });
                                }
                            });
                        }
                    }
                    setAscolti(list);
                } catch (e) { alert(t.errReading); }
                setIsProcessing(false);
            };

            const datiFiltrati = useMemo(() => {
                if (filterMode === 'year' && selectedYear !== 'all') return ascolti.filter(a => a.data.getFullYear().toString() === selectedYear);
                if (filterMode === 'range' && (dateFrom || dateTo)) {
                    const f = dateFrom ? new Date(dateFrom) : null;
                    const o = dateTo ? new Date(dateTo) : null;
                    return ascolti.filter(a => (!f || a.data >= f) && (!o || a.data <= o));
                }
                return ascolti;
            }, [ascolti, filterMode, selectedYear, dateFrom, dateTo]);

            const stats = useMemo(() => {
                if (datiFiltrati.length === 0) return null;
                const arts = {}, trks = {}, albs = {}, wkd = {}, fsc = {}, days = {};
                let ms = 0, sp = 0, ytm = 0;
                let minD = datiFiltrati[0].data, maxD = datiFiltrati[0].data;

                datiFiltrati.forEach(a => {
                    ms += a.ms_played;
                    if (a.fonte === 'Spotify') sp++; else ytm++;
                    arts[a.artista] = (arts[a.artista] || 0) + 1;
                    trks[`${a.titolo} -|- ${a.artista}`] = (trks[`${a.titolo} -|- ${a.artista}`] || 0) + 1;
                    if (a.album) albs[`${a.album} -|- ${a.artista}`] = (albs[`${a.album} -|- ${a.artista}`] || 0) + 1;
                    wkd[a.data.getDay()] = (wkd[a.data.getDay()] || 0) + 1;
                    fsc[getFasciaIndex(a.data.getHours())] = (fsc[getFasciaIndex(a.data.getHours())] || 0) + 1;
                    const ds = a.data.toISOString().split('T')[0];
                    days[ds] = (days[ds] || 0) + 1;
                    if (a.data < minD) minD = a.data;
                    if (a.data > maxD) maxD = a.data;
                });

                const sort = (obj) => Object.entries(obj).sort((a,b) => b[1]-a[1]);
                return {
                    tot: datiFiltrati.length, sp, ytm, ms: Math.floor(ms/60000),
                    artsUnici: Object.keys(arts).length,
                    trksUnici: Object.keys(trks).length,
                    topA: sort(arts).slice(0, 10),
                    topT: sort(trks).slice(0, 10),
                    topAlb: sort(albs).slice(0, 10),
                    dayTop: sort(days)[0],
                    wkd, fsc, minD, maxD
                };
            }, [datiFiltrati]);

            if (ascolti.length === 0) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6" onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault(); processFiles(e.dataTransfer.files)}}>
                        <div className="max-w-xl w-full bg-white/[0.03] backdrop-blur-xl border border-white/10 rounded-[2.5rem] p-12 text-center shadow-2xl">
                            <Logo className="w-20 h-20 mx-auto mb-6 animate-float" />
                            <h1 className="font-display text-4xl font-black mb-4 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">{t.landingTitle}</h1>
                            <p className="text-gray-400 mb-8">{t.landingSubtitle}</p>
                            <label className="block border-2 border-dashed border-white/20 rounded-2xl p-10 hover:border-purple-500/50 transition-all cursor-pointer group">
                                <input type="file" multiple className="hidden" onChange={e=>processFiles(e.target.files)} />
                                <IconUpload className="w-12 h-12 mx-auto text-gray-500 group-hover:text-purple-400 mb-4 transition-colors" />
                                <p className="font-bold">{isProcessing ? t.processing : t.dropTitle}</p>
                                <p className="text-sm text-gray-500">{t.dropSubtitle}</p>
                            </label>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-8">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
                        <div className="flex items-center gap-4">
                            <Logo className="w-12 h-12" />
                            <div>
                                <h1 className="font-display text-3xl font-black text-white">{t.brand}</h1>
                                <p className="text-purple-400 text-sm font-medium">Dashboard Analisi Musicale</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-2 bg-white/5 p-2 rounded-2xl border border-white/10">
                            <div className="flex bg-black/40 rounded-xl p-1">
                                {['all', 'year', 'range'].map(m => (
                                    <button key={m} onClick={()=>setFilterMode(m)} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${filterMode===m ? 'bg-purple-600 text-white' : 'text-gray-400'}`}>{t[`f${m.charAt(0).toUpperCase()+m.slice(1)}`]}</button>
                                ))}
                            </div>
                            {filterMode === 'year' && (
                                <select className="bg-black/40 text-white text-xs font-bold px-3 py-1.5 rounded-xl border border-white/10 outline-none" value={selectedYear} onChange={e=>setSelectedYear(e.target.value)}>
                                    <option value="all">{t.selectYear}</option>
                                    {[...new Set(ascolti.map(a=>a.data.getFullYear()))].sort((a,b)=>b-a).map(y=><option key={y} value={y}>{y}</option>)}
                                </select>
                            )}
                            <button onClick={()=>{setAscolti([]); setFilterMode('all')}} className="px-4 py-1.5 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-bold transition-all">{t.newFiles}</button>
                            <div className="flex bg-black/40 rounded-xl p-1 ml-2">
                                <button onClick={()=>setLang('it')} className={`px-2 py-1 rounded-lg text-[10px] font-bold ${lang==='it'?'bg-white/20':'text-gray-500'}`}>IT</button>
                                <button onClick={()=>setLang('en')} className={`px-2 py-1 rounded-lg text-[10px] font-bold ${lang==='en'?'bg-white/20':'text-gray-500'}`}>EN</button>
                            </div>
                        </div>
                    </header>

                    {stats && (
                        <div className="space-y-8">
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                {[
                                    { lab: t.cardStreams, val: stats.tot.toLocaleString(), sub: `${stats.sp} Sp • ${stats.ytm} YTM`, icon: <IconPlay className="text-pink-500" /> },
                                    { lab: t.cardMinutes, val: stats.ms.toLocaleString(), sub: `~ ${Math.round(stats.ms/60)} ore`, icon: <IconClock className="text-purple-500" /> },
                                    { lab: t.cardArtists, val: stats.artsUnici, sub: 'Artisti diversi', icon: <IconMic className="text-orange-500" /> },
                                    { lab: t.cardTracks, val: stats.trksUnici, sub: 'Brani unici', icon: <IconMusic className="text-blue-500" /> }
                                ].map((c, i) => (
                                    <div key={i} className="bg-white/5 border border-white/10 p-6 rounded-3xl hover:bg-white/[0.07] transition-all">
                                        <div className="flex items-center gap-3 mb-4 opacity-70 uppercase tracking-tighter text-[10px] font-bold">{c.icon} {c.lab}</div>
                                        <div className="font-display text-3xl font-black">{c.val}</div>
                                        <div className="text-xs text-gray-500 mt-1">{c.sub}</div>
                                    </div>
                                ))}
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* ARTISTI */}
                                <div className="bg-white/5 border border-white/10 rounded-[2rem] p-8">
                                    <h2 className="font-display text-xl font-bold mb-6 flex items-center gap-2"><IconMic className="w-5 h-5 text-purple-400" /> {t.topArtists}</h2>
                                    <div className="space-y-4">
                                        {stats.topA.map((a, i) => (
                                            <div key={i} className="flex items-center gap-4 group">
                                                <span className="w-4 text-xs font-black opacity-30">{i+1}</span>
                                                <EntityImage artist={a[0]} type="artist" altText={a[0]} className="w-12 h-12 rounded-full border-2 border-white/10" />
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold truncate text-sm">{a[0]}</div>
                                                    <div className="text-[10px] text-gray-500 uppercase font-bold">{a[1]} {t.listens}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* BRANI */}
                                <div className="bg-white/5 border border-white/10 rounded-[2rem] p-8">
                                    <h2 className="font-display text-xl font-bold mb-6 flex items-center gap-2"><IconMusic className="w-5 h-5 text-pink-400" /> {t.topTracks}</h2>
                                    <div className="space-y-4">
                                        {stats.topT.map((tr, i) => {
                                            const [tit, art] = tr[0].split(' -|- ');
                                            return (
                                                <div key={i} className="flex items-center gap-4">
                                                    <span className="w-4 text-xs font-black opacity-30">{i+1}</span>
                                                    <EntityImage artist={art} title={tit} type="track" altText={tit} className="w-12 h-12 rounded-xl border border-white/10" />
                                                    <div className="flex-1 min-w-0">
                                                        <div className="font-bold truncate text-sm">{tit}</div>
                                                        <div className="text-[10px] text-gray-500 truncate">{art} • {tr[1]} {t.listens}</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* ALBUM */}
                                <div className="bg-white/5 border border-white/10 rounded-[2rem] p-8">
                                    <h2 className="font-display text-xl font-bold mb-6 flex items-center gap-2"><IconDisc className="w-5 h-5 text-blue-400" /> {t.topAlbums}</h2>
                                    <div className="space-y-4">
                                        {stats.topAlb.map((al, i) => {
                                            const [tit, art] = al[0].split(' -|- ');
                                            return (
                                                <div key={i} className="flex items-center gap-4">
                                                    <span className="w-4 text-xs font-black opacity-30">{i+1}</span>
                                                    <EntityImage artist={art} title={tit} type="album" altText={tit} className="w-12 h-12 rounded-xl border border-white/10" />
                                                    <div className="flex-1 min-w-0">
                                                        <div className="font-bold truncate text-sm">{tit}</div>
                                                        <div className="text-[10px] text-gray-500 truncate">{art} • {al[1]} {t.listens}</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gradient-to-br from-purple-900/20 to-indigo-900/20 border border-white/10 rounded-[2.5rem] p-8 md:p-12">
                                <h2 className="font-display text-2xl font-black mb-10 flex items-center gap-3"><IconCalendar className="text-purple-400" /> {t.clockTitle}</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-12">
                                    <div>
                                        <p className="text-[10px] font-black uppercase text-gray-500 mb-2">{t.mostActiveDay}</p>
                                        <p className="text-xl font-bold">{stats.dayTop ? stats.dayTop[0] : t.na}</p>
                                        <p className="text-sm text-purple-400">{stats.dayTop ? `${stats.dayTop[1]} ascolti` : ''}</p>
                                    </div>
                                    <div>
                                        <p className="text-[10px] font-black uppercase text-gray-500 mb-2">{t.weekday}</p>
                                        <p className="text-xl font-bold">{t.days[Object.entries(stats.wkd).sort((a,b)=>b[1]-a[1])[0][0]]}</p>
                                        <p className="text-sm text-purple-400">Il tuo giorno preferito</p>
                                    </div>
                                    <div>
                                        <p className="text-[10px] font-black uppercase text-gray-500 mb-2">{t.timeSlot}</p>
                                        <p className="text-xl font-bold">{t.slots[Object.entries(stats.fsc).sort((a,b)=>b[1]-a[1])[0][0]]}</p>
                                        <p className="text-sm text-purple-400">Picco di attività</p>
                                    </div>
                                    <div>
                                        <p className="text-[10px] font-black uppercase text-gray-500 mb-2">Periodo</p>
                                        <p className="text-xl font-bold">{stats.minD.getFullYear()} - {stats.maxD.getFullYear()}</p>
                                        <p className="text-sm text-purple-400">Analisi completa</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
