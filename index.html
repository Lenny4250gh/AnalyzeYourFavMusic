                        )}
                    </div>
                </div>
            );

            if (ascolti.length === 0) {
                return (

                    <React.Fragment>
                        <div className="min-h-screen text-white flex flex-col items-center justify-center p-6 relative" onDragOver={(e) => e.preventDefault()} onDrop={handleDrop}>
                            <div className="absolute top-6 right-6 flex items-center gap-3">
                                <button onClick={() => setShowGuide(true)} className="flex items-center gap-1.5 px-3 py-1.5 bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/40 rounded-lg text-xs font-semibold text-purple-200 transition-all">
                                    <IconHelp className="w-4 h-4" /> <span className="hidden sm:inline">{t.guideBtn}</span>
                                </button>
                                <LangSwitch />
                            </div>

                            <div className="max-w-2xl w-full bg-white/[0.06] backdrop-blur-xl border border-white/10 rounded-[2rem] p-8 sm:p-10 text-center shadow-2xl shadow-purple-950/40 mt-14 sm:mt-0">
                                <div className="flex justify-center mb-6">
                                    <div className="relative animate-float">
                                        <div className="absolute inset-0 bg-purple-500/30 blur-2xl rounded-full"></div>
                                        <Logo className="w-16 h-16 sm:w-20 sm:h-20 relative" />
                                    </div>
                                </div>
                                <p className="uppercase tracking-[0.3em] text-[0.65rem] sm:text-xs font-bold text-purple-300/80 mb-3">{t.brand}</p>
                                
                                <h1 className="font-display text-3xl min-[375px]:text-4xl md:text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-purple-300 via-pink-400 to-orange-300 tracking-tight">
                                    {t.landingTitle}
                                </h1>
                                <p className="text-gray-300 text-base sm:text-lg mb-8 leading-relaxed">
                                    {t.landingSubtitle}
                                </p>

                                <div className="border-2 border-dashed border-white/20 rounded-2xl p-8 sm:p-10 bg-white/[0.03] hover:bg-white/[0.07] hover:border-purple-400/40 transition-all cursor-pointer relative group">
                                    <input type="file" multiple accept=".json,.csv,.zip" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onChange={handleFileInput} />
                                    {isProcessing ? (
                                        <div className="flex flex-col items-center animate-pop-in">
                                            <div className="relative flex items-center justify-center mb-5">
                                                <div className="loader-ring"></div>
                                                <div className="absolute inset-0 flex items-center justify-center">
                                                    <div className="music-loader">
                                                        <span></span><span></span><span></span><span></span><span></span>
                                                    </div>
                                                </div>
                                            </div>
                                            <p className="font-semibold">
                                                {t.processing}<span className="loader-dot">.</span><span className="loader-dot">.</span><span className="loader-dot">.</span>
                                            </p>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center">
                                            <div className="flex items-center gap-2 mb-4 text-gray-400 group-hover:text-purple-400 transition-colors">
                                                <IconUpload className="w-8 h-8 sm:w-10 sm:h-10" />
                                                <IconZip className="w-8 h-8 sm:w-10 sm:h-10" />
                                            </div>
                                            <p className="font-semibold text-base sm:text-lg mb-2">{t.dropTitle}</p>
                                            <p className="text-xs sm:text-sm text-gray-400">{t.dropSubtitle}</p>
                                        </div>
                                    )}
                                </div>

                                {error && (
                                    <div className="mt-6 flex items-center justify-center gap-2 text-red-400 bg-red-400/10 p-3 rounded-lg text-sm">
                                        <IconAlert className="w-5 h-5 flex-shrink-0" />
                                        <p>{error}</p>
                                    </div>
                                )}
                            </div>

                            <p className="mt-8 text-center text-xs text-gray-500">WrapYourFavMusic.github.io <span className="opacity-75">v1.2.5</span></p>

                            {showGuide && (
                                <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fadein" onClick={() => setShowGuide(false)}>
                                    <div className="bg-gray-900 border border-white/10 rounded-3xl p-6 sm:p-8 max-w-lg w-full relative max-h-[85vh] overflow-y-auto animate-fadein" onClick={(e) => e.stopPropagation()}>
                                        <button onClick={() => setShowGuide(false)} className="absolute top-4 sm:top-6 right-4 sm:right-6 text-gray-400 hover:text-white z-10"><IconClose className="w-6 h-6" /></button>
                                        <h3 className="font-display text-2xl sm:text-3xl font-bold text-white flex items-start gap-3 mb-6 pr-8">
                                            <IconHelp className="text-purple-400 flex-shrink-0 w-8 h-8 sm:w-9 sm:h-9 mt-0.5" /> {t.guideTitle}
                                        </h3>
                                        <div className="space-y-4 text-sm text-gray-300 leading-relaxed">
                                            <div className="flex gap-3 p-4 bg-white/5 rounded-xl border border-white/5">
                                                <span className="flex-shrink-0 w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold flex items-center justify-center mt-0.5">1</span>
                                                <div className="space-y-3 flex-1">
                                                    <p className="leading-relaxed font-bold text-white">{t.guideSpotifyStep}</p>
                                                    <a href="https://www.spotify.com/account/privacy/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg transition-colors">
                                                        <IconSpotify className="w-4 h-4" /> {t.openSpotifyPrivacy}
                                                    </a>
                                                </div>
                                            </div>
                                            <div className="flex gap-3 p-4 bg-white/5 rounded-xl border border-white/5">
                                                <span className="flex-shrink-0 w-6 h-6 rounded-full bg-red-500/20 text-red-300 text-xs font-bold flex items-center justify-center mt-0.5">2</span>
                                                <div className="flex-1">
                                                    <p className="leading-relaxed font-bold text-white">{t.guideYTMStep}</p>
                                                    <ul className="space-y-1.5 pl-0.5 mt-3">
                                                        {t.guideYTMSubSteps.map((step, idx) => (
                                                            <li key={idx} className="flex items-start gap-2.5">
                                                                <span className="flex-shrink-0 w-1.5 h-1.5 rounded-full bg-red-400 mt-2"></span>
                                                                <span className="leading-relaxed text-gray-300">{step}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                    <a href="https://takeout.google.com/settings/takeout/custom/youtube" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-xs bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2 rounded-lg transition-colors mt-6">
                                                        <IconYTMusic className="w-4 h-4" /> {t.openGoogleTakeout}
                                                    </a>
                                                </div>
                                            </div>
                                            <div className="flex gap-3 p-4 bg-purple-500/10 rounded-xl border border-purple-500/20">
                                                <span className="flex-shrink-0 w-6 h-6 rounded-full bg-purple-500/20 text-purple-300 text-xs font-bold flex items-center justify-center mt-0.5">3</span>
                                                <p className="text-purple-200 font-bold leading-relaxed flex-1">{t.guideZipNote}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </React.Fragment>
                );
            }

            if (ascolti.length > 0 && !postLoadChoiceMade) {
                return (
                    <React.Fragment>
                        <div className="min-h-screen text-white flex flex-col items-center justify-start sm:justify-center p-6 pt-20 sm:pt-6 relative">
                            <div className="absolute top-6 right-6 flex items-center gap-3">
                                <LangSwitch />
                            </div>

                            <div className="max-w-4xl w-full text-center animate-fadein">
                                <div className="flex justify-center mb-6">
                                    <div className="relative animate-float">
                                        <div className="absolute inset-0 bg-purple-500/30 blur-2xl rounded-full"></div>
                                        <Logo className="w-16 h-16 sm:w-20 sm:h-20 relative" />
                                    </div>
                                </div>
                                <h1 className="font-display text-3xl min-[375px]:text-4xl md:text-5xl font-extrabold mb-3 bg-clip-text text-transparent bg-gradient-to-r from-purple-300 via-pink-400 to-orange-300 tracking-tight">
                                    {t.choiceTitle}
                                </h1>
                                <p className="text-gray-300 text-base sm:text-lg mb-10">
                                    {t.choiceSubtitle}
                                </p>

                                <div className="max-w-md mx-auto mb-10 bg-white/[0.04] p-4 rounded-2xl border border-white/10 text-left">
                                    <PeriodFilterControls />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                                    <button
                                        onClick={() => setPostLoadChoiceMade(true)}
                                        className="group text-left bg-white/[0.03] hover:bg-white/[0.1] backdrop-blur-xl border border-white/10 hover:border-purple-400/40 rounded-3xl p-6 sm:p-8 transition-all active:scale-[0.98]"
                                    >
                                        <div className="w-12 h-12 rounded-2xl bg-purple-500/20 flex items-center justify-center mb-4 group-hover:bg-purple-500/30 transition-colors">
                                            <IconDisc className="w-6 h-6 text-purple-300" />
                                        </div>
                                        <p className="font-display font-bold text-lg sm:text-xl text-white mb-1">{t.choiceViewData}</p>
                                        <p className="text-gray-400 text-sm">{t.choiceViewDataSub}</p>
                                    </button>

                                    <button
                                        onClick={() => { setPostLoadChoiceMade(true); openWrapped(); }}
                                        className="group text-left bg-white/[0.03] hover:bg-white/[0.1] backdrop-blur-xl border border-white/10 hover:border-fuchsia-400/40 rounded-3xl p-6 sm:p-8 transition-all active:scale-[0.98]"
                                    >
                                        <div className="w-12 h-12 rounded-2xl bg-fuchsia-500/20 flex items-center justify-center mb-4 group-hover:bg-fuchsia-500/30 transition-colors">
                                            <IconMusic className="w-6 h-6 text-fuchsia-300" />
                                        </div>
                                        <p className="font-display font-bold text-lg sm:text-xl text-white mb-1">{t.choiceWrapped}</p>
                                        <p className="text-gray-400 text-sm">{t.choiceWrappedSub}</p>
                                    </button>

                                    <button
                                        onClick={() => { setPostLoadChoiceMade(true); openQuiz(); }}
                                        className="group text-left bg-white/[0.03] hover:bg-white/[0.1] backdrop-blur-xl border border-white/10 hover:border-pink-400/40 rounded-3xl p-6 sm:p-8 transition-all active:scale-[0.98]"
                                    >
                                        <div className="w-12 h-12 rounded-2xl bg-pink-500/20 flex items-center justify-center mb-4 group-hover:bg-pink-500/30 transition-colors">
                                            <IconTrophy className="w-6 h-6 text-pink-300" />
                                        </div>
                                        <p className="font-display font-bold text-lg sm:text-xl text-white mb-1">{t.choiceStartQuiz}</p>
                                        <p className="text-gray-400 text-sm">{t.choiceStartQuizSub}</p>
                                    </button>
                                </div>
                            </div>

                            <p className="mt-10 text-center text-xs text-gray-500">WrapYourFavMusic.github.io <span className="opacity-75">v1.2.5</span></p>
                        </div>
                    </React.Fragment>
                );
            }

            return (
                <React.Fragment>
                    <div className="min-h-screen px-4 sm:px-6 md:px-8 py-6 font-sans selection:bg-purple-500/30 pb-20 animate-fadein">
                        <div className="max-w-7xl mx-auto space-y-8">

                                                                    <span className="text-gray-500 font-bold w-4 text-center flex-shrink-0 text-sm">{index + 1}</span>

                                                <p className="text-indigo-300 text-xs sm:text-sm mt-1">{stats.date.giornoTop ? t.nListens(stats.date.giornoTop.count) : ''}</p>

                                <div
                                    key={wrappedIndex}
                                    className={`wrapped-slide-content story-ambient absolute inset-0 flex flex-col items-center justify-center text-center p-8 sm:p-10 bg-gradient-to-br ${wrappedSlides[wrappedIndex].gradient} ${wrappedDirection >= 0 ? 'animate-story-fwd' : 'animate-story-back'} overflow-hidden`}
                                >
                                    {wrappedSlides[wrappedIndex].content}
                                </div>
                            </div>
                        </div>
                        );
                    })()}

                    {/* Modal del Quiz OTTIMIZZATO PER FPS */}
                    {showQuiz && (
                        // Sfondo scuro solido e immediato (nessun fade sull'opacità, niente blur costoso) così i dati sottostanti non sono mai visibili
                        <div className="fixed inset-0 bg-[#0b0b0f] flex items-center justify-center p-4 z-[9999]" onClick={closeQuiz}>
                            {/* 2. Rimosse le ombre pesanti, usato background semplice e transform-gpu per accelerazione hardware */}
                            <div className="bg-gray-900 border border-white/10 rounded-[2rem] p-6 sm:p-10 max-w-3xl w-full relative max-h-[90vh] overflow-y-auto animate-fadein transform-gpu" onClick={(e) => e.stopPropagation()}>
                                <button onClick={closeQuiz} className="absolute top-4 sm:top-6 right-4 sm:right-6 text-gray-400 hover:text-white z-10 bg-black/40 p-2 rounded-full transition-colors">
                                    <IconClose className="w-6 h-6" />
                                </button>

                                {quizPhase === 'intro' && (
                                    <div className="text-center pt-4">
                                        <div className="flex justify-center mb-8">
                                            <div className="w-24 h-24 rounded-full bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center shadow-lg">
                                                <IconTrophy className="w-12 h-12 text-white" />
                                            </div>
                                        </div>
                                        <h3 className="font-display text-3xl sm:text-5xl font-black text-white mb-4">{t.quizTitle}</h3>
                                        <p className="text-gray-400 text-base sm:text-lg leading-relaxed mb-2 max-w-lg mx-auto">{t.quizIntro}</p>
                                        <p className="text-purple-300 text-xs sm:text-sm mb-8">
                                            {filterMode === 'all' && t.showingAll}
                                            {filterMode === 'year' && (selectedYear === 'all' ? t.pickYear : t.showingYear(selectedYear))}
                                            {filterMode === 'range' && (dateFrom || dateTo) && t.showingRange(
                                                dateFrom ? new Date(dateFrom + 'T00:00:00').toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US') : t.rangeStart,
                                                dateTo ? new Date(dateTo + 'T23:59:59').toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-US') : t.rangeToday
                                            )}
                                            {filterMode === 'range' && !dateFrom && !dateTo && t.pickRange}
                                        </p>

                                        <button onClick={startQuiz} className="w-full sm:w-auto px-10 py-4 bg-white text-black active:scale-95 rounded-full font-bold text-lg transition-transform transform-gpu">
                                            {t.quizStart}
                                        </button>
                                    </div>
                                )}

                                {quizPhase === 'no_data' && (
                                    <div className="text-center pt-2">
                                        <div className="flex justify-center mb-5">
                                            <div className="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                                                <IconAlert className="w-8 h-8" />
                                            </div>
                                        </div>
                                        <h3 className="font-display text-xl sm:text-2xl font-bold text-white mb-2">Dati Insufficienti</h3>
                                        <p className="text-gray-400 text-sm mb-6">{t.quizNotEnoughData}</p>
                                        <button onClick={closeQuiz} className="w-full py-3 bg-white/10 hover:bg-white/20 rounded-xl font-semibold text-white transition-colors">
                                            {t.quizClose}
                                        </button>
                                    </div>
                                )}

                                {quizPhase === 'playing' && quizQuestions[quizIndex] && (
                                    <div className="pt-2 flex flex-col h-full">
                                        <div className="flex items-center justify-between mb-6 gap-3">
                                            <span className="text-sm font-bold text-purple-400 uppercase tracking-widest">{t.quizQuestionOf(quizIndex + 1, quizQuestions.length)}</span>
                                            <span className="text-sm font-bold text-white bg-white/10 px-4 py-1.5 rounded-full">{t.quizScoreLabel}: {quizScore}</span>
                                        </div>
                                        
                                        <div className="w-full h-2 bg-white/10 rounded-full mb-8 overflow-hidden transform-gpu">
                                            <div className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-300" style={{ width: `${((quizIndex + (answered ? 1 : 0)) / quizQuestions.length) * 100}%` }}></div>
                                        </div>

                                        <h3 className="font-display text-2xl sm:text-3xl font-black text-white mb-8 leading-tight">{quizQuestions[quizIndex].question}</h3>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                            {quizQuestions[quizIndex].options.map((option, idx) => {
                                                const current = quizQuestions[quizIndex];
                                                const isEntity = ['artist', 'track', 'album', 'compare'].includes(current.id);
                                                
                                                // Estrazione Titolo e Artista
                                                let displayTitle = option;
                                                let queryArtist = null;
                                                let queryTitle = option;

                                                if (current.id === 'track' || current.id === 'album') {
                                                    const parts = String(option).split(' -|- ');
                                                    displayTitle = parts[0];
                                                    queryTitle = parts[0];
                                                    if (parts.length > 1) queryArtist = parts[1];
                                                } else if (current.id === 'artist' || current.id === 'compare') {
                                                    queryArtist = option;
                                                }
                                                
                                                let cls = 'bg-white/5 border-transparent hover:bg-white/10 text-white';
                                                if (answered) {
                                                    if (option === current.correct) {
                                                        cls = 'bg-emerald-600/20 border-emerald-500 text-white';
                                                    } else if (option === selectedOption) {
                                                        cls = 'bg-red-600/20 border-red-500 opacity-70 text-white';
                                                    } else {
                                                        cls = 'bg-black/20 border-transparent text-gray-500 opacity-50';
                                                    }
                                                }

                                                return (
                                                    <button 
                                                        key={idx} 
                                                        onClick={() => answerQuiz(option)} 
                                                        disabled={answered} 
                                                        // 3. Sostituito hover:scale con active:scale per evitare lag al passaggio del mouse, reso hardware accelerated
                                                        className={`relative w-full flex items-center p-4 rounded-2xl border-2 transition-all duration-200 transform-gpu active:scale-[0.98] text-left overflow-hidden ${cls} ${isEntity ? 'h-24 sm:h-28' : 'h-16 sm:h-20'}`}
                                                    >
                                                        {isEntity && (
                                                            <QuizImageWrapper 
                                                                artist={queryArtist} 
                                                                title={queryTitle} 
                                                                type={current.id === 'artist' || current.id === 'compare' ? 'artist' : current.id} 
                                                                altText={displayTitle}
                                                                isArtistRound={current.id === 'artist' || current.id === 'compare'}
                                                            />
                                                        )}
                                                        <span className={`font-bold leading-tight z-20 flex flex-col justify-center ${isEntity ? 'text-lg sm:text-xl' : 'text-base sm:text-lg'}`}>
                                                            <span className="line-clamp-2">{displayTitle}</span>
                                                            {queryArtist && (current.id === 'track' || current.id === 'album') && (
                                                                <span className="text-xs sm:text-sm text-gray-400 font-normal mt-0.5 truncate">{queryArtist}</span>
                                                            )}
                                                        </span>
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        <div className="mt-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                                            <div className="flex-1">
                                                {answered && (
                                                    <div className="animate-fadein">
                                                        {selectedOption === quizQuestions[quizIndex].correct ? (
                                                            <p className="text-emerald-400 font-bold text-lg flex items-center gap-2"><IconCheck className="w-6 h-6" /> {t.quizCorrect}</p>
                                                        ) : (
                                                            <p className="text-red-400 font-bold text-base sm:text-lg flex items-center gap-2"><IconX className="w-6 h-6 flex-shrink-0" /> {t.quizWrong} — {t.quizCorrectWas(String(quizQuestions[quizIndex].correct).split(' -|- ')[0])}</p>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                            
                                            <div className="flex items-center gap-3 w-full sm:w-auto">
                                                <button 
                                                    onClick={prevQuizQuestion} 
                                                    disabled={quizIndex === 0} 
                                                    className={`px-6 py-4 rounded-full font-bold transition-transform transform-gpu duration-200 ${quizIndex === 0 ? 'bg-white/10 text-white/30 cursor-not-allowed' : 'bg-white/10 hover:bg-white/20 text-white active:scale-95'}`}
                                                >
                                                    {t.quizPrev}
                                                </button>
                                                <button 
                                                    onClick={nextQuizQuestion} 
                                                    disabled={!answered} 
                                                    className={`flex-1 sm:flex-none px-8 py-4 rounded-full font-bold text-black transition-transform transform-gpu duration-200 ${answered ? 'bg-white active:scale-95' : 'bg-white/10 text-white/30 cursor-not-allowed'}`}
                                                >
                                                    {quizIndex + 1 < quizQuestions.length ? t.quizNext : t.quizSeeResult}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {quizPhase === 'finished' && (
                                    <div className="text-center pt-4">
                                        <div className="flex justify-center mb-8">
                                            <div className="w-24 h-24 rounded-full bg-gradient-to-br from-emerald-500 to-teal-500 flex items-center justify-center shadow-lg">
                                                <IconTrophy className="w-12 h-12 text-white" />
                                            </div>
                                        </div>
                                        <h3 className="font-display text-3xl sm:text-4xl font-black text-white mb-2">{t.quizFinishTitle}</h3>
                                        <p className="font-display text-6xl sm:text-7xl font-black text-emerald-400 my-6">
                                            {quizScore} <span className="text-3xl text-gray-600">/ {quizQuestions.length}</span>
                                        </p>
                                        <p className="text-gray-400 text-lg mb-4">{t.quizFinishSubtitle(quizScore, quizQuestions.length)}</p>
                                        <p className="text-xl font-bold text-purple-400 mb-10">
                                            {quizQuestions.length > 0 && (quizScore / quizQuestions.length) >= 0.8 ? t.quizFinishGreat : (quizQuestions.length > 0 && (quizScore / quizQuestions.length) >= 0.5 ? t.quizFinishGood : t.quizFinishMeh)}
                                        </p>
                                        <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                            <button onClick={startQuiz} className="px-8 py-4 bg-white text-black active:scale-95 rounded-full font-bold text-lg transition-transform transform-gpu">{t.quizPlayAgain}</button>
                                            <button onClick={closeQuiz} className="px-8 py-4 bg-white/10 hover:bg-white/20 rounded-full font-bold text-white transition-colors">{t.quizClose}</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
