<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WrapYourFavMusic</title>
    <meta name="description" content="Analyze your Spotify and YouTube Music listening history — completely offline, in your browser.">
    <meta name="theme-color" content="#0f0f13">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23a855f7'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230f0f13'/%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%230f0f13'/%3E%3Ccircle cx='32' cy='32' r='2.5' fill='url(%23g)'/%3E%3C/svg%3E">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- JSZip per leggere i file .zip direttamente nel browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- html2canvas per esportare la card finale del Wrapped come immagine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html {
            scroll-behavior: smooth;
        }
        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: #f3f4f6;
            font-family: 'Inter', system-ui, sans-serif;
            background-image:
                radial-gradient(ellipse 80% 50% at 15% -10%, rgba(168, 85, 247, 0.25), transparent),
                radial-gradient(ellipse 60% 40% at 90% 10%, rgba(236, 72, 153, 0.18), transparent),
                radial-gradient(ellipse 60% 40% at 50% 100%, rgba(99, 102, 241, 0.15), transparent);
            background-repeat: no-repeat;
            /* Rimosso background-attachment: fixed: forzava un repaint costoso del gradiente ad ogni frame di scroll, specialmente insieme ai blur */
        }
        button, a, input, select, .transition-colors, .transition-all {
            transition-duration: 250ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        button, a {
            transition-property: background-color, border-color, color, opacity, transform, box-shadow;
        }
        button:active {
            transform: scale(0.97);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadein {
            animation: fadeInUp 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
            will-change: opacity, transform;
        }
        @keyframes fadeInBg {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fadebg {
            animation: fadeInBg 0.25s ease-out both;
            will-change: opacity;
        }

        @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 25px rgba(255, 255, 255, 0.2); }
        50% { box-shadow: 0 0 45px rgba(255, 255, 255, 0.45); }
        }

        @keyframes popIn {
        0% { opacity: 0; transform: scale(0.85) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .animate-pop-in {
        animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: opacity, transform;
        }

        .animate-glow {
        animation: pulseGlow 3s infinite ease-in-out;
        }

        /* ============================================================
           ANIMAZIONI STORIE DEL WRAPPED — ingresso direzionale + stagger
           ============================================================ */

        /* Ingresso della slide: scorre da destra quando si va avanti, da sinistra quando si torna indietro */
        @keyframes storySlideInFwd {
            0% { opacity: 0; transform: translateX(28px) scale(0.96); filter: blur(6px); }
            60% { filter: blur(0); }
            100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
        }
        @keyframes storySlideInBack {
            0% { opacity: 0; transform: translateX(-28px) scale(0.96); filter: blur(6px); }
            60% { filter: blur(0); }
            100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
        }
        .animate-story-fwd {
            animation: storySlideInFwd 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: opacity, transform, filter;
        }
        .animate-story-back {
            animation: storySlideInBack 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: opacity, transform, filter;
        }
        /* Uscita della slide precedente: dissolvenza morbida (invece di sparire di colpo),
           usata per l'istantanea "wrapped-slide-outgoing" mentre la storia nuova entra sopra. */
        @keyframes storySlideOutFade {
            0% { opacity: 1; filter: blur(0); }
            100% { opacity: 0; filter: blur(3px); }
        }
        .animate-story-fadeout {
            animation: storySlideOutFade 0.4s ease-out both;
            will-change: opacity, filter;
        }
        /* Stessa correzione di stacking della slide corrente: il layer decorativo resta dietro
           al contenuto anche nell'istantanea in dissolvenza. */
        .wrapped-slide-outgoing > .wrapped-bgfx-layer {
            z-index: 0;
        }
        .wrapped-slide-outgoing > div:not(.wrapped-bgfx-layer) {
            position: relative;
            z-index: 1;
        }
        /* Evita che gli elementi della storia uscente (numeri, icone...) rigiochino la loro
           animazione di ingresso mentre l'intera slide sta sfumando via. */
        .wrapped-slide-outgoing > div:not(.wrapped-bgfx-layer) > * {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }

        /* Ingresso "a cascata" del ritratto tondo dell'artista: rimbalza leggermente in scala,
           così l'occhio viene guidato verso il centro appena la sotto-storia cambia */
        @keyframes artistRingPop {
            0% { opacity: 0; transform: scale(0.8); }
            70% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-artist-ring-pop {
            animation: artistRingPop 0.5s 0.05s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        /* Il nome entra con un leggero ritardo rispetto al ritratto, per un effetto "a cascata".
           Essendo la card rimontata per intero ad ogni cambio artista (mai due nomi in sovrapposizione),
           questo ritardo è puramente estetico e non crea mai testo doppio/illeggibile */
        .animate-artist-name-in {
            animation: fadeInUp 0.4s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        /* Breve lampo di luce sull'anello quando cambia artista, per marcare il cambio sotto-storia */
        @keyframes artistRingFlash {
            0% { box-shadow: 0 0 0 rgba(255,255,255,0); }
            35% { box-shadow: 0 0 40px rgba(255,255,255,0.55); }
            100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
        }
        .animate-artist-ring-flash {
            animation: artistRingFlash 0.7s ease-out both;
        }

        /* Sfere ambientali che fluttuano lentamente dietro al contenuto di ogni storia, per dare profondità */
        .story-ambient::before,
        .story-ambient::after {
            content: '';
            position: absolute;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 70%);
            mix-blend-mode: overlay;
            opacity: 0.35;
            pointer-events: none;
            filter: blur(2px);
            z-index: 0;
        }
        .story-ambient::before {
            width: 220px; height: 220px;
            top: -60px; left: -50px;
            animation: ambientFloat1 9s ease-in-out infinite;
        }
        .story-ambient::after {
            width: 260px; height: 260px;
            bottom: -80px; right: -60px;
            animation: ambientFloat2 11s ease-in-out infinite;
        }
        @keyframes ambientFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 25px) scale(1.15); }
        }
        @keyframes ambientFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-25px, -20px) scale(1.1); }
        }

        /* Rivelazione a cascata degli elementi dentro ogni storia (icona, numero, titolo, sottotitolo...) */
        .wrapped-slide-content > div > * {
            opacity: 0;
            animation: storyItemIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative;
            z-index: 1;
        }
        .wrapped-slide-content > div > *:nth-child(1) { animation-delay: 0.08s; }
        .wrapped-slide-content > div > *:nth-child(2) { animation-delay: 0.18s; }
        .wrapped-slide-content > div > *:nth-child(3) { animation-delay: 0.28s; }
        .wrapped-slide-content > div > *:nth-child(4) { animation-delay: 0.38s; }
        .wrapped-slide-content > div > *:nth-child(5) { animation-delay: 0.48s; }
        .wrapped-slide-content > div > *:nth-child(6) { animation-delay: 0.58s; }
        .wrapped-slide-content > div > *:nth-child(7) { animation-delay: 0.68s; }
        /* Righe delle classifiche (top brani/artisti/album/generi): cascata più fitta */
        .wrapped-slide-content > div > div > * {
            opacity: 0;
            animation: storyItemIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .wrapped-slide-content > div > div > *:nth-child(1) { animation-delay: 0.32s; }
        .wrapped-slide-content > div > div > *:nth-child(2) { animation-delay: 0.40s; }
        .wrapped-slide-content > div > div > *:nth-child(3) { animation-delay: 0.48s; }
        .wrapped-slide-content > div > div > *:nth-child(4) { animation-delay: 0.56s; }
        .wrapped-slide-content > div > div > *:nth-child(5) { animation-delay: 0.64s; }
        @keyframes storyItemIn {
            0% { opacity: 0; transform: translateY(16px) scale(0.94); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* Le storie "custom" (artista/mese in evidenza, top 5 casuale) gestiscono già le proprie animazioni:
           disattiviamo la cascata generica per non sovrapporle effetti in conflitto */
        .wrapped-slide-content:has(.story-custom-root) > div > *,
        .wrapped-slide-content:has(.story-custom-root) > div > div > * {
            opacity: 1;
            animation: none;
        }

        /* Numeri "hero" del wrapped: pop elastico con un lampo di luce */
        @keyframes numberPop {
            0% { opacity: 0; transform: scale(0.5) translateY(10px); text-shadow: 0 0 0 rgba(255,255,255,0); }
            55% { opacity: 1; transform: scale(1.12) translateY(0); text-shadow: 0 0 30px rgba(255,255,255,0.8); }
            80% { transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); text-shadow: 0 0 0 rgba(255,255,255,0); }
        }
        .animate-number-pop {
            animation: numberPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            animation-delay: 0.15s !important;
        }

        /* Icone delle storie: piccolo rimbalzo all'ingresso */
        @keyframes iconBounceIn {
            0% { opacity: 0; transform: scale(0.4) rotate(-12deg); }
            60% { opacity: 1; transform: scale(1.15) rotate(4deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .wrapped-slide-content > div > svg:first-child {
            animation-name: iconBounceIn !important;
        }

        /* Barra di progressione delle storie: riempimento morbido + bagliore sul segmento attivo */
        .story-progress-fill {
            transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        .story-progress-active {
            box-shadow: 0 0 10px 1px rgba(255,255,255,0.9);
        }

        /* ============================================================
           LOADER DI CARICAMENTO — equalizzatore musicale animato
           ============================================================ */
        .music-loader {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            height: 44px;
        }
        .music-loader span {
            display: block;
            width: 6px;
            border-radius: 4px;
            background: linear-gradient(180deg, #f0abfc, #a855f7 55%, #6366f1);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.55);
            animation: musicBar 1.1s ease-in-out infinite;
        }
        .music-loader span:nth-child(1) { height: 30%; animation-delay: -1.0s; }
        .music-loader span:nth-child(2) { height: 60%; animation-delay: -0.8s; }
        .music-loader span:nth-child(3) { height: 100%; animation-delay: -0.6s; }
        .music-loader span:nth-child(4) { height: 45%; animation-delay: -0.4s; }
        .music-loader span:nth-child(5) { height: 75%; animation-delay: -0.2s; }
        @keyframes musicBar {
            0%, 100% { transform: scaleY(0.35); opacity: 0.65; }
            50% { transform: scaleY(1); opacity: 1; }
        }
        @keyframes loaderRingSpin {
            to { transform: rotate(360deg); }
        }
        .loader-ring {
            width: 88px; height: 88px;
            border-radius: 9999px;
            border: 3px solid rgba(168, 85, 247, 0.18);
            border-top-color: #d946ef;
            border-right-color: #a855f7;
            animation: loaderRingSpin 1.1s linear infinite;
            position: relative;
        }
        @keyframes loaderDotFade {
            0%, 100% { opacity: 0.25; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }
        .loader-dot { animation: loaderDotFade 1.2s ease-in-out infinite; display: inline-block; }
        .loader-dot:nth-child(2) { animation-delay: 0.15s; }
        .loader-dot:nth-child(3) { animation-delay: 0.3s; }

        /* Transizione fluida per la barra di progressione della corsa: cresce in modo lineare per 1.75s,
           la stessa durata del timer della sottostoria, così arriva al valore del mese successivo
           esattamente nel momento in cui la storia avanza da sola */
        .race-bar-transition {
        transition: width 1.75s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
        overflow: hidden;
        will-change: width;
        }

        /* Riflesso che scorre in loop sulla barra, per dare la sensazione di caricamento continuo nel tempo */
        .race-bar-transition::after {
        content: '';
        position: absolute;
        top: 0;
        left: -60%;
        width: 50%;
        height: 100%;
        background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        animation: raceBarShimmer 2.2s ease-in-out infinite;
        }

        @keyframes raceBarShimmer {
        0% { left: -60%; }
        100% { left: 130%; }
        }

        /* Animazione di pop per i cambi di classifica */
        @keyframes rankPop {
        0% { transform: scale(0.95); opacity: 0.7; }
        50% { transform: scale(1.03); }
        100% { transform: scale(1); opacity: 1; }
        }

        .animate-rank-pop {
        animation: rankPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ============================================================
           MONTHLY TOP RACE — bagliore del leader, badge di scalata,
           medaglie argento/bronzo e scintille attorno alla foto in testa
           ============================================================ */

        /* Pillola luminosa dietro alla riga del leader del mese: respira lentamente in oro */
        @keyframes championRowGlow {
            0%, 100% { box-shadow: 0 0 0 1px rgba(250,204,21,0.0), 0 8px 30px rgba(250,204,21,0.0); background-color: rgba(250,204,21,0.0); }
            50% { box-shadow: 0 0 0 1px rgba(250,204,21,0.35), 0 8px 30px rgba(250,204,21,0.22); background-color: rgba(250,204,21,0.07); }
        }
        .race-row-champion {
            border-radius: 20px;
            animation: championRowGlow 2.6s ease-in-out infinite;
        }

        /* Anello dorato pulsante dietro la foto del primo classificato, oltre al bordo statico */
        @keyframes championRingPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(250,204,21,0.55); }
            50% { box-shadow: 0 0 0 6px rgba(250,204,21,0); }
        }
        .race-avatar-champion { animation: championRingPulse 2s ease-out infinite; }

        /* Scintille che luccicano attorno alla foto del leader, sfasate tra loro */
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(25deg); }
        }
        .race-sparkle {
            position: absolute; color: #fde047; pointer-events: none;
            filter: drop-shadow(0 0 4px rgba(250,204,21,0.85));
            animation: sparkleTwinkle 1.8s ease-in-out infinite;
        }

        /* Badge tondo che indica la variazione di posizione rispetto al mese precedente:
           entra con un piccolo "pop" ogni volta che cambia mese */
        @keyframes rankBadgePop {
            0% { opacity: 0; transform: scale(0.4) translateY(3px); }
            60% { opacity: 1; transform: scale(1.15) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .rank-badge {
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 9999px; flex-shrink: 0;
            animation: rankBadgePop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .rank-badge-up { background: rgba(34,197,94,0.22); color: #4ade80; }
        .rank-badge-down { background: rgba(244,63,94,0.22); color: #fb7185; }
        .rank-badge-same { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.55); }
        .rank-badge-new { background: rgba(168,85,247,0.28); color: #d8b4fe; }

        /* Sfondo a medaglia dietro al numero di posizione: oro/argento/bronzo per i primi tre */
        .rank-medal-1 { background: linear-gradient(145deg, #fde68a, #f59e0b); color: #422006 !important; }
        .rank-medal-2 { background: linear-gradient(145deg, #e5e7eb, #9ca3af); color: #1f2937 !important; }
        .rank-medal-3 { background: linear-gradient(145deg, #fdba74, #b45309); color: #2b1503 !important; }

        /* Piccolo "sobbalzo" quando una riga cambia posizione rispetto al mese precedente */
        @keyframes raceRowShift {
            0% { transform: scale(1); }
            35% { transform: scale(1.035); }
            100% { transform: scale(1); }
        }
        .animate-race-row-shift { animation: raceRowShift 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .font-display { font-family: 'Outfit', 'Inter', system-ui, sans-serif; }
        /* Font usato SOLO dentro le storie del Wrapped: molto vicino allo stile bold/arrotondato
           tipografico usato da Spotify nel proprio Wrapped (numeri enormi, tracking stretto). */
        .font-wrapped { font-family: 'Unbounded', 'Outfit', 'Inter', system-ui, sans-serif; letter-spacing: -0.02em; }
        .animate-spin-slow { animation: spin 2.2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Anello arcobaleno rotante dietro le foto della storia "top del mese" */
        .animate-spin-slower { animation: spin 5s linear infinite; }

        /* Riempimento reale della barra di progresso della storia, sincronizzato col timer di 2.5s */
        @keyframes storyFill { from { width: 0%; } to { width: 100%; } }
        .animate-story-fill { width: 0%; animation: storyFill 1.75s linear forwards; }

        /* Ingresso della card artista: leggera rotazione, sfocatura e rimbalzo per un effetto più "vivo" */
        @keyframes storyCardIn {
            0% { opacity: 0; transform: scale(0.82) rotate(-4deg) translateY(16px); filter: blur(6px); }
            55% { opacity: 1; transform: scale(1.04) rotate(1.5deg) translateY(-3px); filter: blur(0); }
            80% { transform: scale(0.99) rotate(-0.5deg) translateY(0); }
            100% { transform: scale(1) rotate(0deg) translateY(0); }
        }
        .animate-story-card { animation: storyCardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

        /* Il badge del mese "salta fuori" con un piccolo ritardo rispetto alla card */
        @keyframes badgePop {
            0% { opacity: 0; transform: translateY(6px) scale(0.6); }
            60% { opacity: 1; transform: translateY(-2px) scale(1.08); }
            100% { transform: translateY(0) scale(1); }
        }
        .animate-badge-pop { animation: badgePop 0.45s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

        /* ============================================================
           WRAPPED — SFONDI VIVI stile Spotify Wrapped
           Un layer di effetti dietro ogni storia: mesh di luce che si
           muove di continuo, un raggio di luce che spazza in diagonale,
           e 4 "varianti" decorative (orbs / particelle / anelli / onde)
           che ruotano storia dopo storia, così ogni slide sembra diversa.
           Tutto è puramente decorativo (aria-hidden, pointer-events:none)
           e isolato dalla cascata di ingresso del contenuto reale.
           ============================================================ */

        /* Il layer decorativo (mesh/grana/raggio/deco) non deve seguire la cascata generica di
           ingresso testo (che lo renderebbe position:relative e opacity:0 finché non tocca il turno):
           qui lo forziamo sempre a schermo intero e visibile, lasciando poi ad ognuno la propria
           animazione continua definita più sotto. */
        .wrapped-slide-content > .wrapped-bgfx-layer > * {
            opacity: 1 !important;
            transform: none !important;
            position: absolute !important;
        }
        /* Il layer decorativo è posizionato in absolute ma senza z-index: per le regole di stacking
           CSS un discendente positioned "sale" comunque sopra i fratelli non-positioned, quindi senza
           questa regola i pallini/cerchi/onde finiscono sopra il testo della storia. Diamo quindi uno
           z-index esplicito più basso al layer decorativo e uno più alto al blocco di contenuto reale,
           così il testo resta sempre sopra le forme animate. */
        .wrapped-slide-content > .wrapped-bgfx-layer {
            z-index: 0;
        }
        .wrapped-slide-content > div:not(.wrapped-bgfx-layer) {
            position: relative;
            z-index: 1;
        }

        /* "Liquid glass": i riquadri semi-trasparenti dentro le storie (righe delle classifiche,
           opzioni del mini-quiz, cornici delle immagini) ora hanno lo sfondo sfocato invece che
           lasciar intravedere nitidi i pallini/le forme decorative dietro — più leggibili e con
           un effetto vetro smerigliato invece che semplice trasparenza piatta. */
        .wrapped-slide-content [class*="bg-white/10"],
        .wrapped-slide-outgoing [class*="bg-white/10"] {
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            background-color: rgba(255, 255, 255, 0.14) !important;
            border: 1px solid rgba(255, 255, 255, 0.16);
        }

        /* (Il raggio di luce diagonale "sweep" è stato rimosso su richiesta: non piaceva) */

        /* --- Variante "circles": cerchi pieni e netti (bordo + ombra), che rimbalzano ruotando
           su se stessi, come le sfere rosse che rotolano nel Wrapped di Spotify --- */
        .wrapped-circle {
            position: absolute; border-radius: 9999px;
            background: rgba(255,255,255,0.16);
            border: 2px solid rgba(255,255,255,0.55);
            box-shadow: 0 10px 30px rgba(0,0,0,0.18);
            opacity: 1 !important;
        }
        .wrapped-circle-1 { width: 84px; height: 84px; top: 10%; left: -8%; animation: wrappedCircleRollA 6s ease-in-out infinite !important; }
        .wrapped-circle-2 { width: 46px; height: 46px; top: 68%; right: 8%; background: rgba(255,255,255,0.3); border-color: transparent; animation: wrappedCircleRollB 5.2s ease-in-out infinite !important; animation-delay: -1.4s !important; }
        .wrapped-circle-3 { width: 130px; height: 130px; bottom: -10%; right: -12%; animation: wrappedCircleRollC 8s ease-in-out infinite !important; animation-delay: -3s !important; }
        .wrapped-circle-4 { width: 30px; height: 30px; top: 30%; right: 20%; background: rgba(255,255,255,0.3); border-color: transparent; animation: wrappedCircleRollB 4.4s ease-in-out infinite !important; animation-delay: -0.6s !important; }
        .wrapped-circle-5 { width: 58px; height: 58px; bottom: 18%; left: 6%; animation: wrappedCircleRollA 7s ease-in-out infinite !important; animation-delay: -2.4s !important; }
        @keyframes wrappedCircleRollA { 0%, 100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(26px, -34px) rotate(160deg); } }
        @keyframes wrappedCircleRollB { 0%, 100% { transform: translate(0,0) rotate(0deg) scale(1); } 50% { transform: translate(-22px, 20px) rotate(-140deg) scale(1.15); } }
        @keyframes wrappedCircleRollC { 0%, 100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-30px, -22px) rotate(120deg); } }

        /* --- Variante "blob": una forma morbida e organica che ruota e cambia leggermente
           forma nel tempo, come le macchie astratte animate dei visual Spotify. Tenuta molto
           trasparente e spostata verso gli angoli, per non passare mai sopra al testo centrale
           della storia (icona/numero/titolo sono sempre al centro). --- */
        .wrapped-blob {
            position: absolute; top: 22%; left: 8%; width: 240px; height: 240px; margin: -120px 0 0 -120px;
            background: rgba(255,255,255,0.08);
            opacity: 1 !important;
            animation: wrappedBlobMorph 10s ease-in-out infinite !important;
        }
        .wrapped-blob-2 {
            position: absolute; top: 85%; left: 88%; width: 170px; height: 170px; margin: -85px 0 0 -85px;
            background: rgba(255,255,255,0.14);
            opacity: 1 !important;
            animation: wrappedBlobMorphRev 8s ease-in-out infinite !important;
        }
        @keyframes wrappedBlobMorph {
            0%, 100% { border-radius: 42% 58% 65% 35% / 45% 40% 60% 55%; transform: rotate(0deg) scale(1); }
            33% { border-radius: 65% 35% 40% 60% / 55% 65% 35% 45%; transform: rotate(60deg) scale(1.08); }
            66% { border-radius: 35% 65% 55% 45% / 40% 50% 50% 60%; transform: rotate(-45deg) scale(0.96); }
        }
        @keyframes wrappedBlobMorphRev {
            0%, 100% { border-radius: 55% 45% 40% 60% / 50% 55% 45% 50%; transform: rotate(0deg) scale(1); }
            50% { border-radius: 40% 60% 60% 40% / 55% 40% 60% 45%; transform: rotate(-70deg) scale(1.12); }
        }

        /* --- Variante "scura": usata solo sulla storia di riepilogo finale, che ha uno sfondo
           chiarissimo (quasi bianco) — le forme bianche di default sarebbero invisibili sopra,
           quindi qui si passa a forme scure molto leggere, sempre ben visibili ma discrete. --- */
        .wrapped-bgfx-dark .wrapped-circle { border-color: rgba(0,0,0,0.18); background: rgba(0,0,0,0.05); box-shadow: 0 10px 24px rgba(0,0,0,0.06); }
        .wrapped-bgfx-dark .wrapped-circle-2, .wrapped-bgfx-dark .wrapped-circle-4 { background: rgba(0,0,0,0.16); }
        .wrapped-bgfx-dark .wrapped-blob { background: rgba(0,0,0,0.05); }
        .wrapped-bgfx-dark .wrapped-blob-2 { background: rgba(0,0,0,0.09); }
        .wrapped-bgfx-dark .wrapped-particle { background: rgba(0,0,0,0.32); }
        .wrapped-bgfx-dark .wrapped-ring { border-color: rgba(0,0,0,0.16); }
        .wrapped-bgfx-dark .wrapped-wave-bar { background: rgba(0,0,0,0.22); }
        .wrapped-bgfx-dark .wrapped-orb-1, .wrapped-bgfx-dark .wrapped-orb-2, .wrapped-bgfx-dark .wrapped-orb-3, .wrapped-bgfx-dark .wrapped-orb-4 {
            background: radial-gradient(circle, rgba(0,0,0,0.12), transparent 70%);
        }

        /* --- Variante "orbs": sfere di luce più grandi e numerose che fluttuano --- */
        .wrapped-orb {
            position: absolute; border-radius: 9999px; filter: blur(16px);
            opacity: 1 !important;
        }
        .wrapped-orb-1 { width: 170px; height: 170px; top: 6%; left: -18%; background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 70%); animation: wrappedOrbFloatA 7s ease-in-out infinite !important; }
        .wrapped-orb-2 { width: 130px; height: 130px; bottom: 8%; right: -12%; background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%); animation: wrappedOrbFloatB 8.5s ease-in-out infinite !important; animation-delay: -2s !important; }
        .wrapped-orb-3 { width: 95px; height: 95px; top: 48%; right: 12%; background: radial-gradient(circle, rgba(255,255,255,0.32), transparent 70%); animation: wrappedOrbFloatC 6.2s ease-in-out infinite !important; animation-delay: -1s !important; }
        .wrapped-orb-4 { width: 60px; height: 60px; top: 20%; right: 30%; background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%); animation: wrappedOrbFloatC 5.4s ease-in-out infinite !important; animation-delay: -3s !important; }
        @keyframes wrappedOrbFloatA { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px, 30px) scale(1.2); } }
        @keyframes wrappedOrbFloatB { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-38px, -26px) scale(1.18); } }
        @keyframes wrappedOrbFloatC { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(22px, -28px) scale(1.12); } }

        /* --- Variante "particelle": coriandoli pieni e netti che salgono dal basso --- */
        .wrapped-particle {
            position: absolute; bottom: -8%; border-radius: 9999px;
            background: rgba(255,255,255,0.92);
            /* Niente "opacity: 1 !important" qui: una dichiarazione !important vince sempre sulla
               keyframe per quella proprietà, quindi bloccherebbe l'opacità a 1 per tutto il ciclo
               e il pallino non si dissolverebbe mai in cima — al riavvio del loop salterebbe di
               scatto giù in fondo (fuori schermo), sembrando "despawnare" invece di sparire con
               una dissolvenza. Lasciamo che sia la keyframe wrappedParticleRise a controllarla.  */
            animation-name: wrappedParticleRise !important;
            animation-timing-function: ease-in !important;
            animation-iteration-count: infinite !important;
        }
        @keyframes wrappedParticleRise {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 0; }
            6% { opacity: 1; }
            88% { opacity: 0.9; }
            100% { transform: translate(var(--particle-x, 24px), -360px) scale(1) rotate(180deg); opacity: 0; }
        }

        /* --- Variante "anelli": cerchi concentrici che ruotano lentamente in senso opposto,
           E "respirano" con un pulsare di luce/scala (wrapper esterno) indipendente dalla
           rotazione (elemento interno) — le due animazioni vivono su due elementi diversi
           perché entrambe toccano "transform" e non si possono comporre su un solo elemento. --- */
        .wrapped-ring-wrap { position: absolute; top: 50%; left: 50%; border-radius: 9999px; }
        .wrapped-ring-wrap-1 { width: 210px; height: 210px; margin: -105px 0 0 -105px; animation: wrappedRingGlowA 4.5s ease-in-out infinite !important; }
        .wrapped-ring-wrap-2 { width: 300px; height: 300px; margin: -150px 0 0 -150px; animation: wrappedRingGlowB 5.5s ease-in-out infinite !important; animation-delay: -1.5s !important; }
        .wrapped-ring-wrap-3 { width: 390px; height: 390px; margin: -195px 0 0 -195px; animation: wrappedRingGlowA 6.8s ease-in-out infinite !important; animation-delay: -3.2s !important; }
        .wrapped-ring { position: absolute; inset: 0; border-radius: 9999px; border: 1.5px solid rgba(255,255,255,0.32); opacity: 1 !important; }
        .wrapped-ring-1 { animation: wrappedRingSpin 15s linear infinite !important; }
        .wrapped-ring-2 { border-color: rgba(255,255,255,0.2); animation: wrappedRingSpinRev 20s linear infinite !important; }
        .wrapped-ring-3 { border-color: rgba(255,255,255,0.12); border-style: dashed; animation: wrappedRingSpin 28s linear infinite !important; }
        @keyframes wrappedRingSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes wrappedRingSpinRev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        @keyframes wrappedRingGlowA {
            0%, 100% { transform: scale(0.94); opacity: 0.4; filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px rgba(255,255,255,0.5)); }
        }
        @keyframes wrappedRingGlowB {
            0%, 100% { transform: scale(0.96); opacity: 0.35; filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
            50% { transform: scale(1.1); opacity: 0.9; filter: drop-shadow(0 0 20px rgba(255,255,255,0.4)); }
        }

        /* --- Variante "onde": equalizzatore silenzioso che pulsa sullo sfondo, in fondo alla storia --- */
        .wrapped-wave-bar {
            display: inline-block; width: 5px; border-radius: 4px;
            background: rgba(255,255,255,0.5);
            height: 18%;
            opacity: 1 !important;
            animation-name: wrappedWaveBar !important;
            animation-timing-function: ease-in-out !important;
            animation-iteration-count: infinite !important;
        }
        @keyframes wrappedWaveBar { 0%, 100% { height: 14%; } 50% { height: 88%; } }

        /* Varianti di ingresso per gli elementi di ogni storia: cambiano da una storia all'altra
           così l'occhio percepisce sempre un modo diverso in cui "le cose appaiono", non sempre
           lo stesso fade-up. Specificità (2 classi + tipo) maggiore della cascata di base, quindi
           sovrascrive sempre l'animation-name senza toccare i delay già calcolati. */
        @keyframes wrappedItemInDrop {
            0% { opacity: 0; transform: translateY(-34px) scale(0.92); }
            60% { opacity: 1; transform: translateY(6px) scale(1.03); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes wrappedItemInSlide {
            0% { opacity: 0; transform: translateX(-30px) rotate(-2deg); }
            100% { opacity: 1; transform: translateX(0) rotate(0deg); }
        }
        @keyframes wrappedItemInSpin {
            0% { opacity: 0; transform: rotate(-14deg) scale(0.8); }
            65% { opacity: 1; transform: rotate(3deg) scale(1.06); }
            100% { opacity: 1; transform: rotate(0deg) scale(1); }
        }
        @keyframes wrappedItemInZoom {
            0% { opacity: 0; transform: scale(1.35); filter: blur(4px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }
        .wrapped-slide-content.wrapped-variant-b > div > * { animation-name: wrappedItemInDrop; }
        .wrapped-slide-content.wrapped-variant-c > div > * { animation-name: wrappedItemInSlide; }
        .wrapped-slide-content.wrapped-variant-d > div > * { animation-name: wrappedItemInSpin; }
        .wrapped-slide-content.wrapped-variant-e > div > * { animation-name: wrappedItemInZoom; }

        /* Bagliore pulsante extra sui numeri "hero" già animati da .animate-number-pop:
           dopo il pop iniziale, il testo resta con un respiro di luce continuo */
        @keyframes wrappedNumberGlowLoop {
            0%, 100% { text-shadow: 0 0 18px rgba(255,255,255,0.25); }
            50% { text-shadow: 0 0 34px rgba(255,255,255,0.55); }
        }
        /* Galleggiamento leggerissimo (2-3px) aggiunto ai numeri "hero" dopo il pop e il glow:
           parte solo quando l'entrata è conclusa, così non interferisce col rimbalzo iniziale */
        @keyframes wrappedNumberFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .animate-number-pop {
            animation: numberPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both, wrappedNumberGlowLoop 2.4s ease-in-out 0.7s infinite, wrappedNumberFloat 5s ease-in-out 0.7s infinite !important;
            animation-delay: 0.15s, 0.85s, 0.85s !important;
        }

        @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
        .animate-float { animation: floatY 4s ease-in-out infinite; }

        /* ============================================================
           VARIANTI DI GALLEGGIAMENTO PER LE STORIE DEL WRAPPED
           Ampiezze/durate leggermente diverse tra loro così più elementi
           nella stessa slide non si muovono tutti in modo identico e
           sincronizzato (che risulterebbe innaturale/meccanico).
           Applicate solo a elementi fermi (icone, copertine, card),
           MAI durante l'animazione di ingresso della slide.
           ============================================================ */

        /* Icona in cima alla slide (orologio, tag, nota, trofeo...) */
        @keyframes wrappedIconFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(-2deg); }
        }
        .animate-float-icon {
            animation: wrappedIconFloat 3.8s ease-in-out infinite;
            will-change: transform;
        }

        /* Copertina/foto principale (top brano, top artista, top album) */
        @keyframes wrappedCoverFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(1deg); }
        }
        .animate-float-cover {
            animation: wrappedCoverFloat 5.2s ease-in-out infinite;
            will-change: transform;
        }

        /* Card nelle liste Top 5 (generi/brani/album/artisti): stesso movimento,
           ma il delay viene impostato inline in base alla posizione nella lista
           per ottenere un effetto "onda" invece che un dondolio sincronizzato */
        @keyframes wrappedCardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        .animate-float-card {
            animation: wrappedCardFloat 3.4s ease-in-out infinite;
            will-change: transform;
        }

        /* Coroncina animata sulla foto del primo classificato nella corsa: fluttua leggermente e brilla */
        @keyframes crownFloat {
        0%, 100% { transform: translateX(-50%) rotate(-6deg) translateY(0); }
        50% { transform: translateX(-50%) rotate(6deg) translateY(-3px); }
        }
        .animate-crown {
        animation: crownFloat 2.4s ease-in-out infinite;
        filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.85));
        }
        ::selection { background: rgba(168, 85, 247, 0.35); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }
        /* Nasconde la barra di scorrimento (restando comunque scrollabile con dito/rotellina) —
           usata nella lista di risposte della storia-quiz del Wrapped, dove una scrollbar visibile
           rompe l'estetica "a schermo intero" tipica delle storie */
        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* Nel formato Wrapped "Scroll" non si tocca per avanzare: nascondiamo l'hint "tocca per
           iniziare" della storia di copertina (pensato per il formato Storie) e mostriamo al suo
           posto l'hint "scorri per iniziare". */
        .wrapped-scroll-root .wrapped-nav-hint { display: none; }
        .wrapped-scroll-root .wrapped-scroll-hint { display: block !important; }
        /* Rimuove le barre delle storie e delle sotto-storie (Race) solo nel formato Scroll */
        .wrapped-scroll-root .story-progress-container,
        .wrapped-scroll-root .race-progress-bar-container,
        .wrapped-scroll-root [class*="story-progress"] {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        .wrapped-scroll-container { scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth; }
        .wrapped-scroll-container::-webkit-scrollbar { display: none; width: 0; height: 0; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; cursor: pointer; }
    </style>

        const detectLang = () => {
            try {

        };

        const parseDate = (dataStr) => {
            if (!dataStr) return null;
            let dt = new Date(dataStr.replace('Z', '+00:00'));
            if (!isNaN(dt.getTime())) return dt;
            
            const matchIt = dataStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[,\s]+(\d{1,2}):(\d{2}):(\d{2})/);
            if (matchIt) {
                return new Date(matchIt[3], matchIt[2] - 1, matchIt[1], matchIt[4], matchIt[5], matchIt[6]);
            }

            const match = dataStr.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
            if (match) {
                return new Date(match[1], match[2] - 1, match[3], match[4], match[5]);
            }
            return null;
        };

        const getFasciaIndex = (ora) => {
            if (ora >= 6 && ora < 12) return 1;
            if (ora >= 12 && ora < 18) return 2;

            return 0;
        };

        const isUnknown = (artista, titolo) => {

            const tit = (titolo || '').toLowerCase();
            const paroleChiave = ['unknown', 'sconosciuto', 'sconosciuta'];
            return paroleChiave.some(k => art.includes(k) || tit.includes(k));
        };

        const parseCsvRow = (str) => {
            let arr = [];
            let quote = false;
            let row = '';
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                if (cc === '"' && quote && nc === '"') { row += '"'; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { arr.push(row); row = ''; continue; }
                row += cc;
            }
            arr.push(row);
            return arr;
        };

        const imageCache = new Map();
        const dataUrlCache = new Map(); // artista -> Promise<dataUrl|null>, condivisa tra prefetch e componente per evitare fetch duplicati

        const getArtistPhotoDataUrl = (artist) => {
            if (dataUrlCache.has(artist)) return dataUrlCache.get(artist);
            const promise = (async () => {
                try {
                    const url = await fetchArtwork(artist, undefined, 'artist');
                    if (!url) return null;
                    const res = await fetch(url);
                    if (!res.ok) return null;
                    const blob = await res.blob();
                    return await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.onerror = () => resolve(null);
                        reader.readAsDataURL(blob);
                    });
                } catch (e) {
                    return null;
                }
            })();
            dataUrlCache.set(artist, promise);
            return promise;
        };
        // CONFIGURAZIONE PROXY ITUNES
        // --------------------------------------------------------------
        // L'endpoint pubblico itunes.apple.com/search applica un rate-limit non documentato PER IP.
        // Se questo sito è ospitato su hosting condiviso (GitHub Pages, Netlify, Vercel free, ecc.),
        // le richieste escono dagli IP condivisi della piattaforma, usati da migliaia di altri siti:
        // la quota può risultare già esaurita indipendentemente da quante richieste fa QUESTO sito
        // (403 anche sulla primissima richiesta, per artisti notissimi).
        //
        // Per aggirarlo, tutte le chiamate passano da un piccolo proxy (Cloudflare Worker gratuito,
        // vedi file itunes-proxy-worker.js) che inoltra la richiesta a iTunes da un altro IP e la
        // mette in cache. Se non hai ancora fatto il deploy del Worker, lascia questa costante
        // com'è: il codice chiamerà itunes.apple.com direttamente (stesso comportamento di prima,

        //
        // DOPO aver distribuito il Worker (vedi istruzioni in cima a itunes-proxy-worker.js),

        //   const ITUNES_SEARCH_BASE = 'https://itunes-proxy.tuonome.workers.dev/search';
        const ITUNES_SEARCH_BASE = 'https://itunes-proxy.lenny4250.workers.dev/';
        // NOTA SUL RATE LIMIT DI iTunes: l'endpoint pubblico itunes.apple.com/search applica un limite
        // per IP non documentato ma piuttosto basso (circa 20 richieste/minuto). Quando viene superato,
        // iTunes risponde con un errore SENZA header CORS: il browser lo segnala come "blocked by CORS
        // policy", il che è fuorviante (sembra un problema di permessi, ma è quasi sempre rate-limiting).
        // Il Wrapped può generare decine di richieste ravvicinate (copertine di brani/album/artisti,
        // generi, risoluzione album per YouTube Music, anteprime audio): un semplice limite di
        // concorrenza (N richieste in parallelo) non basta, perché comunque le richieste partono tutte
        // a raffica una dopo l'altra. Qui aggiungiamo anche uno spazio minimo tra una partenza e l'altra
        // (throttle globale), così il RITMO delle richieste resta sotto il limite di iTunes, non solo il
        // numero di richieste contemporanee.
        const MAX_CONCURRENT_IMAGE_REQUESTS = 2;
        const MIN_DISPATCH_SPACING_MS = 260;
        let activeImageRequests = 0;
        let lastDispatchTime = 0;
        const imageRequestQueue = [];

        const runQueued = (fn) => new Promise((resolve) => {
            const runTask = async () => {
                activeImageRequests++;
                const sinceLast = performance.now() - lastDispatchTime;
                if (sinceLast < MIN_DISPATCH_SPACING_MS) {
                    await wait(MIN_DISPATCH_SPACING_MS - sinceLast);
                }
                lastDispatchTime = performance.now();
                try {
                    resolve(await fn());
                } catch (e) {
                    resolve(null);
                } finally {
                    activeImageRequests--;
                    const next = imageRequestQueue.shift();
                    if (next) next();
                }
            };
            if (activeImageRequests < MAX_CONCURRENT_IMAGE_REQUESTS) runTask();
            else imageRequestQueue.push(runTask);
        });

        const wait = (ms) => new Promise(r => setTimeout(r, ms));

        const normalizeForMatch = (s) => (s || '')
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, ' ')
            .trim();

        const artistMatches = (queryArtist, resultArtist) => {
            const q = normalizeForMatch(queryArtist);
            const r = normalizeForMatch(resultArtist);
            if (!q || !r) return false;
            if (q === r) return true;
            const qWords = q.split(' ').filter(w => w.length > 1);
            if (qWords.length === 0) return false;
            return qWords.every(w => r.includes(w)) || r.includes(q) || q.includes(r);
        };

        const stripTitleQualifiers = (s) => (s || '')
            .replace(/[\(\[][^)\]]*(feat|with|explicit|clean|deluxe|remaster|radio edit|bonus track|anniversary|mono|stereo|live|official|video|music video|lyric|visualizer|audio|hd|4k)[^)\]]*[\)\]]/gi, '')
            .replace(/-\s*(single|ep|radio edit|bonus track|official video|music video|lyric video|official audio|visualizer)\s*$/gi, '')
            .replace(/\b(official video|music video|lyric video|official music video|official audio|visualizer|video ufficiale|clip officiel)\b/gi, '')
            .replace(/\s+/g, ' ')
            .trim();

        const fetchArtwork = async (artist, title, type) => {
            const cacheKey = `${type}-${artist}-${title || ''}`;
            if (imageCache.has(cacheKey)) return imageCache.get(cacheKey);

            if (type === 'artist') {
                const photo = await fetchArtistPhoto(artist);
                imageCache.set(cacheKey, photo);
                return photo;
            }

            const entity = type === 'album' ? 'album' : 'musicTrack';
            const cleanTitle = stripTitleQualifiers(title);

            const looksLikeCompilation = (collectionName) => !!collectionName &&
                /various artists|greatest hits|best of|now (that|playing)|mixtape|compilation|goes pop|megamix|top \d|hits collection|essentials?\b|anthology|playlist/i.test(collectionName);

            const findMatch = (results) => {
                const candidates = results.filter(r => {
                    if (r.kind === 'music-video') return false;
                    const resultTitle = type === 'album' ? r.collectionName : r.trackName;
                    return artistMatches(artist, r.artistName) && titleMatches(title, resultTitle);
                });
                if (candidates.length === 0) return null;
                if (candidates.length === 1) return candidates[0];

                const score = (r) => {
                    let s = 0;
                    if (r.kind === 'song') s += 4;
                    if (normalizeForMatch(r.artistName) === normalizeForMatch(artist)) s += 2;
                    const resultTitle = type === 'album' ? r.collectionName : r.trackName;
                    const qTitle = normalizeForMatch(stripTitleQualifiers(title));
                    const rTitle = normalizeForMatch(stripTitleQualifiers(resultTitle));
                    if (qTitle === rTitle) s += 2;
                    if (looksLikeCompilation(r.collectionName)) s -= 5;
                    return s;
                };

                return candidates.slice().sort((a, b) => score(b) - score(a))[0];
            };

            try {
                let results = await searchITunesResults(`${artist} ${cleanTitle}`, entity);
                let match = findMatch(results);

                if (!match) {
                    results = await searchITunesResults(`${artist} ${title}`, entity);
                    match = findMatch(results);
                }

                if (!match) {
                    results = await searchITunesResults(cleanTitle, entity);
                    match = findMatch(results);
                }

                if (match && match.artworkUrl100) {
                    const imgUrl = match.artworkUrl100.replace('100x100bb', '300x300bb');
                    imageCache.set(cacheKey, imgUrl);
                    return imgUrl;
                }
            } catch (e) {
                console.warn("Errore fetch artwork iTunes", e);
            }

            imageCache.set(cacheKey, null);
            return null;
        };

        const titleMatches = (queryTitle, resultTitle) => {
            const q = normalizeForMatch(stripTitleQualifiers(queryTitle));
            const r = normalizeForMatch(stripTitleQualifiers(resultTitle));
            if (!q || !r) return false;
            if (q === r) return true;
            if (q.includes(r) || r.includes(q)) return true;
            const qWords = q.split(' ').filter(w => w.length > 2);
            if (qWords.length === 0) return q === r;
            const rWords = new Set(r.split(' ').filter(w => w.length > 2));
            const shared = qWords.filter(w => rWords.has(w)).length;
            return shared / qWords.length >= 0.4;
        };

        const looksLikeRealPhoto = (url) => !!url && !/\.svg(\?.*)?$/i.test(url);

        // --- INIZIO NUOVE FUNZIONI YOUTUBE MUSIC ALBUMS ---

        // Funzione 1: Cerca il VERO album su iTunes (ignorando i finti album di YT)
        async function getAlbumFromiTunes(title, artist) {
            if (!title || !artist) return null;
            
            // Pulizia dei titoli tipici di YouTube per migliorare la ricerca
            const cleanTitle = title.replace(/(\(Official Video\)|\(Lyric Video\)|\[.*?\]|- Topic)/gi, '').trim();
            const cleanArtist = artist.replace(/ - Topic/gi, '').trim();
            
            const query = encodeURIComponent(`${cleanTitle} ${cleanArtist}`);
            const url = `${ITUNES_SEARCH_BASE}?term=${query}&entity=song&limit=1`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    return {
                        albumName: data.results[0].collectionName, // Il VERO nome
                        albumCover: data.results[0].artworkUrl100.replace('100x100bb', '300x300bb') // Copertina in alta qualità
                    };
                }
            } catch (error) {
                console.warn("Nessun album trovato per:", cleanTitle);
            }
            return null;
        }

        // Funzione 2: Sostituisce il tuo generatore di Top Album
        // ATTENZIONE: Passagli SOLO la lista delle canzoni più ascoltate (es. top 50), NON tutto il file
        async function generateRealYTTopAlbums(topSongsList) {
            console.log("Inizio calcolo accurato degli album...");
            const albumCounts = {};
            
            for (let i = 0; i < topSongsList.length; i++) {
                const song = topSongsList[i];
                
                // Pausa di 300 millisecondi per evitare il blocco da parte di iTunes
                await new Promise(resolve => setTimeout(resolve, 300));
                
                // CERCA: Adatta "song.title" e "song.artist" ai nomi che usi nel tuo codice
                const albumData = await getAlbumFromiTunes(song.title, song.artist);
                
                if (albumData && albumData.albumName) {
                    const albumName = albumData.albumName;
                    
                    // Se l'album non esiste ancora nella nostra classifica, lo creiamo
                    if (!albumCounts[albumName]) {
                        albumCounts[albumName] = {
                            name: albumName,
                            artist: song.artist,
                            cover: albumData.albumCover,
                            playCount: 0
                        };
                    }
                    
                    // Sommiamo gli ascolti. 
                    // CERCA: Adatta "song.playCount" con il nome della tua variabile (es. song.count o song.ascolti)
                    albumCounts[albumName].playCount += song.playCount; 
                }
            }
            
            // Trasformiamo in un array e ordiniamo dal più ascoltato al meno ascoltato
            const sortedAlbums = Object.values(albumCounts).sort((a, b) => b.playCount - a.playCount);
            
            console.log("Top Album reali generati:", sortedAlbums);
            return sortedAlbums; // Ritorna l'array perfetto e invariabile!
        }

        // --- FINE NUOVE FUNZIONI YOUTUBE MUSIC ALBUMS ---

        const looksLikeMusicianDescription = (desc) => {
            if (!desc) return false;
            return /sing|rapp|music|band\b|compos|vocal|songwrit|producer|dj\b|hip.?hop|rock|pop\b|duo|collective|orchestra|record label/i.test(desc);
        };

        const looksLikeNonMusicianDescription = (desc) => {
            if (!desc) return false;
            return /actor\b|actress|footballer|soccer player|basketball player|politician|athlete|wrestler|author\b|novelist|film director|scientist|mathematician|chef\b|painter\b|comedian|entrepreneur|businessman|cricketer|boxer\b/i.test(desc);
        };

        const tryWikipediaPhoto = async (query) => {
            const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=1`;
            const searchRes = await fetch(searchUrl);
            if (!searchRes.ok) return null;
            const searchData = await searchRes.json();
            const pageTitle = searchData?.query?.search?.[0]?.title;
            if (!pageTitle) return null;

            const summaryUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pageTitle.replace(/ /g, '_'))}`;
            const summaryRes = await fetch(summaryUrl);
            if (!summaryRes.ok) return null;
            const summaryData = await summaryRes.json();

            if (summaryData?.type === 'disambiguation') return null;
            if (looksLikeNonMusicianDescription(summaryData?.description)) return null;

            const photoUrl = summaryData?.originalimage?.source || summaryData?.thumbnail?.source || null;
            return looksLikeRealPhoto(photoUrl) ? photoUrl : null;
        };

        const tryWikidataPhoto = async (query) => {
            const searchUrl = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=en&format=json&origin=*&limit=8&type=item`;
            const searchRes = await fetch(searchUrl);
            if (!searchRes.ok) return null;
            const searchData = await searchRes.json();
            const candidates = searchData?.search || [];
            if (candidates.length === 0) return null;

            let musicCandidate = candidates.find(c => looksLikeMusicianDescription(c.description));
            if (!musicCandidate) {
                musicCandidate = candidates.find(c => !looksLikeNonMusicianDescription(c.description));
            }
            if (!musicCandidate) return null;

            const claimUrl = `https://www.wikidata.org/w/api.php?action=wbgetclaims&entity=${musicCandidate.id}&property=P18&format=json&origin=*`;
            const claimRes = await fetch(claimUrl);
            if (!claimRes.ok) return null;
            const claimData = await claimRes.json();
            const fileName = claimData?.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
            if (!fileName) return null;

            const photoUrl = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(fileName.replace(/ /g, '_'))}?width=300`;
            return looksLikeRealPhoto(fileName) ? photoUrl : null;
        };

        const fetchArtistPhoto = (artist) => runQueued(async () => {
            const attempts = [
                () => tryWikidataPhoto(`${artist} musician`),
                () => tryWikidataPhoto(artist),
                () => tryWikipediaPhoto(`${artist} musician`),
                () => tryWikipediaPhoto(artist),
                () => tryWikidataPhoto(`${artist} singer`),
                () => tryWikidataPhoto(`${artist} rapper`),
                () => tryWikipediaPhoto(`${artist} rapper`),
                () => tryWikipediaPhoto(`${artist} band`),
            ];

            for (const attempt of attempts) {
                try {
                    const photo = await attempt();
                    if (photo) return photo;
                } catch (e) {
                    await wait(400);
                    try {
                        const retryPhoto = await attempt();
                        if (retryPhoto) return retryPhoto;
                    } catch (e2) {
                        console.warn("Errore fetch foto artista", e2);
                    }
                }
            }
            return null;
        });

        // NOTA SU AFFIDABILITÀ: le ricerche iTunes (usate per artwork, generi e per risalire all'album dei
        // brani ascoltati su YouTube Music) possono fallire in modo transitorio per rate-limiting o hiccup
        // di rete. Prima non c'era alcun retry: un fallimento veniva silenziosamente trattato come "non
        // trovato", e siccome QUALI richieste fallivano dipendeva dal carico/timing del momento, statistiche
        // come il totale degli album ascoltati risultavano diverse ad ogni ricarica pur partendo dagli
        // stessi dati. Il retry con backoff rende l'esito molto più stabile e riproducibile.
        //
        // "INTERRUTTORE" (circuit breaker): se apri il file direttamente con doppio click (origine
        // file://), il browser blocca SEMPRE le richieste a itunes.apple.com per policy CORS (l'origine
        // "null" non è mai autorizzata) — non è un limite temporaneo che si risolve aspettando, quindi
        // ritentare con backoff su OGNI singola richiesta (copertine, generi, album, anteprime: possono
        // essere decine) è solo tempo sprecato e rende il caricamento lentissimo. Dopo poche richieste
        // fallite di fila, smettiamo di ritentare per un po' e falliamo all'istante, così il resto
        // dell'app (statistiche, grafici, ecc., che non dipendono da iTunes) resta comunque veloce.
        let itunesConsecutiveFailures = 0;
        let itunesDisabledUntil = 0;
        const ITUNES_FAILURE_THRESHOLD = 3;
        const ITUNES_DISABLE_COOLDOWN_MS = 20000;
        const searchITunesResults = async (term, entity) => {
            if (Date.now() < itunesDisabledUntil) return [];
            const url = `${ITUNES_SEARCH_BASE}?term=${encodeURIComponent(term)}&entity=${entity}&limit=15`;
            const data = await runQueued(async () => {
                let lastErr = null;
                const ATTEMPTS = 2;
                for (let attempt = 0; attempt < ATTEMPTS; attempt++) {
                    try {
                        if (attempt > 0) {
                            // Backoff più breve di prima (500ms invece di 800ms-6400ms): con
                            // l'interruttore sopra, un fallimento persistente non genera più
                            // decine di attese lunghe in coda
                            const backoff = 500 * Math.pow(2, attempt - 1);
                            await wait(backoff + Math.random() * 200);
                        }
                        const res = await fetch(url);
                        if (!res.ok) throw new Error(`iTunes HTTP ${res.status}`);
                        itunesConsecutiveFailures = 0;
                        return await res.json();
                    } catch (e) {
                        lastErr = e;
                    }
                }
                itunesConsecutiveFailures++;
                if (itunesConsecutiveFailures >= ITUNES_FAILURE_THRESHOLD) {
                    itunesDisabledUntil = Date.now() + ITUNES_DISABLE_COOLDOWN_MS;
                    console.warn(`iTunes sembra irraggiungibile da questa origine (probabile blocco CORS se il file è aperto con file://): richieste sospese per ${ITUNES_DISABLE_COOLDOWN_MS / 1000}s`);
                }
                console.warn("Errore ricerca iTunes dopo i retry", lastErr);
                return null;
            });
            return data?.results || [];
        };


        // Cache condivisa titolo+artista -> URL dell'anteprima audio di 30s (o null), usata per la
        // musica di sottofondo del Wrapped (copertina, top brano, top album, top artista).
        const previewCache = new Map();
        const fetchTrackPreviewUrl = async (title, artist) => {
            if (!title) return null;
            const cacheKey = `${artist || ''}-${title}`;
            if (previewCache.has(cacheKey)) return previewCache.get(cacheKey);

            const cleanTitle = stripTitleQualifiers(title);

            const findMatch = (results) => {
                const candidates = results.filter(r => r.previewUrl && titleMatches(title, r.trackName) && (!artist || artistMatches(artist, r.artistName)));
                if (candidates.length === 0) return null;
                const score = (r) => {
                    let s = 0;
                    if (artist && normalizeForMatch(r.artistName) === normalizeForMatch(artist)) s += 3;
                    if (normalizeForMatch(stripTitleQualifiers(r.trackName)) === normalizeForMatch(cleanTitle)) s += 2;
                    return s;
                };
                return candidates.slice().sort((a, b) => score(b) - score(a))[0];
            };

            try {
                let results = await searchITunesResults(`${artist || ''} ${cleanTitle}`.trim(), 'song');
                let match = findMatch(results);
                if (!match) {
                    results = await searchITunesResults(cleanTitle, 'song');
                    match = findMatch(results);
                }
                const url = match ? match.previewUrl : null;
                previewCache.set(cacheKey, url);
                return url;
            } catch (e) {
                console.warn("Errore fetch anteprima audio iTunes", e);
                previewCache.set(cacheKey, null);
                return null;
            }
        };

        // Nota: searchITunesDirect è stata rimossa — faceva fetch dirette a itunes.apple.com senza
        // passare dalla coda condivisa (runQueued) né dal retry con backoff, contribuendo a superare
        // il rate-limit di iTunes. Tutte le ricerche ora passano da searchITunesResults.

        // Cache condivisa artista -> genere (Promise), per evitare richieste duplicate tra render
        const genreCache = new Map();
        const fetchArtistGenre = (artistName) => {
            if (genreCache.has(artistName)) return genreCache.get(artistName);
            const promise = (async () => {
                try {
                    let results = await searchITunesResults(artistName, 'musicArtist');
                    let found = results.find(r => artistMatches(artistName, r.artistName) && r.primaryGenreName)?.primaryGenreName;
                    if (!found) {
                        results = await searchITunesResults(artistName, 'song');
                        found = results.find(r => normalizeForMatch(r.artistName) === normalizeForMatch(artistName) && r.primaryGenreName)?.primaryGenreName;
                    }
                    return found || null;
                } catch (e) {
                    return null;
                }
            })();
            genreCache.set(artistName, promise);
            return promise;
        };

        // Cache condivisa titolo+artista -> nome album (Promise), usata per risolvere via iTunes l'album
        // dei brani ascoltati su YouTube Music, il cui storico non include mai questa informazione.
        //
        // FIX instabilità "totale album ascoltati": oltre alla cache in memoria (che dura solo il tempo
        // della sessione), gli abbinamenti trovati con successo vengono salvati anche in localStorage.
        // Così, una volta risolto un brano su un dato dispositivo/browser, resta risolto per sempre:
        // ricaricando la pagina il conteggio non deve più dipendere dalla sorte della rete in quel momento
        // e smette di "ballare" tra un caricamento e l'altro. I fallimenti (non trovato / errore) NON
        // vengono salvati apposta, così ai caricamenti successivi (uniti al retry aggiunto in
        // searchITunesResults) quei brani hanno un'altra possibilità di essere risolti correttamente,
        // invece di restare bloccati per sempre su un esito che poteva essere solo un rate-limit passeggero.
        const ALBUM_CACHE_STORAGE_KEY = 'wrappedAlbumLookupCache_v1';
        const loadStoredAlbumResolutions = () => {
            try {
                const raw = localStorage.getItem(ALBUM_CACHE_STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                return {};
            }
        };
        const storedAlbumResolutions = loadStoredAlbumResolutions();
        const persistAlbumResolution = (cacheKey, albumName) => {
            try {
                storedAlbumResolutions[cacheKey] = albumName;
                localStorage.setItem(ALBUM_CACHE_STORAGE_KEY, JSON.stringify(storedAlbumResolutions));
            } catch (e) {
                // localStorage pieno o non disponibile (es. navigazione privata): non blocchiamo l'app,
                // semplicemente quella risoluzione non verrà ricordata al prossimo caricamento
            }
        };

        const albumLookupCache = new Map();
        Object.entries(storedAlbumResolutions).forEach(([key, albumName]) => {
            albumLookupCache.set(key, Promise.resolve(albumName));
        });

        const looksLikeCompilationAlbum = (collectionName) => !!collectionName &&
            /various artists|greatest hits|best of|now (that|playing)|mixtape|compilation|goes pop|megamix|top \d|hits collection|essentials?\b|anthology|playlist|singles?\b/i.test(collectionName);

        const fetchTrackAlbum = (artistName, trackTitle) => {
            const cacheKey = `${artistName}-|-${trackTitle}`;
            if (albumLookupCache.has(cacheKey)) return albumLookupCache.get(cacheKey);
            const promise = (async () => {
                try {
                    const cleanTitle = stripTitleQualifiers(trackTitle);
                    const findMatch = (results) => results.find(r =>
                        r.collectionName &&
                        artistMatches(artistName, r.artistName) &&
                        titleMatches(trackTitle, r.trackName) &&
                        !looksLikeCompilationAlbum(r.collectionName)
                    );

                    let results = await searchITunesResults(`${artistName} ${cleanTitle}`, 'song');
                    let match = findMatch(results);

                    if (!match) {
                        results = await searchITunesResults(`${artistName} ${trackTitle}`, 'song');
                        match = findMatch(results);
                    }

                    const albumName = match ? match.collectionName : null;
                    if (albumName) persistAlbumResolution(cacheKey, albumName);
                    return albumName;
                } catch (e) {
                    return null;
                }
            })();
            albumLookupCache.set(cacheKey, promise);
            return promise;
        };

        const EntityImage = ({ artist, title, type, altText, className }) => {
            const [src, setSrc] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);

            useEffect(() => {
                let isMounted = true;
                setLoading(true);
                setError(false);
                
                fetchArtwork(artist, title, type).then(url => {
                    if (isMounted) {
                        setSrc(url);
                        setLoading(false);
                    }
                });
                
                return () => { isMounted = false; };
            }, [artist, title, type]);

            if (loading) {
                return <div className={`animate-pulse bg-white/10 ${className}`}></div>;
            }

            if (!src || error) {
                return null;
            }

            return (
                <img 
                    src={src} 
                    alt={altText} 
                    className={`object-cover shadow-md ${className}`} 
                    loading="lazy" 
                    onError={() => setError(true)} 
                />
            );
        };

        // Come EntityImage, ma controlla anche il riquadro/contenitore esterno:
        // se la foto non è disponibile o non carica, il riquadro sparisce del tutto
        // invece di restare vuoto (utile nelle card del Wrapped).
        const EntityImageBox = ({ artist, title, type, altText, boxClassName, imgClassName }) => {
            const [src, setSrc] = useState(null);
            const [status, setStatus] = useState('loading'); // loading | ready | none

            useEffect(() => {
                let isMounted = true;
                setStatus('loading');
                setSrc(null);

                fetchArtwork(artist, title, type).then(url => {
                    if (!isMounted) return;
                    if (!url) { setStatus('none'); return; }
                    setSrc(url);
                    setStatus('ready');
                });

                return () => { isMounted = false; };
            }, [artist, title, type]);

            if (status === 'none') {
                return null;
            }

            return (
                <div className={boxClassName}>
                    {status === 'loading' ? (
                        <div className="animate-pulse bg-white/10 w-full h-full"></div>
                    ) : (
                        <img
                            src={src}
                            alt={altText}
                            className={`object-cover ${imgClassName}`}
                            loading="lazy"
                            onError={() => setStatus('none')}
                        />
                    )}
                </div>
            );
        };

        const shuffleArray = (arr) => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);

        // Striscia di copertine/foto sovrapposte, usata per rendere più "ricche" visivamente
        // le slide con soli numeri (es. numero brani/artisti ascoltati)
        const CoverStrip = ({ items, shape = 'rounded' }) => {
            if (!items || items.length === 0) return null;
            return (
                <div className="flex items-center justify-center">
                    {items.map((item, idx) => (
                        <div
                            key={idx}
                            className={`w-14 h-14 sm:w-16 sm:h-16 overflow-hidden bg-white/10 border-2 border-white/30 shadow-lg animate-pop-in ${shape === 'circle' ? 'rounded-full' : 'rounded-xl'}`}
                            style={{ marginLeft: idx === 0 ? 0 : '-16px', zIndex: 10 - idx, animationDelay: `${idx * 80}ms` }}
                        >
                            <EntityImageBox
                                artist={item.artist}
                                title={item.title}
                                type={item.type}
                                altText={item.artist || item.title}
                                boxClassName="w-full h-full"
                                imgClassName="w-full h-full"
                            />
                        </div>
                    ))}
                </div>
            );
        };

        const RecapArtistPhoto = ({ artist, altText, className }) => {
            const [src, setSrc] = useState(null);
            const [status, setStatus] = useState('loading'); // loading | ready | none

            useEffect(() => {
                let cancelled = false;
                setStatus('loading');
                setSrc(null);

                (async () => {
                    const url = await fetchArtwork(artist, undefined, 'artist');
                    if (cancelled) return;
                    if (!url) { setStatus('none'); return; }
                    setSrc(url);
                    setStatus('ready');
                    // In background, prova a convertirla in data URL: se riesce, la sostituisce (serve per l'export in PNG)
                    const dataUrl = await getArtistPhotoDataUrl(artist);
                    if (!cancelled && dataUrl) setSrc(dataUrl);
                })();

                return () => { cancelled = true; };
            }, [artist]);

            if (status === 'loading') {
                return <div className={`animate-pulse bg-black/10 ${className}`}></div>;
            }
            if (status !== 'ready' || !src) {
                return null;
            }
            return <img src={src} alt={altText} className={`object-cover ${className}`} onError={() => setStatus('none')} />;
        };

        // Palette fissa per artista nella corsa: ogni artista mantiene sempre lo stesso colore lungo tutta l'animazione,
        // così è facile seguirlo mentre supera gli altri, mese dopo mese
        const RACE_COLORS = ['#a855f7', '#ec4899', '#f59e0b', '#22d3ee', '#22c55e', '#f43f5e'];

        // Colore stabile per artista, usato sia per le barre della corsa sia per lo sfondo dinamico
        // della storia "top del mese": l'indice è calcolato sull'ordine degli artisti nell'ULTIMO mese
        // (la classifica finale), non su quello del mese corrente, così un dato artista ha sempre lo
